              schema: { $ref: '#/components/schemas/SavingGoalDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: v2 body (no linked_account_id / allocation_pct).
