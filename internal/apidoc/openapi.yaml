  # ───────────────────────────── Sync ─────────────────────────────
  /sync:
    post:
      tags: [Sync]
      summary: The shared datasets that changed since the app last looked
      operationId: postSync
      description: |
        The app sends the fingerprints it holds (`have`); the server answers with only the datasets whose fingerprint differs, each whole, in the body of its existing endpoint (see SyncDatasets). `want` limits which datasets are considered (omitted = every dataset). A dataset whose `have` matches goes into `unchanged` with no data. `versions` always carries the current fingerprint of every dataset and of the page-data keys (`transactions`, `budgets`, `saving_goals`, `pending`), so the app knows which pages to reload.
        A dataset that fails or times out is listed in `errors`; the others still answer. The `X-Sync-Versions` header on every successful write carries the same fingerprints. A fingerprint is compared, never parsed.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
      responses:
        '200':
          description: The changed datasets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
