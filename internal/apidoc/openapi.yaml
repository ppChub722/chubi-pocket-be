      summary: Delete a budget (hard)
      operationId: deleteBudget
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: Returns {id} (was the legacy envelope).
      x-used-by:
        - { page: budget-detail, calls: 1 }
  /budgets/{id}/periods:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Budgets]
      summary: All periods of a budget ("ดูรอบก่อนหน้าทั้งหมด")
      operationId: listBudgetPeriods
      description: 'Newest first, the current one included.'
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: One page of periods.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPeriodList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: New.
      x-used-by:
        - { page: budget-detail, calls: 1 }
  /budgets/{id}/periods/{period_id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { name: period_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    put:
      tags: [Budgets]
      summary: Edit one period ("เฉพาะรอบนี้")
      operationId: updateBudgetPeriod
      description: '`amount` (null = back to the base amount) and `note`. Returns the budget page at that period.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetPeriodUpdateRequest' }
      responses:
        '200':
          description: The budget page at that period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: New.
      x-used-by:
        - { page: budget-detail, calls: 1 }
  /budgets/{id}/items:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Budgets]
      summary: Everything counted in a period ("ดูอีก n รายการ")
      operationId: listBudgetItems
      description: 'Expected items (upcoming, pending) first, then the used ones newest first. `period_id` default the current period; `source` filters one source.'
      parameters:
        - { name: period_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: source, in: query, schema: { type: string, enum: [normal, recurring, event, upcoming, pending] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: One page of items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetItemList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: New.
      x-used-by:
        - { page: budget-detail, calls: 1 }
  /budgets/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Budgets]
      summary: ปิดงบ (stop counting from today)
      operationId: closeBudget
      description: 'The budget ends today (counting stops after today) and moves to the ended list. 409 INVALID_TRANSITION when it already ended or is archived.'
      responses:
        '200': { description: The budget page., content: { application/json: { schema: { $ref: '#/components/schemas/BudgetDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '409 INVALID_TRANSITION.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-breaking: New.
      x-used-by:
        - { page: budget-detail, calls: 1 }
  /budgets/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Budgets]
      summary: Archive (เก็บถาวร — hidden, restorable)
      operationId: archiveBudget
      responses:
        '200': { description: The budget page., content: { application/json: { schema: { $ref: '#/components/schemas/BudgetDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '409 INVALID_TRANSITION.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-breaking: Returns the budget page.
      x-used-by:
        - { page: budget-detail, calls: 1 }
  /budgets/{id}/restore:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Budgets]
      summary: Restore an archived budget
      operationId: restoreBudget
      responses:
        '200': { description: The budget page., content: { application/json: { schema: { $ref: '#/components/schemas/BudgetDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '409 INVALID_TRANSITION.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-breaking: Returns the budget page.
      x-used-by:
        - { page: budget-detail, calls: 1 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PersonKeyPath:
      name: key
      in: path
      required: true
      description: '`c:<contact_id>` or `n:<name>` (URL-encoded).'
      schema: { $ref: '#/components/schemas/PersonKey' }
  responses:
    ValidationError:
      description: '400 VALIDATION_ERROR (or a module code such as SPLITS_EXCEED_AMOUNT).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '401 UNAUTHORIZED.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '403 FORBIDDEN (or a module code such as SPLITS_AUTHOR_ONLY).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '404 NOT_FOUND (also returned for another user''s record).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ───────── primitives ─────────
    Uuid:
      type: string
      format: uuid
      example: 0191c2a0-0000-7000-8000-000000000001
    Date:
      type: string
      format: date
      description: 'Calendar date in the user''s timezone, `YYYY-MM-DD`.'
      example: '2026-10-12'
    DateTime:
      type: string
      format: date-time
      example: '2026-10-12T09:30:00Z'
    Money:
      type: number
      format: double
      description: 'A decimal amount in the currency of the row it sits on (2 decimals). Always a JSON number, never a string.'
      example: 150.5
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      example: THB
    IconCode:
      type: object
      description: 'How an icon is drawn (the app''s icon spec).'
      properties:
        icon: { type: [string, 'null'] }
        iconColors: { type: array, items: { type: string } }
        background: { type: [string, 'null'] }
        bgColors: { type: array, items: { type: string } }
        border: { type: [string, 'null'] }
        borderColors: { type: array, items: { type: string } }
        shape: { type: [string, 'null'], enum: [circle, squircle, rounded, square, leaf, drop, null] }
    Page:
      type: object
      description: 'Pagination block of a list.'
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 143 }
        total_pages: { type: integer, example: 8 }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'Stable UPPER_SNAKE identifier. Clients key on this.', example: VALIDATION_ERROR }
            message: { type: string, description: 'Human readable; never parse it. '}
            details: {}
    Ids:
      type: array
      items: { $ref: '#/components/schemas/Uuid' }

    # ───────── shared refs (what a row shows about another record) ─────────
    AccountRef:
      type: object
      description: 'A wallet as another row displays it. No balance (it changes; read it from the accounts page).'
      required: [id, name, icon_code, logo_url, type, group, currency, archived]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        logo_url: { type: [string, 'null'] }
        type: { type: string, enum: [cash, bank, e_wallet, credit_card, pay_later] }
        group:
          type: string
          enum: [asset, liability]
          description: 'Computed in the BE (credit_card / pay_later = liability, the rest asset); drives the colour group.'
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        archived: { type: boolean }
      example:
        id: 0191c2a0-0000-7000-8000-000000000001
        name: KBank
        icon_code: { icon: bank, iconColors: ['#FFFFFF'], background: solid, bgColors: ['#138F2D'], border: none, borderColors: [], shape: squircle }
        logo_url: null
        type: bank
        group: asset
        currency: THB
        archived: false
    CategoryRef:
      type: object
      description: 'A category as another row displays it. Sub-categories carry their OWN icon (not the parent''s).'
      required: [id, name, type, icon_code, is_system, system_kind, parent_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        type: { type: string, enum: [expense, income] }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        is_system: { type: boolean, description: 'A reserved category (opening balance, adjustment, transfer, debt paid / received …). '}
        system_kind:
          type: [string, 'null']
          enum: [OPENING_IN, OPENING_OUT, ADJUST_IN, ADJUST_OUT, TRANSFER_IN, TRANSFER_OUT, DEBT_PAID, DEBT_RECEIVED, null]
          description: 'Null for a normal category. The FE localises system names from this.'
        parent_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    EventRef:
      type: object
      description: 'An event (project) as another row displays it.'
      required: [id, name, icon_code, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        status: { type: string, enum: [active, completed, cancelled, archived] }
    TagRef:
      type: object
      required: [id, name, icon_code]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
    UserRef:
      type: object
      description: 'An app user (a shared-wallet author, a linked partner).'
      required: [user_id, display_name, icon_code]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
    PersonRef:
      type: object
      description: |
        A person shown on a split, a debt or a draft. `name` follows the single name rule (nickname when set and shown → linked user's profile name → contact display_name → snapshot when there is no contact). The FE draws 👤 when `contact_id` is null.
      required: [name, contact_id, icon_code, linked, linked_user_id]
      properties:
        name: { type: string, description: 'Resolved display name. '}
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        icon_code:
          description: 'The linked user''s icon, else the contact''s, else null (free name).'
          oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }]
        linked: { type: boolean, description: 'The contact is linked to an app user (draw the 🔗 mark). '}
        linked_user_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
      example:
        name: Beam
        contact_id: 0191c2a0-0000-7000-8000-0000000000aa
        icon_code: null
        linked: true
        linked_user_id: 0191c2a0-0000-7000-8000-0000000000bb
    MemberRef:
      type: object
      description: 'A member of an event.'
      required: [id, user_id, name, icon_code, is_me]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        is_me: { type: boolean }
    TransferPeer:
      type: object
      description: 'The other row of a transfer (the twin), so the page never searches for it.'
      required: [id, direction, account]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        direction:
          type: string
          enum: [out, in]
          description: 'Direction of THIS row (out = the money leaves this wallet).'
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'The other row''s wallet; null = the twin has no wallet (its wallet was deleted), so the page shows "ไม่ผูกกระเป๋า" and offers to pick one.' }

    # ───────── transactions ─────────
    Split:
      type: object
      description: 'One person a bill is split with (my book) = a split-sourced debt entry (source kind transaction).'
      required: [debt_id, key, person, person_name, direction, amount, paid]
      properties:
        debt_id: { $ref: '#/components/schemas/Uuid', description: 'The debt entry id (GET /personal-debts/{id}).' }
        key: { $ref: '#/components/schemas/PersonKey', description: 'Link to the person page.' }
        person: { $ref: '#/components/schemas/PersonRef' }
        person_name: { type: string, description: 'Same as person.name (kept so a row can read one key). '}
        direction: { type: string, enum: [paid, received], description: 'The entry direction: an expense split = paid (they owe me), an income split = received (I owe them).' }
        amount: { $ref: '#/components/schemas/Money' }
        paid: { type: boolean, description: 'The entry''s "จ่ายแล้ว" label.' }
    Transaction:
      type: object
      description: |
        A transaction row, page-ready. Same shape in lists, detail and write responses; `splits` is filled on detail and write responses and `null` on list rows.
      required:
        - id
        - user_id
        - type
        - amount
        - currency
        - date
        - description
        - note
        - account
        - category
        - tags
        - project
        - transfer_group_id
        - transfer_peer
        - counterparty
        - event_bill
        - recurring_item
        - source_project_transaction_id
        - my_share
        - split_count
        - splits
        - can_split
        - can_edit_splits
        - can_join_event
        - created_by
        - is_locked
        - can_edit_category
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [expense, income, transfer] }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'Null = no wallet (floating). '}
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }], description: 'On another member''s row in a shared wallet this is the AUTHOR''s category (read-only; see can_edit_category). '}
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        project: { oneOf: [{ $ref: '#/components/schemas/EventRef' }, { type: 'null' }] }
        transfer_group_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        transfer_peer: { oneOf: [{ $ref: '#/components/schemas/TransferPeer' }, { type: 'null' }], description: 'Non-null on transfer rows only. '}
        recurring_item: { oneOf: [{ $ref: '#/components/schemas/RecurringItemLink' }, { type: 'null' }], description: 'Set when a recurring item is linked to this row (produced into it / created from it).' }
        event_bill: { oneOf: [{ $ref: '#/components/schemas/EventBillLink' }, { type: 'null' }], description: 'Set when the row is in an event (tx detail "อยู่ในอีเวนต์ … ›" → the bill).' }
        counterparty: { oneOf: [{ $ref: '#/components/schemas/DebtLink' }, { type: 'null' }], description: 'Set when this row is a debt entry''s wallet transaction (one record: editing / deleting either side changes both; open it in debt mode). Replaces is_repayment / source_personal_debt_id.' }
        source_project_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        my_share: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Amount minus what others owe on it; expense / income only, null for transfers. What reports and budgets count.' }
        split_count: { type: integer, minimum: 0 }
        splits: { type: [array, 'null'], items: { $ref: '#/components/schemas/Split' }, description: 'Detail and write responses only; null on list rows. '}
        can_split: { type: boolean }
        can_edit_splits: { type: boolean }
        can_join_event: { type: boolean }
        created_by: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'Set on rows of a shared wallet (more than one active member). '}
        is_locked: { type: boolean }
        can_edit_category: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
      example:
        id: 0191c2a0-0000-7000-8000-0000000000f1
        user_id: 0191c2a0-0000-7000-8000-0000000000a1
        type: expense
        amount: 300
        currency: THB
        date: '2026-10-12'
        description: 'Dinner'
        note: null
        account: { id: 0191c2a0-0000-7000-8000-000000000001, name: KBank, icon_code: null, logo_url: null, type: bank, group: asset, currency: THB, archived: false }
        category: { id: 0191c2a0-0000-7000-8000-000000000002, name: Food, type: expense, icon_code: null, is_system: false, system_kind: null, parent_id: null }
        tags: [{ id: 0191c2a0-0000-7000-8000-000000000003, name: friends, icon_code: null }]
        project: null
        transfer_group_id: null
        transfer_peer: null
        counterparty: null
        event_bill: null
        recurring_item: null
        source_project_transaction_id: null
        my_share: 200
        split_count: 1
        splits: [{ debt_id: 0191c2a0-0000-7000-8000-0000000000d1, person: { name: Beam, contact_id: null, icon_code: null, linked: false, linked_user_id: null }, person_name: Beam, key: n:beam, direction: paid, amount: 100, paid: false }]
        can_split: true
        can_edit_splits: true
        can_join_event: true
        created_by: null
        is_locked: false
        can_edit_category: true
        created_at: '2026-10-12T09:30:00Z'
        updated_at: '2026-10-12T09:30:00Z'
    WalletBalance:
      type: object
      description: "A wallet's balance right after a write."
      required: [account_id, balance]
      properties:
        account_id: { $ref: '#/components/schemas/Uuid' }
        balance: { $ref: '#/components/schemas/Money' }
    TransactionWriteResult:
      type: object
      description: 'What a transaction write returns: the row(s) in their final state and the post-write balance of every wallet touched. A row that is a debt entry''s wallet side also returns that person''s new balance.'
      required: [rows, account_balances, person_balance, upcoming]
      properties:
        rows:
          type: array
          minItems: 0
          maxItems: 2
          items: { $ref: '#/components/schemas/Transaction' }
          description: 'One row (expense / income) or both rows of a transfer (the OUT row first).'
        account_balances:
          type: array
          items: { $ref: '#/components/schemas/WalletBalance' }
        person_balance: { oneOf: [{ $ref: '#/components/schemas/DebtPerson' }, { type: 'null' }], description: 'Non-null when the row is a debt entry''s wallet side (counterparty set).' }
        upcoming: { oneOf: [{ $ref: '#/components/schemas/RecurringItem' }, { type: 'null' }], description: 'A date after today: the write made / moved an upcoming item instead (rows = []).' }
    Totals:
      type: object
      description: 'Money over the WHOLE filtered set (every page). Transfers count in neither side.'
      required: [income, expense, net, count]
      properties:
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        count: { type: integer, description: 'income + expense rows (pagination.total also counts transfers). '}
    TransactionList:
      type: object
      required: [data, pagination, totals]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        pagination: { $ref: '#/components/schemas/Page' }
        totals: { $ref: '#/components/schemas/Totals' }
    SplitInput:
      type: object
      required: [person_name, owed_amount]
      properties:
        person_name: { type: string, minLength: 1, maxLength: 100, description: 'Typed name; with contact_id the name follows the contact and this is only the stored fallback.' }
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        owed_amount: { type: number, exclusiveMinimum: 0 }
    CreateTransactionRequest:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [expense, income, transfer] }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Null = no wallet (not allowed for transfers). '}
        transfer_to_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        amount: { type: number, exclusiveMinimum: 0 }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        splits: { type: array, items: { $ref: '#/components/schemas/SplitInput' }, description: 'Σ owed_amount ≤ amount; expense / income only.' }
        my_share: { type: [number, 'null'], exclusiveMinimum: 0 }
        source_project_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Event resolve flow only. '}
    UpdateTransactionRequest:
      type: object
      description: 'Partial. A key present with `null` clears category_id / description / note / account_id / transfer_to_account_id. `type` is immutable. On a transfer, account_id is the OUT leg''s wallet and transfer_to_account_id the IN leg''s; each can be re-filed on its own (a wallet-less leg can be given a wallet), but a leg that has a wallet cannot be cleared (400 VALIDATION_ERROR) and the two legs cannot share a wallet (TRANSFER_SAME_ACCOUNT).'
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        date: { $ref: '#/components/schemas/Date' }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        transfer_to_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        also_update_link: { type: boolean, description: 'Also change the linked side (an event bill made from this row, a recurring item); the app asks at save.' }
    SplitEdit:
      type: object
      required: [owed_amount]
      description: 'An existing split (`debt_id`) is kept / re-amounted; without `debt_id` it adds a person.'
      properties:
        debt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        person_name: { type: string, maxLength: 100, description: 'Free-name rows only; ignored when the split has a contact. '}
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Present with a value = switch / link the contact; present with null = back to a free name; absent = unchanged.' }
        owed_amount: { type: number, exclusiveMinimum: 0 }
    EditSplitsRequest:
      type: object
      required: [splits]
      properties:
        splits: { type: array, items: { $ref: '#/components/schemas/SplitEdit' } }
    SetTagsRequest:
      type: object
      required: [tag_ids]
      properties:
        tag_ids: { $ref: '#/components/schemas/Ids' }
    DeleteTransactionResult:
      type: object
      required: [id, account_balances, debt_entry_id, person_balance, recurring_item_id, bill_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        recurring_item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The recurring item deleted with it (also_delete_link).' }
        bill_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The event bill deleted with it (also_delete_link).' }
        debt_entry_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The debt entry deleted with it (the row was its wallet side; one record).' }
        person_balance: { oneOf: [{ $ref: '#/components/schemas/DebtPerson' }, { type: 'null' }], description: 'That person''s new balance (null when no entry went).' }
        account_balances:
          type: array
          description: 'The balance of every wallet the delete touched (a transfer touches two).'
          items: { $ref: '#/components/schemas/WalletBalance' }

    # ───────── pending ─────────
    Draft:
      type: object
      description: 'The POST /transactions body plus tag ids and an event; every key optional while it waits.'
      properties:
        type: { type: string, enum: [expense, income, transfer, saving], description: 'saving = a saving draft (kind saving).' }
        goal_id: { $ref: '#/components/schemas/Uuid', description: 'kind saving: the goal (absent = spare).' }
        amount: { type: number, minimum: 0 }
        account_id: { $ref: '#/components/schemas/Uuid' }
        category_id: { $ref: '#/components/schemas/Uuid' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 500 }
        transfer_to_account_id: { $ref: '#/components/schemas/Uuid' }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        splits: { type: array, items: { type: object, properties: { person_name: { type: string }, contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, owed_amount: { type: number } } }, description: 'May be incomplete or unbalanced; validated at submit. '}
        project_id: { $ref: '#/components/schemas/Uuid' }
    DraftResolved:
      type: object
      description: 'Read-only; the draft''s ids resolved so the page renders without other calls. A dangling id (deleted account / category / event …) is `null` here and listed in `missing`.'
      required: [account, transfer_to_account, category, tags, project, goal, splits, missing]
      properties:
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        transfer_to_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        project: { oneOf: [{ $ref: '#/components/schemas/EventRef' }, { type: 'null' }] }
        goal: { oneOf: [{ $ref: '#/components/schemas/SavingGoalRef' }, { type: 'null' }] }
        splits:
          type: array
          description: 'One per draft split, same order.'
          items:
            type: object
            required: [person, owed_amount]
            properties:
              person: { $ref: '#/components/schemas/PersonRef' }
              owed_amount: { type: number }
        missing:
          type: array
          items: { type: string, enum: [account_id, transfer_to_account_id, category_id, tag_ids, project_id, contact_id, goal_id] }
    SubmitError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            MISSING_TYPE, MISSING_AMOUNT, MISSING_DATE, MISSING_ACCOUNT, WALLET_NOT_TRACKED, GOAL_NOT_ACTIVE, INVALID_SPLIT, SPLITS_EXCEED_AMOUNT, ACCOUNT_NOT_FOUND, CATEGORY_NOT_FOUND, CATEGORY_TYPE_MISMATCH, TRANSFER_SAME_ACCOUNT, TRANSFER_NEEDS_WALLETS, SPLITS_ON_TRANSFER, CONTACT_NOT_FOUND, TAG_NOT_FOUND, PROJECT_NOT_FOUND, PROJECT_NOT_ACTIVE, PROJECT_LOCKED, PROJECT_NOT_MEMBER, PROJECT_READ_ONLY, TX_NOT_BILLABLE, DEBT_NOT_FOUND, DEBT_ALREADY_SETTLED, OVERPAYMENT, TRANSACTION_NOT_FOUND, NOT_FOUND, SUBMIT_FAILED.
        message: { type: string }
    PendingTransaction:
      type: object
      required: [id, source, kind, draft, resolved, target_debt_id, target_transaction_id, source_ref, last_error, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, description: 'manual now; project_copy, project_update, ocr, chat later.' }
        kind: { type: string, enum: [create, settle_debt, update_tx, saving], description: 'saving = on submit, a saving entry (`draft.amount` from `draft.account_id` into `draft.goal_id`, none = spare); never a transaction. settle_debt = on submit, a debt entry with target_debt_id''s person in the opposite direction (repaying it), into draft.account_id (none = ledger-only).' }
        draft: { $ref: '#/components/schemas/Draft' }
        resolved: { $ref: '#/components/schemas/DraftResolved' }
        target_debt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        target_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        source_ref: { type: [object, 'null'], description: 'What to show for a non-manual source ("Aom paid ฿300", a scanned slip …). `source` recurring | upcoming (a draft the recurring due check produced): `{item_id, recurring: {id, name, icon_code} | null, seq, total}` → the chip "🔁 Netflix · 3/12" / "ล่วงหน้า". Submitting it links the new transaction to the item; discarding it leaves the item "ยังไม่สร้าง".'}
        last_error: { oneOf: [{ $ref: '#/components/schemas/SubmitError' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
      example:
        id: 0191c2a0-0000-7000-8000-0000000000e1
        source: manual
        kind: create
        draft: { type: expense, amount: 120, account_id: 0191c2a0-0000-7000-8000-000000000001, date: '2026-10-12', project_id: 0191c2a0-0000-7000-8000-0000000000c1 }
        resolved: { account: null, transfer_to_account: null, category: null, tags: [], project: { id: 0191c2a0-0000-7000-8000-0000000000c1, name: Chiang Mai trip, icon_code: null, status: active }, splits: [], missing: [] }
        target_debt_id: null
        target_transaction_id: null
        source_ref: null
        last_error: null
        created_at: '2026-10-12T09:30:00Z'
        updated_at: '2026-10-12T09:30:00Z'
    PendingList:
      type: object
      required: [data, count]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PendingTransaction' } }
        count: { type: integer }
    CreatePendingRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [draft]
            properties:
              draft: { $ref: '#/components/schemas/Draft' }
    UpdatePendingRequest:
      type: object
      required: [draft]
      properties:
        draft: { $ref: '#/components/schemas/Draft' }
    IdsRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } }
    DiscardResult:
      type: object
      required: [discarded, skipped, remaining_count]
      properties:
        discarded: { $ref: '#/components/schemas/Ids' }
        skipped: { $ref: '#/components/schemas/Ids' }
        remaining_count: { type: integer, description: 'Drafts left after the discard. '}
    SubmitResult:
      type: object
      required: [submitted, failed, account_balances, badges]
      properties:
        account_balances:
          type: array
          description: 'Post-submit balance of every wallet touched by any submitted draft (transfers touch two; one entry per wallet).'
          items: { $ref: '#/components/schemas/WalletBalance' }
        submitted:
          type: array
          items:
            type: object
            required: [id, rows, saving_entry_id]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              rows: { type: array, minItems: 0, maxItems: 2, items: { $ref: '#/components/schemas/Transaction' }, description: 'The created row(s), final state (a transfer returns both rows, OUT first). [] for a saving draft.' }
              saving_entry_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'A saving draft (kind saving): the saving entry it became.' }
        failed:
          type: array
          items:
            type: object
            required: [id, error, pending]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              error: { $ref: '#/components/schemas/SubmitError' }
              pending: { oneOf: [{ $ref: '#/components/schemas/PendingTransaction' }, { type: 'null' }], description: 'The draft with last_error set; null when the draft no longer exists. '}
        badges: { $ref: '#/components/schemas/Badges' }

