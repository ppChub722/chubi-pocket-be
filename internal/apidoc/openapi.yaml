        - **Who:** an event bill by the event's rights; a split bill by every member who is an app user (S3).
        - **Payer may change** (owner Q-B4; PAYER_FIXED is gone): every member's copy follows its new role (payer → the whole bill; the old payer → their share with no wallet, "จ่ายโดย" the new payer, unless paid back); the bill's origin moves to the new payer's copy.
        - **Fan-out (S5):** the saved bill reaches every other member by their switch, as on create (copy amount / date / description / note, and their debts: added / re-amounted / removed as shares appear / change / go). MY copy and my debts always follow (I am editing it); `apply_to_my_tx` is no longer needed (ignored).
        - **`expected_updated_at` (S14):** the bill's `updated_at` from GET; when the bill changed since → 409 BILL_CHANGED (`details.bill` = the EventBillView now), nothing saved ("บิลถูกแก้แล้ว โหลดใหม่"). Absent = no check.
        - **`move` (S17):** the bill moves to another event (`project_id` / `new_event`) or out of its event into a split bill (`split: true`), with its people (added as members of the target when missing) and every copy kept connected (same bill id). Rights: edit the source + add bills in the target. Moving out of a split into an event deletes the empty hidden split. Errors: 400 MOVE_TARGET (exactly one; not the same event), 409 PROJECT_LOCKED.
