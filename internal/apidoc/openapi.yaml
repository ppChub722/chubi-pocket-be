  /event-bills:
    post:
      tags: [Events]
      summary: Save a new shared bill (event bill or split bill) + my copy in ONE call
      operationId: bookEventBill
      description: |
        0.4.1-1 E8. The event bill sheet's save, and the quick-create อีเวนต์ tab: the bill (or payback), the payback rows of the people marked "คืนแล้ว", and every part of MY book, all in ONE DB transaction (nothing is half-saved; it replaces addBills / createProjectTransaction + resolveProjectPeople + my-books + debt entries + repayments + transactions chained by the app). `project_id` = an existing event, `new_event` = make the event first (quick create), or `split: true` = a **split bill** (0.4.1-2).
        **Shared bills (0.4.1-2 S1 / S2 / S5 / S6).** An event bill and a split bill are the same thing, a *shared bill*: one bill, every member holds their own copy in their book. A split bill is a bill with no event: the BE keeps it in a hidden one-bill "event" (`Event.kind` / `EventRef.kind` = `split`) that never shows in the events list, the event numbers, settle or the event pickers; its people are its members (a connected contact = a linked member, active at once, no invite; a name / unconnected contact = a name-only member). **Every split is a split bill** (owner Q-B3, and 2026-10-27 for paid_by): quick create's แบ่งกับคน (payer = me) and คนจ่ายแทน / รับแทน (payer = that person, members = me + them) both save here with `split: true`, whoever the people are; a name-only person just gets no copy. The transaction `splits` / `paid_by` of POST / PUT /transactions are deprecated (retired in S16 once the app moved).
        **The other members (S5 / S6).** On every create and every bill edit, each OTHER member who is an app user (linked, active, not disconnected from this bill) gets their copy by THEIR auto-sync switch (events: `auto_sync_events`, split bills: `auto_sync_debts`): on → their copy is written in the same DB transaction (see "A member's copy" below) and they get an info notice (`shared_bill_created` on create, `project_tx_changed` on an edit; muted = silent); off → only the notice, which asks (and comes even when its type is muted, owner 2026-10-28) ("เพิ่มในสมุด" / "อัปเดตตาม" = POST /event-bills/{pt_id}/apply; "no" = dismiss, their copy stays as it was, shown "ไม่ตรง"). A newer notice about the same bill supersedes the older unanswered one.
        **A member's copy** (the same rules for me and for everyone; only category, wallet, tags and `private_note` are each member's own and never synced): payer → a transaction of the WHOLE bill (the bill's origin when the payer is me and I booked it here; a remote payer's copy arrives with no wallet: "เลือกกระเป๋า") + a debt per other member with a share who is not paid back ("X owes me"); a member with a share S, someone else paid → a transaction of S with NO wallet ("จ่ายโดย P") + the debt "I owe P S"; that member paid back ("คืนแล้ว") → the transaction of S (wallet: mine to pick), no debt. Payback bills: the remote side gets a repayment row (no transaction). A copy arrives with no category and no tags ("เลือกหมวด" / "เลือก tag"). The copy and its debts are connected (the debt's `bills[]` lists the bill; the copy is that bill part's `transaction_id`).
        **What goes into my book** (`my_books.on`; the bill's people are resolved / added like EventBillInput's payer / members):
        - **I paid** (payer = me): `tx` = my transaction for the WHOLE bill from `my_books.account_id` (the bill's origin: event_bill.linked); `debt` = each other member with a share who is not `paid_back` owes me their share (a debt linked to the bill). A member `paid_back` ("คืนแล้ว"): a payback row on the board (them → me) and, with `debt`, a debt + an immediate repayment received into `my_books.account_id` (no wallet = a person-book repayment without a transaction): their balance stays 0, my wallet is right.
        - **Someone else paid** (payer = X) and I have a share S: not paid back → `tx` = my share S with NO wallet ("จ่ายโดย X": `account_id` is ignored) and `debt` = I owe X S. I am `paid_back` → `tx` = my share S from `my_books.account_id`, NO debt, and a payback row (me → X) on the board.
        - **Payback** (from → to, me one of them): `debt` = the debt it clears (I owe / they owe, linked to the row); `tx` = the repayment (paid / received) from / into `my_books.account_id`. `debt` null / absent = the server decides: true unless my book already holds THIS event's debt with that person (my debts linked to its bills with them, minus repayments linked to it, cover the amount).
        - Tags: `bill.tag_ids` = event tags; absent and I paid → my tx's personal tags become event tags by name (as addBills). `my_books.tag_ids` = my personal tags on my transaction.
        - `my_books.on` with no part of the bill being mine (not payer, no share, not in the payback): 422 NO_SHARE_TO_COPY.
        **`?preview=true`**: a dry run (rolled back): `EventBillBookPreview`, every person whose balance would move (before / after / flipped) and every wallet (before / after), plus what `debt` would default to. The sheet's before → after lines come from it; nothing is saved, no notification goes out.
        Notifications (0.4.1-2): every other linked member with a part gets `shared_bill_created` (replaces project_tx_recorded_for_you, which is no longer sent); linked people added to an EVENT get project_added (a split bill sends no project_added).
        Payer: someone else may pay an income bill too (0.4.1-2, owner Q-E3: "รับแทน", same as an expense; the words change).
