        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '409 PROJECT_LOCKED / PT_IS_CHILD / ACCOUNT_ARCHIVED / BILL_CHANGED (details.bill = the EventBillView now).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
