      }

    # ───────── notifications ─────────
    NotificationSettings:
      type: object
      required: [muted_types, auto_types, default_account, auto_resolve_own_in_projects, updated_at]
      properties:
        muted_types: { type: array, items: { type: string } }
        auto_types: { type: array, items: { type: string } }
        default_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'The wallet the split_paid auto-action records into; null = no wallet. '}
        auto_resolve_own_in_projects: { type: boolean }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    UpdateNotificationSettingsRequest:
      type: object
      properties:
        muted_types: { type: array, items: { type: string } }
        auto_types: { type: array, items: { type: string } }
        default_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'A key present with null clears it. '}
        auto_resolve_own_in_projects: { type: boolean }

    # ───────── categories ─────────
    Category: {
        "type": "object",
        "required": [
          "id",
          "name",
          "type",
          "parent_id",
          "depth",
          "path",
          "is_system",
          "system_kind",
          "icon_code",
          "sort_order",
          "include_in_report",
          "description",
          "note",
          "status",
          "created_at",
          "updated_at"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "name": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "expense",
              "income"
            ]
          },
          "parent_id": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/Uuid"
              },
              {
                "type": "null"
              }
            ]
          },
          "depth": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3,
            "description": "1 = root."
          },
          "path": {
            "type": "array",
            "description": "The ancestors from the root down to the parent (empty for a root): the breadcrumb.",
            "items": {
              "type": "object",
              "required": [
                "id",
                "name"
              ],
              "properties": {
                "id": {
                  "$ref": "#/components/schemas/Uuid"
                },
                "name": {
                  "type": "string"
                }
              }
            }
          },
          "is_system": {
            "type": "boolean"
          },
          "system_kind": {
            "type": [
              "string",
              "null"
            ],
            "description": "See CategoryRef."
          },
