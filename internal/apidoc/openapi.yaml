        net: { $ref: '#/components/schemas/Money' }
    DebtPeopleList:
      type: object
      required: [data, totals, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DebtPerson' } }
        totals: { $ref: '#/components/schemas/DebtTotals' }
        pagination: { $ref: '#/components/schemas/Page' }
    DebtSource:
      type: object
      description: |
        Where a split-sourced entry came from (such an entry edits only description / note / paid):
        `transaction` = a split on my bill (id = that transaction, title = its description or category name);
        `event` = a split on an event board (id = the event, title = the event name);
        `partner` = another user's split on me (id = null, title = their display name).
      required: [kind, id, title]
      properties:
        kind: { type: string, enum: [transaction, event, partner] }
        id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        title: { type: [string, 'null'] }
    DebtEntryTx:
      type: object
      description: 'The wallet transaction of an entry (light ref for list rows).'
      required: [id, account]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'Null only for an old floating repayment.' }
    DebtEntry:
      type: object
      required: [id, key, direction, amount, date, description, note, paid, source, transaction, created_at, in_current_cycle, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/PersonKey' }
        direction: { type: string, enum: [paid, received], description: 'paid = I paid them (net +); received = they paid me (net −).' }
        amount: { $ref: '#/components/schemas/Money', description: 'Always > 0.' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
