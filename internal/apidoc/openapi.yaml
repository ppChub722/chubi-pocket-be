openapi: 3.1.0
info:
  title: Chubi Pocket API
  version: 0.3.1-9-draft2
  description: |
    Source of truth for the 0.3.1-9 API rework (owner-approved 2026-10-12). Served as JSON at `GET /api/v1/openapi.json`.
    Status: **DRAFT for owner review** — nothing here is implemented yet except this document and its route.

    ## Rules this spec follows
    - **Old app builds don't matter.** 0.3.1-9 forces an update (`MIN_APP_BUILD` = its build). Shapes are clean: fields are renamed or replaced, snapshot keys are dropped, there are no "old key kept for old builds". Every breaking change carries `x-breaking`.
    - **Thin FE.** The FE only displays. One button = one call; one page open = one page-ready call; a write returns the final state (the changed resource, with every embedded ref resolved); aggregates, statuses and display flags are computed in the BE.
    - **No lookup lists.** Anything a row shows about another record (account / category / event / tag / person: name, icon, colour, flag) is embedded in the row. The FE never loads a whole list to look a name up by id. Pickers may still load their list.
    - **Person display name** (one SQL fragment, everywhere, including the contacts module): (1) the contact's `nickname` when it is set AND `show_nickname` is on → (2) else, when the contact is linked, the linked user's live profile name → (3) else the contact's `display_name` → (4) the stored snapshot `person_name` only when the row has no contact. Resolved server-side; the snapshot never reaches the FE when a contact exists.
    - **Wallet balances.** Every write returns the post-write balances of ALL wallets it touched (`account_balances: [{account_id, balance}]`; a transfer touches two). The FE patches its wallet cards from the response and never reloads `/accounts` after a write. That includes the money-moving writes of pages not redesigned yet (debt settle, event bills, quick create, scheduled generate-now): they are listed below as touch-points and gain only `account_balances`; the FE adopts it on those pages in their own rounds.
    - **Errors.** Any operation may also answer 400 / 401 / 403 / 404 / 409 with the `Error` schema; the stable `code`s (e.g. ROW_LOCKED, CATEGORY_AUTHOR_ONLY, SPLITS_AUTHOR_ONLY, SYSTEM_TRANSACTION_IMMUTABLE, TAG_NOT_FOUND, ACCOUNT_NOT_FOUND, CONTACT_ARCHIVED) are documented per module in design/api. A tag id that is not the caller's is 400 TAG_NOT_FOUND.
    - **Keys.** A response object always carries every documented key; "none" is `null`; arrays are never `null`. Money is a JSON number in the row's currency (2 decimals, never a string). Dates are `YYYY-MM-DD` (the user's calendar date), timestamps RFC 3339. Ids are UUIDs.
    - **Envelope (unchanged).** A single resource is the bare object; a list is `{data, pagination}` (or `{data, count}` where noted); errors are `{success:false, error:{code, message, details}}`.
    - `x-used-by` = `[{page, calls}]`: the FE pages that call the operation and how many times per page open (or per user action). `x-breaking` = a string saying what breaks.

    ## Scope of this draft (v2)
    **Every endpoint the reached pages use, in its target shape**: home / dashboard, transaction list + detail + forms (incl. the one-call `getTransactionFormOptions`), quick create, pending, wallets (+ members), categories, tags, contacts (+ link requests), notifications + settings, more, auth / me / app version. **Not** in: debts people / person endpoints (0.3.1-10).
    Pages not yet reached (debts, events, budgets, scheduled, goals) only receive the shared-shape change that applies to them; those operations are tagged `Touch-point`.
    The hub's "used by" comes from the FE page-flow registry (page → trigger → operationId), so `x-used-by` is optional; `operationId`s are stable.

    ## Coverage
    The `x-registered-routes` / `x-spec-routes` fields (added when served) count the routes the server registers and the method + path pairs described here. Routes not yet in this spec keep their current shape (see the coverage note in `ai/inbox/be.md`).
  x-contact-person-name-rule: (nickname if set and show_nickname) -> linked user's profile name -> contact display_name -> snapshot person_name
servers:
  - url: /api/v1
    description: 'Same origin as the app''s API base URL.'
tags:
  - name: Transactions
  - name: Pending
  - name: Me
  - name: Categories
  - name: Contacts
  - name: Notifications
  - name: Dashboard
  - name: Touch-point
    description: 'Pages not redesigned yet; only the shared-shape change is listed.'
security:
  - bearerAuth: []

paths:
  # ───────────────────────────── Transactions ─────────────────────────────
  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions (page-ready rows)
      description: |
        Every row carries its account, category, event, tags and (for transfers) the twin, already resolved. `totals` cover the whole filtered set, not just the page.
      operationId: listTransactions
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: account_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: category_id, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: include_children, in: query, description: 'With category_id, also its sub-categories.', schema: { type: boolean } }
        - { name: uncategorized, in: query, schema: { type: boolean } }
        - { name: type, in: query, schema: { type: string, enum: [expense, income, transfer] } }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/Date' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/Date' } }
        - { name: no_wallet, in: query, description: 'Only rows without a wallet.', schema: { type: boolean } }
        - { name: q, in: query, description: 'Substring over description, note, category (incl. parent) and wallet names (max 100).', schema: { type: string, maxLength: 100 } }
        - { name: tag_id, in: query, description: 'Repeatable; rows having ANY of these tags.', schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: true }
        - { name: sort, in: query, schema: { type: string, enum: [date_desc, date_asc, amount_desc, amount_asc], default: date_desc } }
      responses:
        '200':
          description: 'One page of rows plus totals over the whole filtered set.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: "Row shape changes (see Transaction): account/category/project become full refs, is_resolve is renamed is_repayment, category_render / is_recurring are gone, transfer rows gain transfer_peer."
      x-used-by:
        - { page: transactions-list, calls: 1 }
        - { page: wallet-detail, calls: 1 }
        - { page: category-detail, calls: 1 }
    post:
      tags: [Transactions]
      summary: Create a transaction (or a transfer)
      description: |
        Returns a `TransactionWriteResult`: `rows` (one row, or both rows of a transfer) in their final state + `account_balances`. `tag_ids` attach the tags in the same call; with `splits`, the response already contains them (`splits[]` with resolved persons).
        `project_id` is not accepted (events are joined through the bills endpoints).
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
            examples:
              expenseWithSplitAndTags:
                value:
                  type: expense
                  account_id: 0191c2a0-0000-7000-8000-000000000001
                  category_id: 0191c2a0-0000-7000-8000-000000000002
                  amount: 300
                  date: '2026-10-12'
                  description: 'Dinner'
                  tag_ids: [0191c2a0-0000-7000-8000-000000000003]
                  splits: [{ person_name: Beam, contact_id: null, owed_amount: 100 }]
      responses:
        '201':
          description: "The created row(s) and the touched wallets' balances."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionWriteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: "Request: tag_ids added, project_id removed. Response: TransactionWriteResult {rows, account_balances} (was a bare Transaction / {transfer_group_id, rows})."
      x-used-by:
        - { page: quick-create-sheet, calls: 1 }
        - { page: pending, calls: 0 }
  /transactions/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Transactions]
      summary: Transaction detail (page-ready)
      description: 'One call renders the whole detail page: refs, tags, event, transfer twin, the splits (with resolved persons) and the capability flags.'
      operationId: getTransaction
      responses:
        '200':
          description: 'The row with `splits` filled in (an empty array when it has none).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: Shape changes, see Transaction.
      x-used-by:
        - { page: transaction-detail, calls: 1 }
    put:
      tags: [Transactions]
      summary: Edit a transaction
      description: |
        Partial body; a key present with `null` clears the field. `tag_ids` (when present) REPLACES the tag set. Returns a `TransactionWriteResult` (the edited row, both rows for a transfer, and the touched wallets' balances; moving a row to another wallet touches two).
      operationId: updateTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTransactionRequest' }
      responses:
        '200':
          description: "The edited row(s) and the touched wallets' balances."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionWriteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "Request: tag_ids added. Response: TransactionWriteResult {rows, account_balances}."
      x-used-by:
        - { page: transaction-detail, calls: 1 }
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      description: 'Returns the wallet balances after the delete so the FE patches instead of refetching accounts.'
      operationId: deleteTransaction
      responses:
        '200':
          description: 'Deleted.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteTransactionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: Response is DeleteTransactionResult (was {success, message}).
      x-used-by:
        - { page: transaction-detail, calls: 1 }
  /transactions/{id}/splits:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Transactions]
      summary: Replace a bill's splits (whole list)
      description: |
        Body = the whole new list; a split left out is removed; `[]` removes all. Each item is an existing `debt_id` (kept / re-amounted) or a new person.
        **Person rules.** A split WITH a contact (kept or new) takes the contact's name: a sent `person_name` is ignored. A free-name split (no contact) renames in place via `person_name`. Changing the contact of a split whose contact is linked to an app user = remove + add (new `debt_id`, the old partner gets `split_changed`, the new one `split_created`); an unlinked contact changes in place. No identity lock.
        Returns the full `Transaction` (its `splits[]` are the new state).
      operationId: editSplits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditSplitsRequest' }
      responses:
        '200':
          description: 'The bill, final state.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "A sent person_name on a split that has a contact is ignored (was: an in-place rename for the same linked contact). Response is the Transaction shape."
      x-used-by:
        - { page: split-editor, calls: 1 }
  /transactions/{id}/tags:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Transactions]
      summary: Set a transaction's tags (replace the whole set)
      description: 'One call replaces `DELETE × removed + POST + GET`. `[]` clears the tags. Returns the full `Transaction`.'
      operationId: setTransactionTags
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTagsRequest' }
      responses:
        '200':
          description: 'The row with its new tags.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "New endpoint. POST /transactions/{id}/tags and DELETE /transactions/{id}/tags/{tag_id} are REMOVED — use this."
      x-used-by:
        - { page: transaction-detail, calls: 1 }
        - { page: edit-transaction-sheet, calls: 1 }

  # ───────────────────────────── Pending ─────────────────────────────
  /pending-transactions:
    get:
      tags: [Pending]
      summary: List pending drafts (page-ready)
      description: 'Newest first. Each draft carries `resolved` (its account / wallets / category / tags / event / split persons, embedded), so the page needs no other call.'
      operationId: listPending
      responses:
        '200':
          description: 'All drafts of the caller.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingList' }
      x-breaking: Each item gains `resolved` (additive); the list envelope is unchanged.
      x-used-by:
        - { page: pending, calls: 1 }
        - { page: home, calls: 0 }
    post:
      tags: [Pending]
      summary: Save manual drafts (1–100, all or nothing)
      description: 'Drafts may be incomplete or unbalanced; only shape errors are rejected. The event (`draft.project_id`) is not checked until submit.'
      operationId: createPending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePendingRequest' }
      responses:
        '201':
          description: 'The created drafts, resolved.'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PendingTransaction' } }
        '400': { $ref: '#/components/responses/ValidationError' }
      x-used-by:
        - { page: quick-create-sheet, calls: 1 }
        - { page: pending, calls: 1 }
  /pending-transactions/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Pending]
      summary: Replace a draft (clears last_error)
      operationId: updatePending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePendingRequest' }
      responses:
        '200':
          description: 'The draft, resolved.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingTransaction' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-used-by:
        - { page: pending, calls: 1 }
    delete:
      tags: [Pending]
      summary: Discard one draft
      operationId: deletePending
      responses:
        '200':
          description: 'Discarded.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscardResult' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: Response is DiscardResult (was {success, message}).
      x-used-by:
        - { page: pending, calls: 1 }
  /pending-transactions/discard:
    post:
      tags: [Pending]
      summary: Discard many drafts in one call
      description: 'Replaces one DELETE per draft. Unknown / foreign ids are skipped (listed in `skipped`).'
      operationId: discardPending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdsRequest' }
      responses:
        '200':
          description: 'What was discarded.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscardResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
      x-breaking: New endpoint.
      x-used-by:
        - { page: pending, calls: 1 }
  /pending-transactions/submit:
    post:
      tags: [Pending]
      summary: Confirm drafts (each independently)
      description: |
        A draft that goes through is gone from pending and comes back as its created `rows` (final state); the top-level `account_balances` carries the post-submit balance of every wallet any submitted draft touched, transfers included. One that fails stays pending and comes back as the updated `PendingTransaction` (with `last_error`). So the page patches itself from this one response.
        A draft with `project_id` confirms through the "add a new bill to an event" path (event rules apply; splits go onto the board). Split rules apply at confirm: every split needs a name and an amount > 0 (`INVALID_SPLIT`), Σ ≤ amount (`SPLITS_EXCEED_AMOUNT`).
      operationId: submitPending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdsRequest' }
      responses:
        '200':
          description: 'Per-draft outcome.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
      x-breaking: "submitted[] items carry `rows` (full Transaction rows) instead of `transaction_id`; top-level `account_balances` added; failed[] items carry `pending` (the draft with last_error) next to `error`; `badges` added."
      x-used-by:
        - { page: pending, calls: 1 }

  # ───────────────────────────── Me ─────────────────────────────
  /me/counts:
    get:
      tags: [Me]
      summary: Badges + counts for the shell and the More hub
      description: 'One cheap call. `badges` drive the app-bar badges; `counts` fill the More cards. Active records only.'
      operationId: getMyCounts
      responses:
        '200':
          description: 'Counts.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeCounts' }
      x-breaking: New endpoint.
      x-used-by:
        - { page: more-hub, calls: 1 }
        - { page: notifications-badge, calls: 1 }

  # ───────────────────────────── Notifications ─────────────────────────────
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Unread notification count (the badge)
      description: 'Tiny payload for the periodic badge refresh; replaces polling `GET /notifications?per_page=1`.'
      operationId: getUnreadCount
      responses:
        '200':
          description: 'Count.'
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer, minimum: 0 }
      x-breaking: New endpoint.
      x-used-by:
        - { page: notifications-badge, calls: 1 }
  /notifications/settings:
    get:
      tags: [Notifications]
      summary: Notification preferences
      operationId: getNotificationSettings
      responses:
        '200':
          description: 'Settings with the default wallet resolved.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
      x-breaking: "`default_account_id` is replaced by `default_account` (AccountRef or null)."
      x-used-by:
        - { page: settings-notifications, calls: 1 }
    put:
      tags: [Notifications]
      summary: Update notification preferences
      description: 'Partial; each list replaces the stored one when present. Returns the final settings.'
      operationId: updateNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationSettingsRequest' }
      responses:
        '200':
          description: 'Final settings.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
      x-breaking: Response carries `default_account` (AccountRef) instead of `default_account_id`. The request keeps `default_account_id`.
      x-used-by:
        - { page: settings-notifications, calls: 1 }

  # ───────────────────────────── Categories ─────────────────────────────
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      description: 'For pickers and the categories page. Rows are never needed to render another page''s rows (those embed `CategoryRef`).'
      operationId: listCategories
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [expense, income] } }
        - { name: include_system, in: query, schema: { type: boolean } }
        - { name: status, in: query, description: 'Archived rows are excluded unless asked for.', schema: { type: string, enum: [active, archived, all], default: active } }
      responses:
        '200':
          description: 'Categories.'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }
      x-breaking: Rows expose `system_kind` (new key).
      x-used-by:
        - { page: categories-list, calls: 1 }
        - { page: quick-create-sheet, calls: 1 }
    post: {
        "tags": [
          "Categories"
        ],
        "summary": "Create a category",
        "operationId": "createCategory",
        "description": "Appended at the end of its siblings. Returns the category.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateCategoryRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Final state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Category"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
  /categories/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Categories]
      summary: Category detail
      operationId: getCategory
      responses:
        '200':
          description: 'The category with its counts and the fee flag.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: Gains `system_kind` and `is_fee_category` (the page no longer calls GET /users/me).
      x-used-by:
        - { page: category-detail, calls: 1 }

    put: {
        "tags": [
          "Categories"
        ],
        "summary": "Edit a category",
        "operationId": "updateCategory",
        "description": "Returns the detail (counts, fee flag).",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateCategoryRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Final state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CategoryDetail"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        },
        "x-breaking": "Response is the CategoryDetail."
      }
    delete: {
        "tags": [
          "Categories"
        ],
        "summary": "Delete a category (hard)",
        "operationId": "deleteCategory",
        "description": "Its transactions keep no category; children and budgets follow the existing rule. Returns the id.",
        "responses": {
          "200": {
            "description": "Final state.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeleteCategoryResult"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        },
        "x-breaking": "Response is {id, reparented[]} (was {message, status})."
      }
  # ───────────────────────────── Contacts ─────────────────────────────
  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts (names already resolved)
      description: 'Order: active first, then by resolved name (case-insensitive). Search matches name, nickname, display_name and email.'
      operationId: listContacts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: linked, in: query, description: 'Only linked (true) / unlinked (false) contacts.', schema: { type: boolean } }
      responses:
        '200':
          description: 'Contacts.'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Contact' } }
      x-breaking: "Contact shape: `name` (resolved) + `nickname` + `show_nickname` added; the flat linked_user_* keys become `linked_user`; `icon_code` is the resolved icon."
      x-used-by:
        - { page: contacts-list, calls: 1 }
        - { page: split-editor, calls: 1 }
    post:
      tags: [Contacts]
