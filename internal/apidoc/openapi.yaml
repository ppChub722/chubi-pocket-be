    # ───────── notifications ─────────
    NotificationSettings:
      type: object
      description: 'The notification page (0.4.1-2 S4 / P7): on / off per type, plus the two auto-sync switches (one DB value each, the same values `/users/me`, the event page and the person page show). A muted type is not inserted when it is info only; auto still applies it silently (Q-B10). A notice that still ASKS (`shared_bill_created` / `project_tx_changed` / `shared_bill_deleted` with `applied` false, i.e. the auto switch was off) is inserted even when its type is muted: someone must answer it (owner 2026-10-28; the app locks the on / off switch on while auto is off).'
      required: [muted_types, types, auto_sync_events, auto_sync_debts, auto_accept_events, auto_accept_debts, default_account, updated_at]
      properties:
        muted_types: { type: array, items: { type: string } }
        types:
          type: array
          description: 'Every notification type the page lists, in page order: `group` shared_bill | event | recurring | request; `on` = not muted; `mutable` false = invites / link requests (always on, shown as a locked switch).'
          items:
            type: object
            required: [type, group, on, mutable]
            properties:
              type: { type: string }
              group: { type: string, enum: [shared_bill, event, recurring, request] }
              on: { type: boolean }
              mutable: { type: boolean }
        auto_sync_events: { type: boolean, description: 'Auto sync for event bills: another member''s save changes my copy (tx + debts) at once; off = a notice asks "อัปเดตตาม". Default true.' }
        auto_sync_debts: { type: boolean, description: 'Auto sync for split bills and debts with a connected contact; off = a notice asks. Default true.' }
        auto_accept_events: { type: boolean, description: '0.4.1-2 (owner 2026-10-28): a NEW event bill with a share of mine lands in my book as a copy at once; off = a shared_bill_created notice with "เพิ่มในสมุด". Auto sync covers later edits. Default true.' }
        auto_accept_debts: { type: boolean, description: '0.4.1-2 (owner 2026-10-28): the same for a new split bill / debt from a connected contact. Default false.' }
        default_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'The main wallet (กระเป๋าหลัก): quick create starts with it (getTransactionFormOptions `default_account_id`); null = the last wallet used. Same value as `/users/me` `default_account`.' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    UpdateNotificationSettingsRequest:
      type: object
      description: 'Partial; absent = unchanged. `auto_types` is gone (0.4.1-2): auto moved to the two switches.'
      properties:
        muted_types: { type: array, items: { type: string }, description: 'Replaces the stored list. Only mutable types (400 otherwise).' }
        auto_sync_events: { type: boolean }
        auto_sync_debts: { type: boolean }
        auto_accept_events: { type: boolean }
        auto_accept_debts: { type: boolean }
        default_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'A key present with null clears it. '}

