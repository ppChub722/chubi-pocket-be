        Partial; a key present with `null` clears description / note, and `account_id: null` turns the entry ledger-only (its transaction is deleted, the wallet balance comes back). Setting `account_id` on a ledger-only entry creates the linked transaction; changing it moves the transaction. Amount / date / direction / description / note edits are written to the linked transaction too (one record). `tag_ids` replace the transaction's tags (needs a wallet: 400 TAGS_NEED_WALLET). `key` moves a manual entry to another person (`person_name` as in create); the response then also carries `previous_person_balance`.
        `paid` is the label only. A split-sourced entry (`entry.source` not null) accepts only description / note / paid: anything else → 409 ENTRY_MANAGED_BY_SOURCE.
        Errors: 400 VALIDATION_ERROR / INVALID_PERSON_KEY / CONTACT_NOT_FOUND / TAGS_NEED_WALLET / TAG_NOT_FOUND / ACCOUNT_NOT_FOUND, 404 NOT_FOUND, 409 ENTRY_MANAGED_BY_SOURCE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebtEntryUpdateRequest' }
      responses:
        '200':
          description: The entry in its final state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntryWriteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '409 ENTRY_MANAGED_BY_SOURCE.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      x-breaking: New body and response (DebtEntryWriteResult).
      x-used-by:
        - { page: tx-detail, calls: 1 }
        - { page: debt-person, calls: 1 }
    delete:
      tags: [Debts]
      summary: Delete an entry (and its linked transaction)
      operationId: deleteDebtEntry
      description: |
        Hard delete. An entry with a wallet transaction deletes BOTH (the balance comes back; the confirm modal names both). A split-sourced entry deletes the split from its bill (my_share grows; a linked partner gets split_changed "removed", like a split edit). 404 NOT_FOUND if not the caller's.
      responses:
        '200':
          description: What went and the new balances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntryDeleteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "Was the legacy {success, message} envelope; now DebtEntryDeleteResult. Also deletes the linked transaction."
