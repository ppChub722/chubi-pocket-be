        pagination: { $ref: '#/components/schemas/Page' }
    BudgetPeriodList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BudgetPeriod' } }
        pagination: { $ref: '#/components/schemas/Page' }
    BudgetDetail:
      type: object
      description: 'The budget page in one call, at one period (`budget.period`).'
      required: [budget, forecast, by_source, by_category, periods, items, delete_preview]
      properties:
        budget: { $ref: '#/components/schemas/Budget' }
        forecast: { $ref: '#/components/schemas/BudgetForecast' }
        by_source: { type: array, items: { $ref: '#/components/schemas/BudgetSourceRow' }, description: 'Non-zero sources only.' }
        by_category: { type: array, items: { $ref: '#/components/schemas/BudgetCategoryRow' }, description: 'Used only, largest first.' }
        periods:
          type: object
          description: 'The 6 newest periods (recurring); has_more → listBudgetPeriods.'
          required: [data, has_more]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/BudgetPeriod' } }
            has_more: { type: boolean }
        items: { $ref: '#/components/schemas/BudgetItemList' }
        delete_preview:
          description: 'Only with ?include=delete_preview, else null: what a delete removes (transactions are never touched).'
          oneOf:
            - type: 'null'
            - type: object
              required: [periods, overridden_periods, categories, wallets]
              properties:
                periods: { type: integer }
                overridden_periods: { type: integer }
                categories: { type: integer }
                wallets: { type: integer }
    BudgetCreateRequest:
      type: object
      required: [name, amount, scope, start_date]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        amount: { type: number, exclusiveMinimum: 0 }
        warn_pct: { type: [integer, 'null'], minimum: 1, maximum: 100, description: 'Absent = 80; null = ไม่เตือน.' }
        scope: { $ref: '#/components/schemas/BudgetScopeInput' }
        recurring: { type: boolean }
        rule: { $ref: '#/components/schemas/BudgetRuleInput', description: 'Required when recurring.' }
        start_date: { $ref: '#/components/schemas/Date' }
        end: { $ref: '#/components/schemas/RecurrenceEndInput', description: 'Recurring: none | date | count. One range: date | none.' }
    BudgetUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        amount: { type: number, exclusiveMinimum: 0 }
        warn_pct: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        scope: { $ref: '#/components/schemas/BudgetScopeInput' }
        recurring: { type: boolean }
        rule: { $ref: '#/components/schemas/BudgetRuleInput' }
        start_date: { $ref: '#/components/schemas/Date' }
        end: { $ref: '#/components/schemas/RecurrenceEndInput' }
        apply: { type: string, enum: [following, all], description: 'Recurring: which periods take a new amount / rule / start / end. Default following.' }
    BudgetPeriodUpdateRequest:
      type: object
      properties:
        amount: { oneOf: [{ type: number, exclusiveMinimum: 0 }, { type: 'null' }], description: 'null = back to the base amount.' }
        note: { type: [string, 'null'], maxLength: 500 }

    PersonKey:
      type: string
      description: |
        A debt person: `c:<contact_id>` (one of the caller's contacts) or `n:<name>` (a typed name; matched case-insensitively, the BE always returns it lower-cased and trimmed). URL-encode it in paths.
      example: c:0191c2a0-0000-7000-8000-0000000000aa
    DebtPerson:
      type: object
      description: 'A person''s balance (people list row, header of the person page, and `person_balance` in every debt write so the FE patches without re-fetching).'
      required: [key, person, net, open_count, entry_count, last_activity_at, cleared_at, days_outstanding, side, first_activity_at, last_activity]
      properties:
        side: { type: string, enum: [receivable, payable, clear], description: '0.4.0-3: net > 0 receivable (ลูกหนี้) / net < 0 payable (เจ้าหนี้) / 0 clear (เคลียร์แล้ว).' }
        first_activity_at: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: '0.4.0-3: the first line''s date ever ("ติดต่อกันตั้งแต่ …").' }
        last_activity:
          description: '0.4.0-3: the latest line, for the people row''s second line ("ค่าตั๋ว | 1 ก.ย." / a repayment "คุณจ่ายคืน ฿400 | 10 ต.ค."). Null with no lines.'
          oneOf:
            - type: object
              required: [kind, id, title, direction, amount, signed_amount, date]
              properties:
                kind: { type: string, enum: [debt, repayment] }
                id: { $ref: '#/components/schemas/Uuid', description: 'The entry id (both kinds, 0.4.1-1 D3).' }
                title: { type: [string, 'null'], description: 'Its description (null = none: word it from kind / direction).' }
                direction: { type: string, enum: [paid, received], description: 'paid = net + (I paid for them / I paid back), received = net −.' }
                amount: { $ref: '#/components/schemas/Money' }
                signed_amount: { $ref: '#/components/schemas/Money' }
                date: { $ref: '#/components/schemas/Date' }
            - type: 'null'
        key: { $ref: '#/components/schemas/PersonKey' }
        person: { $ref: '#/components/schemas/PersonRef' }
        net: { $ref: '#/components/schemas/Money', description: 'Σ signed person-book rows, one ledger query (0.4.1-1 D3): paid +, received − (debts and repayments alike; a repayment I paid back is paid, one I got back is received). Transactions never count, with or without an entry. > 0 = they owe me (รอรับ), < 0 = I owe them (รอจ่าย), 0 = หายกัน.' }
        open_count: { type: integer, minimum: 0, description: 'Debt entries not labelled paid (repayments are never open).' }
        entry_count: { type: integer, minimum: 0, description: 'Statement lines: debts + repayments.' }
        cleared_at: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'The CYCLE boundary: the date of the last line (debt or repayment) after which the running balance (book order: date, created, id) was 0; null when it never was. Lines after it = the current cycle.' }
        days_outstanding: { type: [integer, 'null'], description: 'Age in days (user timezone) of the oldest entry of the CURRENT cycle not labelled paid; null when there is none.' }
        last_activity_at: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'The latest entry date (null with no entries).' }
        next_due_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: '0.4.0-3 "กำหนดจ่าย": the earliest due_date among the unpaid debts on the person''s CURRENT side (net > 0 → direction paid; net < 0 → received). Null when net is 0 or no such entry has one. Days overdue = today (user timezone) − this.' }
      example:
        key: n:mom
        person: { name: Mom, contact_id: null, avatar: { kind: initials, photo_url: null, icon_code: null, initials: M, colors: ['#F06292'], border: null }, linked: false, linked_user_id: null }
        net: 200
        open_count: 1
        entry_count: 3
        last_activity_at: '2026-10-12'
    DebtTotals:
      type: object
      description: 'The debts header / Home tile / More tile numbers (one rule everywhere). owed_to_me = Σ net of people with net > 0; i_owe = Σ |net| of people with net < 0.'
      required: [owed_to_me, i_owe, net, open_count, owed_to_me_people, i_owe_people, over_30_days_people, receivable_total, payable_total, counts]
      properties:
        receivable_total: { $ref: '#/components/schemas/Money', description: '0.4.0-3, = owed_to_me (รอรับ).' }
        payable_total: { $ref: '#/components/schemas/Money', description: '0.4.0-3, = i_owe (รอจ่าย).' }
        counts:
          type: object
          description: '0.4.0-3: the debts list filter chips (people with something open); side=receivable | payable | overdue_30 lists each.'
          required: [all, receivable, payable, overdue_30]
          properties:
            all: { type: integer }
            receivable: { type: integer }
            payable: { type: integer }
            overdue_30: { type: integer, description: 'Oldest open debt of the current cycle older than 30 days.' }
        owed_to_me: { $ref: '#/components/schemas/Money' }
        i_owe: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money', description: 'owed_to_me − i_owe.' }
        open_count: { type: integer, minimum: 0, description: 'People with something open (the default people list size).' }
        owed_to_me_people: { type: integer, minimum: 0, description: 'People with net > 0 (the card''s "N คน").' }
        i_owe_people: { type: integer, minimum: 0, description: 'People with net < 0.' }
        over_30_days_people: { type: integer, minimum: 0, description: 'People whose oldest open entry of the current cycle is more than 30 days old.' }
    DebtSummaryMessage:
      type: object
      description: 'The text to send a person (Thai, both directions).'
      required: [text, text_balance_only, since, entries, net]
      properties:
        text: { type: string, description: 'Share variant "รอบนี้". Multi-line: "สรุปยอดกับ <name> (ตั้งแต่ <first date>)", one "• <date> <what> <±amount> <unit> (<description>)" line per CURRENT-cycle statement line (debts and repayments), oldest first (+ = I paid for them / ฉันจ่ายคืน, − = they paid me / ได้รับคืนจาก), then "รวม <name> เป็นลูกหนี้ …" / "รวม <name> เป็นเจ้าหนี้ …" / cleared (0.4.1-0 wording, like the app: never ติด).' }
        text_balance_only: { type: string, description: '0.4.0-3, share variant "ยอดคงเหลืออย่างเดียว": "ยอดกับ <name> ตอนนี้: <name> เป็นลูกหนี้ / เป็นเจ้าหนี้ <amount> <unit>".' }
        since: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'The current cycle''s first line date.' }
        entries: { type: integer, description: 'Lines listed (the current cycle).' }
        net: { $ref: '#/components/schemas/Money' }
    ArchivedItem:
      type: object
      required: [id, name, icon_code, archived_at, can_restore, secondary]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        archived_at: { $ref: '#/components/schemas/DateTime', description: 'The last change of the row (when it was archived).' }
        can_restore: { type: boolean, description: 'Whether the caller may restore it (wallets and events: owner only).' }
        secondary:
          description: 'The row''s second line as data; null for contacts.'
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, amount]
              properties:
                kind: { type: string, enum: [balance, limit, target, planned, amount], description: 'wallet balance / budget limit / goal target / event planned amount / recurring amount.' }
                amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
    ArchivedGroup:
      type: object
      required: [count, items]
      properties:
        count: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/ArchivedItem' } }
    ArchivedHub:
      type: object
      required: [total, wallets, budgets, goals, events, contacts, recurring]
      properties:
        total: { type: integer }
        wallets: { $ref: '#/components/schemas/ArchivedGroup' }
        budgets: { $ref: '#/components/schemas/ArchivedGroup' }
        goals: { $ref: '#/components/schemas/ArchivedGroup' }
        events: { $ref: '#/components/schemas/ArchivedGroup' }
        contacts: { $ref: '#/components/schemas/ArchivedGroup' }
        recurring: { $ref: '#/components/schemas/ArchivedGroup' }
    DebtPeopleList:
      type: object
      required: [data, totals, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DebtPerson' } }
        totals: { $ref: '#/components/schemas/DebtTotals' }
        pagination: { $ref: '#/components/schemas/Page' }
    DebtSource:
      type: object
      description: |
        Where a split-sourced entry came from (such an entry edits only description / note / paid):
        `transaction` = a split on my bill (id = that transaction, title = its description or category name);
        `event` = a split on an event board (id = the event, title = the event name);
        `partner` = another user's split on me (id = my expense of it, the transaction with paid_by.source partner, or null when I deleted it / it is from before 0.4.0-3; title = their display name);
        `paid_by` = someone paid (part of) my expense or received (part of) my income (0.4.0-3 / 0.4.1-0; id = that transaction, title = its description or category name). Edit or delete the transaction; DELETE /personal-debts/{id} → 409 DEBT_MANAGED_BY_TX. Deleting a `partner` entry that has my expense deletes the expense too (it has no wallet).
      required: [kind, id, title]
      properties:
        kind: { type: string, enum: [transaction, event, partner, paid_by] }
        id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        title: { type: [string, 'null'] }
    DebtOrigin:
      type: object
      description: |
        0.4.0-3: where a debt came from, for the debt detail's "มาจาก" card (page-ready; null for a ledger-only debt). kind:
        `split` = a split on my bill (transaction = the bill), `paid_by` = someone paid (part of) my expense or received (part of) my income (transaction = it), `partner` = another user's split on me (transaction = my expense of it, or null), `event` = an event bill (bill_id / event_id; resolve "as debt"), `cash` = a loan / borrow with its own wallet transaction (transaction = it).
        title / amount / date / account are that transaction's (an event: the bill's description or the event name, the bill amount and date, no wallet). The debt itself has no wallet.
      required: [kind, transaction_id, bill_id, event_id, title, amount, date, account]
      properties:
        kind: { type: string, enum: [split, paid_by, partner, event, cash] }
        transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Opens GET /transactions/{id}.' }
        bill_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        event_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        title: { type: [string, 'null'] }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
    DebtEntryTx:
      type: object
      description: 'The transaction of an entry (light ref for list rows). Connected + synced: amount, date, description and note are one value with the entry.'
      required: [id, account, connected]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'Null = a transaction with no wallet ("ไม่ระบุกระเป๋า").' }
        connected: { type: boolean, description: '0.4.1-1 D2: true = an existing transaction connected later (can disconnect: POST /personal-debts/{id}/unlink); false = made from the entry (can''t disconnect; deleting the transaction keeps the entry).' }
    DebtEntry:
      type: object
      description: |
        A person-book row (0.4.1-1 D3): `kind` debt (ให้ยืม paid / ยืม received, or a split / paid-by / event debt) or repayment (จ่ายคืน paid / รับคืน received). Both count in the person's balance (paid +, received −), each with an optional transaction (`transaction`), connected and synced.
        A repayment: `paid` always false (no label), `due_date` null, `source` null or {kind event} for an event payback, `origin` null.
      required: [id, kind, key, direction, amount, date, description, note, private_note, paid, source, transaction, partner_linked, disconnected_at, created_at, in_current_cycle, updated_at, origin, bills]
      properties:
        kind: { type: string, enum: [debt, repayment], description: '0.4.1-1 D3.' }
        private_note: { type: [string, 'null'], maxLength: 500, description: '0.4.1-2 S11: mine only, on a debt of a shared bill (never synced); null elsewhere.' }
        origin: { oneOf: [{ $ref: '#/components/schemas/DebtOrigin' }, { type: 'null' }], description: 'Debts only (null on a repayment).' }
        id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/PersonKey' }
        direction: { type: string, enum: [paid, received], description: 'paid = net + (a debt: I paid them / for them; a repayment: I paid back, expense); received = net − (a debt: they paid me / for me; a repayment: they paid me back, income).' }
        amount: { $ref: '#/components/schemas/Money', description: '> 0; 0 only on a row the system synced from a 0 transaction (0.4.1-1 B1).' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200, description: 'Free text; null = show the category name of the kind (0.4.1-1 D7: nothing is generated any more; old rows keep what they saved).' }
        note: { type: [string, 'null'], maxLength: 500 }
        paid: { type: boolean, description: 'Debts: the "จ่ายแล้ว" label. Never changes a number. Always false on a repayment.' }
        due_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: '0.4.0-3 "กำหนดจ่าย": debts only, optional, never before `date`.' }
        source: { oneOf: [{ $ref: '#/components/schemas/DebtSource' }, { type: 'null' }], description: 'Null = a manual entry (fully editable).' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/DebtEntryTx' }, { type: 'null' }], description: 'Null = ledger-only (person book only, no wallet moves). 0.4.1-1 D2: the 0.4.0-4 soft link (`linked_transaction`) is gone; a connected existing transaction shows here with connected true.' }
        partner_linked: { type: boolean, description: '0.4.1-1 D9: the entry has a copy in the other user''s book right now (a split / paid-by pair with a linked contact). Only then do split_changed / "อัปเดตตาม" and POST /personal-debts/{id}/disconnect apply.' }
        disconnected_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: '0.4.1-1 D9: when the pair was disconnected (by either side); the entry is then a plain debt with that person (partner_linked false). Null = never linked or still linked.' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        in_current_cycle: { type: [boolean, 'null'], description: 'Only in the person''s entry lists (person page, entries): true = after the cycle boundary (cleared_at); null elsewhere.' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
        bills: { type: array, items: { $ref: '#/components/schemas/DebtBillPart' }, description: '0.4.1-2 V5: the shared bills (event or split) this debt books, oldest first: one = a per-bill debt, several = a lump ("claim ก้อน"); [] = none (a manual debt, a repayment). amount = Σ bills[].amount.' }
      example:
        id: 0191c2a0-0000-7000-8000-0000000000e1
        kind: debt
        key: n:mom
        direction: paid
        amount: 200
        date: '2026-10-12'
        description: 'Lunch money'
        note: null
        paid: false
        source: null
        transaction: { id: 0191c2a0-0000-7000-8000-0000000000f1, account: null, connected: false }
        created_at: '2026-10-12T09:30:00Z'
        updated_at: '2026-10-12T09:30:00Z'
    DebtEntryList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DebtEntry' } }
        pagination: { $ref: '#/components/schemas/Page' }
    DebtPersonPage:
      description: 'The person page in one call: the balance, counts, the CURRENT-cycle statement (debts AND repayments interleaved, newest first; `?cycle=earlier` / `all` page the rest) and the summary message to send.'
      allOf:
        - { $ref: '#/components/schemas/DebtPerson' }
        - type: object
          required: [counts, items, days, summary_message, pagination, auto_sync_debts, auto_accept_debts, recurring]
          properties:
            auto_accept_debts: { type: boolean, description: '0.4.1-2: my debts auto-accept switch (new split bills / debts from a connected contact); same DB value as /users/me.' }
            recurring:
              type: array
              description: '0.4.1-2 K13: this person''s "หนี้" recurring settings (not archived), newest first; [] when none. A row opens the setting (GET /recurring/{id}).'
              items:
                type: object
                required: [id, name, icon_code, debt_kind, direction, amount, next_date, next_amount, due_count, status, pause_reason]
                properties:
                  id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string }
                  icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
                  debt_kind: { type: string, enum: [debt, repayment] }
                  direction: { type: string, enum: [paid, received] }
                  amount: { $ref: '#/components/schemas/Money' }
                  next_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
                  next_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'จ่ายหนี้: min(amount, what is owed now).' }
                  due_count: { type: integer }
                  status: { type: string, enum: [active, paused, archived] }
                  pause_reason: { type: [string, 'null'], enum: [manual, overdue_limit, goal_inactive, no_balance, null] }
            auto_sync_debts: { type: boolean, description: '0.4.1-2 S4: my debts auto-sync switch (the same DB value as /users/me; change it with PUT /notifications/settings or PUT /users/me).' }
            days:
              type: array
              description: '0.4.0-3: the page''s items grouped by day, in the items'' order (day headers: change = the day''s balance change, + = they owe me more / I owe less; balance_after = the balance at the day''s end). A day split across pages shows its part on each page. The "ดูรอบก่อน" divider: counts.earlier > 0, label from cleared_at; ?cycle=earlier pages the earlier cycles.'
              items:
                type: object
                required: [date, change, balance_after, count]
                properties:
                  date: { $ref: '#/components/schemas/Date' }
                  change: { $ref: '#/components/schemas/Money' }
                  balance_after: { $ref: '#/components/schemas/Money' }
                  count: { type: integer }
            counts:
              type: object
              description: 'Over the statement lines (debts + repayments).'
              required: [entries, money, current, earlier]
              properties:
                entries: { type: integer, description: 'All statement lines (debts + repayments).' }
                money: { type: integer, description: 'Lines with money: debts with a wallet transaction + every repayment.' }
                current: { type: integer, description: 'Lines of the CURRENT cycle (after the last time the balance hit 0).' }
                earlier: { type: integer, description: 'Lines of earlier cycles (the ones a hidden "รอบก่อนหน้า" fold holds).' }
            items: { type: array, items: { $ref: '#/components/schemas/DebtStatementItem' } }
            summary_message: { $ref: '#/components/schemas/DebtSummaryMessage' }
            pagination: { $ref: '#/components/schemas/Page' }
    DebtEntryDetail:
      type: object
      description: 'The tx-detail page in debt mode (debts and repayments): the entry, the person''s balance and its transaction as a full row (null = ledger-only).'
      required: [entry, person_balance, transaction]
      properties:
        entry: { $ref: '#/components/schemas/DebtEntry' }
        person_balance: { $ref: '#/components/schemas/DebtPerson' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/Transaction' }, { type: 'null' }] }
    DebtEntryWriteResult:
      type: object
      description: 'Every person-book write (debt or repayment) returns the final state: the entry, the person''s new balance, its transaction (full row, null = ledger-only), the post-write balance of every wallet touched and `effects` (0.4.1-1 B2).'
      required: [entry, item, person_balance, previous_person_balance, transaction, account_balances, balance_change, effects]
      properties:
        balance_change: { oneOf: [{ $ref: '#/components/schemas/PersonDelta' }, { type: 'null' }], description: '0.4.0-3, create only: the person''s balance before → after (flipped = crossed sides; an overpaid repayment is allowed). Null on other writes.' }
        entry: { $ref: '#/components/schemas/DebtEntry' }
        item: { oneOf: [{ $ref: '#/components/schemas/DebtStatementItem' }, { type: 'null' }], description: '0.4.1-1, create only: the entry as its person-page statement line (running_balance, in_current_cycle). Null on other writes.' }
        person_balance: { $ref: '#/components/schemas/DebtPerson' }
        previous_person_balance: { oneOf: [{ $ref: '#/components/schemas/DebtPerson' }, { type: 'null' }], description: 'Set only when an edit moved the entry to another person (the old person''s new balance).' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/Transaction' }, { type: 'null' }] }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
        effects: { $ref: '#/components/schemas/Effects' }
    DebtEntryDeleteResult:
      type: object
      required: [id, transaction_id, person_balance, account_balances, effects]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Its transaction deleted with it (null = ledger-only). A connected (existing) transaction is NOT deleted: it is disconnected and gets its old category back (then null here; it shows in effects.transactions).' }
        person_balance: { $ref: '#/components/schemas/DebtPerson' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
        effects: { $ref: '#/components/schemas/Effects' }
    DebtEntryCreateRequest:
      type: object
      description: 'A DEBT (ให้ยืม = paid / ยืม = received). The transaction side, one of: none (ledger-only, the default), a new transaction (create_transaction true, wallet optional), or an existing one (link_transaction_id).'
      required: [direction]
      properties:
        direction: { type: string, enum: [paid, received] }
        amount: { type: number, exclusiveMinimum: 0, description: 'Required, except with link_transaction_id (then the transaction''s amount is used and this is ignored).' }
        date: { $ref: '#/components/schemas/Date', description: 'Default today; with link_transaction_id the transaction''s date.' }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The wallet of the new transaction. Null / absent with no create_transaction = ledger-only.' }
        create_transaction: { type: boolean, description: 'true = also write a new transaction (category LOAN_GIVEN / LOAN_TAKEN, out of reports; the wallet is optional, no wallet = no balance moves). false = ledger-only (no account_id, no tags). Absent = a transaction exactly when account_id is given.' }
        link_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: '0.4.1-1 D10 "ผูกกับรายการที่มีอยู่": connect one of my existing transactions in the same call (as POST /personal-debts/{id}/link). Exclusive with create_transaction true / account_id / tag_ids (400 VALIDATION_ERROR). Errors as link.' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids', description: 'Go on the transaction: needs create_transaction true, or an account_id.' }
        mark_paid_ids: { $ref: '#/components/schemas/Ids', description: 'Entries of the same person to label paid in the same call.' }
        person_name: { type: string, minLength: 1, maxLength: 100, description: '`n:` keys only: the shown spelling of a typed name.' }
        due_date: { $ref: '#/components/schemas/Date', description: '0.4.0-3 "กำหนดจ่าย" (optional). Before the entry''s date → 400 VALIDATION_ERROR.' }
        bill_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'RETIRED (0.4.1-2 V9): sending it → 400 USE_CLAIM. Bills are claimed with POST /projects/{id}/claim (once per bill + person, X7).' }
        event_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'RETIRED (0.4.1-2 V8): sending it → 400 USE_CLAIM. The per-line "{event_id}" debt is gone: claim the bills (POST /projects/{id}/claim) or, after completion, book the settle (POST /projects/{id}/settle/book); SettleLine.recorded follows those.' }
    DebtEntryUpdateRequest:
      type: object
      description: 'Partial, debts and repayments. A split-sourced entry accepts only description / note / paid. A repayment refuses paid / due_date (400 VALIDATION_ERROR). An entry with a connected (existing) transaction: account_id / create_transaction / tag_ids go through the transaction (PUT /transactions/{id}) → 400 VALIDATION_ERROR here; amount / date / description / note write both sides.'
      properties:
        private_note: { type: [string, 'null'], maxLength: 500, description: '0.4.1-2 S11: only on a debt of a shared bill (400 PRIVATE_NOTE_NOT_SHARED otherwise).' }
        direction: { type: string, enum: [paid, received] }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { $ref: '#/components/schemas/Date' }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Without create_transaction: null = ledger-only (deletes the transaction); a value = create / move it. With create_transaction true: null = the transaction has no wallet.' }
        create_transaction: { type: boolean, description: 'true = there is a transaction after this write (made if missing); false = ledger-only (deletes it).' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        paid: { type: boolean }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        key: { $ref: '#/components/schemas/PersonKey' }
        person_name: { type: string, minLength: 1, maxLength: 100 }
        due_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: '0.4.0-3 "กำหนดจ่าย": null clears it, absent leaves it. Before the entry''s (new) date → 400 VALIDATION_ERROR.' }
    DebtStatementItem:
      type: object
      description: |
        One line of a person's statement ("ที่มาของยอด"): a person-book row, debt or repayment, by date (book order: date, created_at, id).
        `direction` follows the sign: paid = net + (a debt I paid for them / a repayment I paid back), received = net − (a debt they paid for me / a repayment I got back).
        0.4.1-1 D3: every line opens GET /personal-debts/{id} (`id` = the entry id for both kinds; it was the transaction id on a repayment).
      required: [kind, id, key, direction, amount, signed_amount, date, description, note, paid, source, transaction, in_current_cycle, created_at, updated_at, running_balance, origin]
      properties:
        running_balance: { $ref: '#/components/schemas/Money', description: '0.4.0-3: the person''s balance right after this line (book order over ALL their lines).' }
        origin: { oneOf: [{ $ref: '#/components/schemas/DebtOrigin' }, { type: 'null' }], description: 'Debts: where it came from (sub-line: "ลีจ่ายแทน", "เข้ากระเป๋า …", "แบ่งบิล ฿120"). Null on a repayment (its wallet: transaction.account).' }
        kind: { type: string, enum: [debt, repayment] }
        id: { $ref: '#/components/schemas/Uuid', description: 'The entry id (both kinds).' }
        key: { $ref: '#/components/schemas/PersonKey' }
        direction: { type: string, enum: [paid, received] }
        amount: { $ref: '#/components/schemas/Money', description: '> 0 (0 only on a system-synced row).' }
        signed_amount: { $ref: '#/components/schemas/Money', description: 'What the line adds to net: + for paid, − for received.' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        paid: { type: [boolean, 'null'], description: 'Debts: the "จ่ายแล้ว" label (never changes a number). Null on a repayment.' }
        source: { oneOf: [{ $ref: '#/components/schemas/DebtSource' }, { type: 'null' }], description: 'The split source (null = manual); on a repayment null or {kind event} (an event payback).' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/DebtEntryTx' }, { type: 'null' }], description: 'Its transaction, debt or repayment (null = ledger-only). The transaction itself never counts in net: the entry does.' }
        in_current_cycle: { type: [boolean, 'null'], description: 'true = after the cycle boundary (cleared_at).' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
      example:
        kind: repayment
        id: 0191c2a0-0000-7000-8000-0000000000f2
        key: n:lee
        direction: paid
        amount: 400
        signed_amount: 400
        date: '2026-10-20'
        description: 'จ่ายคืนลี'
        note: null
        paid: null
        source: null
        transaction: { id: 0191c2a0-0000-7000-8000-0000000000f3, account: null, connected: false }
        in_current_cycle: true
        created_at: '2026-10-20T09:30:00Z'
        updated_at: '2026-10-20T09:30:00Z'
    DebtRepaymentCreateRequest:
      type: object
      description: 'A REPAYMENT (จ่ายคืน = pay / รับคืน = receive), a person-book row like a debt (0.4.1-1 D3). The transaction side, one of: none (ledger-only, the default: "paid outside the app"), a new transaction (create_transaction true, wallet optional), or an existing one (link_transaction_id).'
      required: [kind]
      properties:
        kind: { type: string, enum: [pay, receive], description: 'pay = I pay them back (entry direction paid, net +; its transaction an expense in DEBT_PAID); receive = they pay me back (direction received, net −; income in DEBT_RECEIVED).' }
        amount: { type: number, exclusiveMinimum: 0, description: 'Required, except with link_transaction_id (the transaction''s amount is used).' }
        date: { $ref: '#/components/schemas/Date', description: 'Default = today; with link_transaction_id the transaction''s date.' }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The wallet of the new transaction.' }
        create_transaction: { type: boolean, description: '0.4.1-1: true = also write a new transaction (wallet optional: none = "ไม่ระบุกระเป๋า", no balance moves); false = ledger-only (no account_id, no tags: 400 LEDGER_ONLY_NO_WALLET). Absent = a transaction exactly when account_id is given (breaking: a repayment with no account_id used to make a wallet-less transaction).' }
        link_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: '0.4.1-1 D10: connect one of my existing transactions (pay = an expense, receive = an income) in the same call, as POST /personal-debts/{id}/link. Exclusive with create_transaction true / account_id / tag_ids (400 VALIDATION_ERROR).' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids', description: 'Tags on the new transaction.' }
        mark_paid_ids: { $ref: '#/components/schemas/Ids', description: 'Debt entries of the same person to label paid in the same call (label only, numbers never change).' }
        mark_all_paid: { type: boolean, description: '0.4.1-1 D10 "ปิดหนี้": label every open debt of this person on the side this repayment pays down paid (pay → their received debts, receive → their paid debts). Label only. Combines with mark_paid_ids.' }
        person_name: { type: string, minLength: 1, maxLength: 100, description: '`n:` keys only: the shown spelling of a typed name.' }
        bill_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'RETIRED (0.4.1-2 V9): sending it → 400 USE_CLAIM. A payback is claimed with POST /projects/{id}/claim (a repayment row).' }
    PersonDelta:
      type: object
      description: 'A person''s balance before / after a write or a preview (net: > 0 รอรับ, < 0 รอจ่าย).'
      required: [key, person, before, after, delta, side_before, side_after, flipped]
      properties:
        key: { $ref: '#/components/schemas/PersonKey' }
        person: { $ref: '#/components/schemas/PersonRef' }
        before: { $ref: '#/components/schemas/Money' }
        after: { $ref: '#/components/schemas/Money' }
        delta: { $ref: '#/components/schemas/Money' }
        side_before: { type: string, enum: [receivable, payable, clear] }
        side_after: { type: string, enum: [receivable, payable, clear] }
        flipped: { type: boolean, description: 'receivable ↔ payable (an overpaid settle / an over-sized record).' }
    WalletDelta:
      type: object
      required: [account_id, before, after, delta]
      properties:
        account_id: { $ref: '#/components/schemas/Uuid' }
        before: { $ref: '#/components/schemas/Money' }
        after: { $ref: '#/components/schemas/Money' }
        delta: { $ref: '#/components/schemas/Money' }
    DebtPreview:
      type: object
      description: '0.4.0-3: POST …/entries or …/repayments with ?preview=true (the debt quick create''s result box "ลี ตอนนี้ → หลังบันทึก" and the wallet effect). The write runs and is rolled back. Same shape as TransactionPreview minus rows.'
      required: [preview, people, wallets]
      properties:
        preview: { type: boolean, const: true }
        people: { type: array, items: { $ref: '#/components/schemas/PersonDelta' }, description: 'One person.' }
        wallets: { type: array, items: { $ref: '#/components/schemas/WalletDelta' }, description: 'The wallet when one is sent ([] = no money moves).' }
    DebtLink:
      type: object
      description: 'On a transaction that is a person-book entry''s transaction (connected + synced with the entry).'
      required: [entry_id, kind, key, person, direction, paid, connected]
      properties:
        entry_id: { $ref: '#/components/schemas/Uuid', description: 'GET /personal-debts/{id} (debts and repayments).' }
        kind: { type: string, enum: [debt, repayment], description: '0.4.1-1 D3.' }
        connected: { type: boolean, description: '0.4.1-1 D2: true = an existing transaction connected later (POST /personal-debts/{id}/unlink disconnects it and gives back its old category); false = made from the entry (can''t disconnect: delete the transaction, the entry stays).' }
        key: { $ref: '#/components/schemas/PersonKey' }
        person: { $ref: '#/components/schemas/PersonRef' }
        direction: { type: string, enum: [paid, received] }
        paid: { type: boolean, description: 'The debt''s "จ่ายแล้ว" label; always false on a repayment.' }
    Effects:
      type: object
      description: |
        0.4.1-1 B2 — what a write changed, linked sides included, page-ready so the app patches its caches without re-fetching (one generic handler, next to the X-Sync-Versions resync). Every write that touches a connected side answers with it (debt / repayment writes, transaction writes, split-change apply, recurring slot writes, event bill writes).
        Every key is always present; [] = nothing of that kind changed. The answer's own record is listed too (so the handler needs nothing else). Changed records are in their final state (the caller's view); removed ones by id only.
        Example: DELETE /transactions/{id} of a repayment's transaction → transactions [], removed_transaction_ids [the tx], debts [the repayment, now ledger-only], person_balances [] (the balance doesn't move), account_balances [the wallet].
      required: [transactions, removed_transaction_ids, debts, removed_debt_ids, slots, bills, removed_bill_ids, person_balances, account_balances]
      properties:
        transactions: { type: array, items: { $ref: '#/components/schemas/Transaction' }, description: 'My transactions created or changed (e.g. a debt''s transaction made / re-synced, a connected transaction''s category).' }
        removed_transaction_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        debts: { type: array, items: { $ref: '#/components/schemas/DebtEntry' }, description: 'Person-book rows (debts and repayments) created or changed.' }
        removed_debt_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        slots: { type: array, items: { $ref: '#/components/schemas/RecurringItem' }, description: 'Recurring slots that changed (filled, skipped, emptied, re-planned).' }
        bills: { type: array, items: { $ref: '#/components/schemas/BoardRow' }, description: 'Event bills that changed (the caller''s view).' }
        removed_bill_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        person_balances: { type: array, items: { $ref: '#/components/schemas/DebtPerson' }, description: 'Every person whose balance moved, with the new balance (people list row / person page header).' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' }, description: 'Every wallet whose balance moved (a top-level account_balances, where the answer has one, carries the same list).' }
    # ───────── events (projects, 0.3.1-10) ─────────
    Event:
      type: object
      description: 'An event, page-ready (list row and the detail header). Single currency: amounts are in the user''s currency.'
      required: [id, owner_user_id, name, icon_code, description, note, status, kind, start_date, end_date, planned_amount, members_count, total_expense, my_paid, my_share, my_receivable, my_payable, remaining, total_income, my_net, tags, my_member_id, my_role, is_owner, is_locked, can_add_bill, can_edit, can_manage_members, completed_at, can_complete, empty_person_bill_count, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        owner_user_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 100 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        status: { type: string, enum: [active, completed, cancelled, archived] }
        kind: { type: string, enum: [event, split], description: '0.4.1-2 S1: always event in the events list and on the event page; split only on the hidden "event" of a split bill (EventPatch.event of an /event-bills write on a split bill).' }
        start_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        end_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        planned_amount: { type: [number, 'null'] }
        members_count: { type: integer, description: 'Active members.' }
        total_expense: { $ref: '#/components/schemas/Money', description: 'Σ expense bills (parents).' }
        my_paid: { $ref: '#/components/schemas/Money', description: 'What I paid on the expense bills.' }
        my_share: { $ref: '#/components/schemas/Money', description: 'My part of the expense bills (a bill without splits is all its payer''s).' }
        my_receivable: { $ref: '#/components/schemas/Money', description: 'my_net when > 0 (others owe me), else 0.' }
        my_payable: { $ref: '#/components/schemas/Money', description: '−my_net when < 0 (I owe others), else 0.' }
        remaining: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'planned_amount − (expense − income); null without a plan.' }
        total_income: { $ref: '#/components/schemas/Money' }
        my_net: { $ref: '#/components/schemas/Money', description: 'My position: paid − share on expense bills (> 0 = the others owe me). 0 when I have no part.' }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' }, description: 'MY personal tags on the event (private to me; each member groups events their own way).' }
        my_member_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        my_role: { type: [string, 'null'], enum: [owner, contributor, viewer, null] }
        is_owner: { type: boolean }
        is_locked: { type: boolean, description: 'Not active (completed / cancelled / archived): bills and tags are read-only.' }
        can_add_bill: { type: boolean, description: 'Active event and I''m an active owner / contributor.' }
        can_edit: { type: boolean, description: 'I may edit the event itself (owner; false once completed: only my personal tag_ids stay editable).' }
        can_manage_members: { type: boolean, description: 'Owner, and the event was never completed.' }
        completed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: '0.4.1-2 V2: when the owner completed the event (POST /projects/{id}/complete). Set = locked for good: no bill / member / event edits, no sync to anyone''s book (links stay, frozen), never back to active or cancelled; archiving and deleting are allowed (owner 2026-10-28) and restoring an archived one returns it to completed. Null = never completed.' }
        can_complete: { type: boolean, description: '0.4.1-2 V2: I''m the owner and the event is active (the "ปิดอีเวนต์" button). The call may still refuse with EVENT_HAS_EMPTY_PERSON.' }
        empty_person_bill_count: { type: integer, description: '0.4.1-2 V15: bills with an empty person "( ) ____" (a removed member''s spot) to assign; > 0 = a ต้องจัดการ entry, and complete is refused.' }
        linked_tx_count: { type: integer, description: 'My own personal transactions in this event (the delete dialog: "ยืนยันและลบ x รายการ").' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    EventList:
      type: object
      required: [data, summary, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Event' } }
        summary:
          type: object
          description: 'The list''s summary card, over MY events (active member, not archived), the same whatever the list filter. my_share_total = my part of the ACTIVE events'' expense bills, paid_total = what I paid in them. receivable_total = Σ my_receivable and payable_total = Σ my_payable over every event (active or ended; 0.4.0-3, was active only). counts: all = every event; active = active events; unsettled = events where I am owed or owe something; receivable / payable = events where I am owed / owe; ended = completed + cancelled.'
          required: [my_share_total, paid_total, receivable_total, payable_total, counts]
          properties:
            my_share_total: { $ref: '#/components/schemas/Money' }
            paid_total: { $ref: '#/components/schemas/Money' }
            receivable_total: { $ref: '#/components/schemas/Money' }
            payable_total: { $ref: '#/components/schemas/Money' }
            counts:
              type: object
              required: [all, active, unsettled, receivable, payable, ended]
              properties:
                all: { type: integer }
                active: { type: integer }
                unsettled: { type: integer }
                receivable: { type: integer }
                payable: { type: integer }
                ended: { type: integer }
        pagination: { $ref: '#/components/schemas/Page' }
    EventMember:
      type: object
      required: [id, user_id, name, avatar, is_me, linked, contact_id, role, status, invited_at, joined_at, left_at, removed_at]
      x-breaking: '0.4.2 1b: icon_code → avatar.'
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The linked user (an app account), else null.' }
        name: { type: string, description: 'Live profile name for an app user, else the typed name.' }
        avatar: { $ref: '#/components/schemas/Avatar', description: 'The app user''s avatar, else the member''s own icon, else initials.' }
        is_me: { type: boolean }
        linked: { type: boolean, description: 'An app user (user_id set).' }
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: '0.4.0-3: MY contact for this member (linked member → my contact linked to that user; typed member → my contact with the same name, case-insensitive). Lets the bill form tell a picked contact that is already a member from a new person (ใหม่ · เพิ่มเข้าอีเวนต์). Null when none (and on my own row).' }
        role: { type: string, enum: [owner, contributor, viewer] }
        status: { type: string, enum: [pending, active, left] }
        invited_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        joined_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        left_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        removed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: '0.4.1-2 V15: set = the owner removed them (status left); left_at alone = they left.' }
    EventMemberList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EventMember' } }
    EventTagRef:
      type: object
      description: 'An event-scoped tag as a bill shows it.'
      required: [id, name, icon_code, mine]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        mine: { type: boolean, description: 'I have a personal tag with this name (case-insensitive): hide "+ add to my tags".' }
    EventTag:
      allOf:
        - { $ref: '#/components/schemas/EventTagRef' }
        - type: object
          required: [count]
          properties:
            count: { type: integer, description: 'Bills (parents) carrying it.' }
    EventTagList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EventTag' } }
    EventPosition:
      type: object
      description: 'A member''s standing: paid = expense bills they paid; share = their split rows (a bill without splits is fully its payer''s share); sent / received = paybacks they made / got (0.4.0-3); net = paid − share + sent − received (> 0: the others owe them).'
      required: [member, paid, share, sent, received, net, receivable, payable]
      properties:
        member: { $ref: '#/components/schemas/MemberRef' }
        paid: { $ref: '#/components/schemas/Money' }
        share: { $ref: '#/components/schemas/Money' }
        sent: { $ref: '#/components/schemas/Money' }
        received: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        receivable: { $ref: '#/components/schemas/Money', description: 'net when > 0 (others owe them), else 0.' }
        payable: { $ref: '#/components/schemas/Money', description: '−net when < 0 (they owe others), else 0.' }
    SettleLine:
      type: object
      required: [from, to, amount, recorded]
      properties:
        from: { $ref: '#/components/schemas/MemberRef', description: 'Owes.' }
        to: { $ref: '#/components/schemas/MemberRef', description: 'Gets.' }
        amount: { $ref: '#/components/schemas/Money' }
        recorded: { type: boolean, description: '0.4.1-2 V8: a line with me in it that is in my book: a real pair whose bills are all claimed (listClaimableBills), or any of my lines once I booked the fewest-transfers settle (my_settle_booking). False for lines without me. (The 0.4.0-4 per-line {event_id} debt is retired.)' }
    MyBooks:
      type: object
      description: '0.4.0-3: which parts of my books hold the row.'
      required: [tx, debt, repay]
      properties:
        tx: { type: boolean, description: 'A tx of mine linked to / copied from it or one of its splits.' }
        debt: { type: boolean, description: 'A debt made from it (bill_id).' }
        repay: { type: boolean, description: 'A repayment with bill_id = it.' }
    EventBillPerson:
      allOf:
        - { $ref: '#/components/schemas/BillMember' }
        - type: object
          properties:
            paid_back: { type: boolean, description: '"คืนแล้ว": paid the payer back on the spot (a payback row on the board; my book per bookEventBill). Ignored on the payer.' }
    EventBillInput:
      type: object
      required: [kind, amount, date]
      description: 'The bill of the sheet. kind expense / income: payer + members (the payer may be listed; their share is the rest). kind payback: from paid back to (one each, not the same person).'
      properties:
        kind: { type: string, enum: [expense, income, payback] }
        amount: { type: number, exclusiveMinimum: 0, description: 'The whole bill / the payback.' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids', description: 'This event''s tags (absent and I paid: my transaction''s tags by name).' }
        payer: { oneOf: [{ $ref: '#/components/schemas/BillPerson' }, { type: 'null' }], description: 'expense / income; default me. 0.4.1-2: someone else on an income too ("รับแทน", Q-E3), and it may change on an edit (Q-B4). Shorthand for ONE payer of the whole bill; never together with `payers` (400 VALIDATION_ERROR).' }
        payers:
          type: array
          description: |
            0.4.1-2 multi-payer ("คนจ่าย", owner 2026-10-28), expense / income only: one or more payers with what each paid; Σ amount = the bill (400 PAYERS_SUM), each > 0, a person once (400 VALIDATION_ERROR). `members` stay the shares ("คนหาร", Σ = the bill). One entry = the old single payer.
            Who owes whom (the real pairs): each share is split over the payers in proportion to what they paid — member m owes payer p = share_m × paid_p / bill (2 dp). E.g. 123: payers ปอนด์ 110 + ลี 13, share ปอนด์ 123 → ปอนด์ owes ลี 13 (a partial "จ่ายแทน").
            My copy: what left my wallet = what I paid; the transaction = max(my paid, my share) (paid < share → paid_by_amount = share − paid, "จ่ายโดย" the other payers; paid > share → the others owe me the rest); reports count my share. `paid_back` on a member = they paid each payer their pair on the spot (one payback row per payer).
          items: { $ref: '#/components/schemas/BillPayerInput' }
        members: { type: array, items: { $ref: '#/components/schemas/EventBillPerson' } }
        from: { oneOf: [{ $ref: '#/components/schemas/BillPerson' }, { type: 'null' }], description: 'payback: who paid back.' }
        to: { oneOf: [{ $ref: '#/components/schemas/BillPerson' }, { type: 'null' }], description: 'payback: who got it.' }
        payback_kind: { type: string, enum: [payback, loan], description: '0.4.1-2 V11, kind payback only: payback (default) or loan (lending during the event; the debt form''s new debt-type bill).' }
    EventBillBooks:
      type: object
      required: ['on']
      description: 'What MY book holds of the bill (see bookEventBill).'
      properties:
        'on': { type: boolean, description: '"ลงบัญชีของฉัน". false = nothing in my book (on an edit: every linked part is unlinked, its rows stay).' }
        tx: { type: boolean, description: 'My transaction (the whole bill when I paid, my share when someone else did, the repayment on a payback).' }
        debt: { type: [boolean, 'null'], description: 'The debts (see bookEventBill). Payback: null / absent = the server decides.' }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The wallet my money moves on (ignored for my share of a bill someone else paid and I did not pay back).' }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        tag_ids: { $ref: '#/components/schemas/Ids', description: 'My personal tags on my transaction.' }
        private_note: { type: [string, 'null'], maxLength: 500, description: '0.4.1-2 S11: my private note on my copy transaction (never synced, never shown to the others). Absent = unchanged; null / "" = clear.' }
    EventBillBookRequest:
      type: object
      required: [bill, my_books]
      description: 'project_id, new_event or split: true (exactly one; 400 VALIDATION_ERROR).'
      properties:
        split: { type: boolean, description: '0.4.1-2 S1 / S2: a split bill (no event). Its people (payer + members) become its members: me, my contacts (a connected contact = a linked member, gets a copy), typed names.' }
        project_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        new_event:
          oneOf:
            - type: 'null'
            - type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        bill: { $ref: '#/components/schemas/EventBillInput' }
        my_books: { $ref: '#/components/schemas/EventBillBooks' }
    EventBillRebookRequest:
      type: object
      required: [my_books]
      properties:
        bill: { oneOf: [{ $ref: '#/components/schemas/EventBillInput' }, { type: 'null' }], description: 'Absent / null = my book only. kind can''t change (400 VALIDATION_ERROR).' }
        my_books: { $ref: '#/components/schemas/EventBillBooks' }
        apply_to_my_tx: { type: boolean, description: 'Ignored since 0.4.1-2 (my copy always follows the bill I save).' }
        expected_updated_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: '0.4.1-2 S14: EventBillView.updated_at as the form loaded it; the bill changed since → 409 BILL_CHANGED. Absent = no check.' }
        move: { oneOf: [{ $ref: '#/components/schemas/EventBillMove' }, { type: 'null' }], description: '0.4.1-2 S17: move the bill to another event / into a split bill (with `bill` or alone).' }
    EventBillMove:
      type: object
      description: '0.4.1-2 S17: exactly one target (400 MOVE_TARGET).'
      properties:
        project_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Another event (I may add bills there).' }
        new_event:
          oneOf:
            - type: 'null'
            - type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        split: { type: boolean, description: 'Out of its event: the bill becomes a split bill with the same people.' }
    EventBillView:
      type: object
      description: '0.4.1-2 SA2: GET /event-bills/{pt_id}, the ONE bill form (event bill sheet / split bill form) for every member, opened from anywhere.'
      required: [bill, event, members, tags, rights, my_copy, updated_at]
      properties:
        bill: { $ref: '#/components/schemas/BoardRow', description: 'The bill: payer (transaction_member), every share (children, with paid_back), event tags, note, my_share, my_books.' }
        event: { $ref: '#/components/schemas/EventRef', description: 'kind event | split, status (completed = locked: rights all false, edit opens the transaction''s own form).' }
        members: { type: array, items: { $ref: '#/components/schemas/EventMember' }, description: 'The people the form may pick (an event: its members; a split bill: its people).' }
        tags: { type: array, items: { $ref: '#/components/schemas/EventTag' }, description: 'Event tags ([] on a split bill).' }
        rights:
          type: object
          required: [can_edit, can_delete, can_change_payer, can_move]
          properties:
            can_edit: { type: boolean, description: 'Edit the bill (event: owner / contributor of an active event; split: any member who is an app user).' }
            can_delete: { type: boolean }
            can_change_payer: { type: boolean, description: 'Not on a payback.' }
            can_move: { type: boolean }
        my_copy: { oneOf: [{ $ref: '#/components/schemas/MyBillCopy' }, { type: 'null' }], description: 'Null when I have no part in the bill (not payer, no share, not in the payback).' }
        updated_at: { $ref: '#/components/schemas/DateTime', description: 'Send back as expected_updated_at.' }
    MyBillCopy:
      type: object
      description: '0.4.1-2: my copy of a shared bill (SA3 "my copy" block).'
      required: [connected, role, amount, transaction, paid_by, paid_back_me, my_paid, paid_by_parts, debts, in_sync, differences, pending_update, private_note]
      properties:
        connected: { type: boolean, description: 'false = I disconnected it (my records are plain; the bill no longer reaches me; my_books.on true connects again).' }
        role: { type: string, enum: [payer, share, payback_from, payback_to], description: 'My place in the bill.' }
        amount: { $ref: '#/components/schemas/Money', description: 'What my copy transaction should hold: the whole bill (payer), my share, or the payback.' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/Transaction' }, { type: 'null' }], description: 'My copy transaction (null = none yet / disconnected).' }
        paid_by: { oneOf: [{ $ref: '#/components/schemas/MemberRef' }, { type: 'null' }], description: 'Someone else paid and I have not paid them back: the wallet slot shows "จ่ายโดย {name}" (no wallet); the tick "คืน {name} แล้ว" (my members[] row paid_back true) brings the wallet picker back, no debt.' }
        paid_back_me: { type: boolean, description: 'My "คืนแล้ว" tick (members[me].paid_back).' }
        my_paid: { $ref: '#/components/schemas/Money', description: 'Multi-payer (owner 2026-10-28): what I paid of the bill (0 = someone else paid it all). My copy transaction holds max(my_paid, my share); the wallet moves my_paid.' }
        paid_by_parts: { type: array, items: { $ref: '#/components/schemas/BillPayer' }, description: 'Who paid my share and how much each (my real pairs where I owe; [] when I paid it all or paid back). paid_by = the biggest of them.' }
        debts: { type: array, items: { $ref: '#/components/schemas/DebtEntry' }, description: 'My person-book rows of this bill (debts "X owes me" / "I owe P", and "คืนแล้ว" repayments).' }
        in_sync: { type: [boolean, 'null'], description: 'My copy (transaction + debts) matches the bill. Null when I have no copy.' }
        differences: { type: array, items: { $ref: '#/components/schemas/BillDifference' }, description: 'Mine vs the bill''s ([] in sync).' }
        pending_update: { type: boolean, description: 'An unanswered shared_bill_created / project_tx_changed notice about this bill waits for me ("อัปเดตตาม").' }
        private_note: { type: [string, 'null'], maxLength: 500, description: 'My private note (on my copy transaction).' }
    EventBillApplyResult:
      type: object
      description: '0.4.1-2: POST /event-bills/{pt_id}/apply and /disconnect.'
      required: [my_copy, bill, effects]
      properties:
        my_copy: { oneOf: [{ $ref: '#/components/schemas/MyBillCopy' }, { type: 'null' }] }
        bill: { oneOf: [{ $ref: '#/components/schemas/EventBillView' }, { type: 'null' }], description: 'The whole bill form after the write (one call, no GET after); null when the bill is gone or I can no longer open it.' }
        effects: { $ref: '#/components/schemas/Effects' }
    EventBillDeleteResult:
      type: object
      description: '0.4.1-2: DELETE /event-bills/{pt_id}.'
      required: [id, project_id, removed_project, effects]
      properties:
        id: { $ref: '#/components/schemas/Uuid', description: 'The bill removed.' }
        project_id: { $ref: '#/components/schemas/Uuid' }
        removed_project: { type: boolean, description: 'The hidden split "event" went with its last bill.' }
        event: { oneOf: [{ $ref: '#/components/schemas/EventPatch' }, { type: 'null' }], description: 'An event bill: the event patch (removed_row_id = the bill). Null on a split bill.' }
        effects: { $ref: '#/components/schemas/Effects', description: 'My side: removed_bill_ids [the bill], my copy removed / kept plain, my debts, balances.' }
    EventBillBookResult:
      allOf:
        - { $ref: '#/components/schemas/EventPatch' }
        - type: object
          required: [my_books, paybacks, transaction_id, effects]
          properties:
            my_books: { $ref: '#/components/schemas/MyBooks', description: 'What my book holds of the bill now.' }
            paybacks: { type: array, items: { $ref: '#/components/schemas/BoardRow' }, description: 'The payback rows made for the people marked paid_back.' }
            transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'My transaction for the bill (made or kept); null when none.' }
            effects: { $ref: '#/components/schemas/Effects' }
    EventBillBookPreview:
      type: object
      required: [preview, people, wallets, debt_default]
      properties:
        preview: { type: boolean, enum: [true] }
        people: { type: array, items: { $ref: '#/components/schemas/PersonDelta' } }
        wallets: { type: array, items: { $ref: '#/components/schemas/WalletDelta' } }
        debt_default: { type: boolean, description: 'What my_books.debt null would do (a payback: false when my book already holds this event''s debt with that person).' }
    EventSettle:
      type: object
      required: [pairs, simplified, simplified_available, my_settle_booking]
      properties:
        pairs: { type: array, items: { $ref: '#/components/schemas/SettleLine' } }
        simplified: { type: array, items: { $ref: '#/components/schemas/SettleLine' } }
        simplified_available: { type: boolean, description: '0.4.1-2 V12: the event is completed, so "จ่ายน้อยครั้งสุด" can be shown and booked (bookEventSettle). While active the app shows only the real pairs.' }
        my_settle_booking:
          oneOf:
            - type: object
              required: [booked_at]
              properties:
                booked_at: { $ref: '#/components/schemas/DateTime' }
            - { type: 'null' }
          description: '0.4.1-2 V12: I already booked the simplified lines into my book (then my real pairs can''t be claimed).'
    SettleBookRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [member_id]
            properties:
              member_id: { $ref: '#/components/schemas/Uuid', description: 'The other member of my simplified line.' }
              account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              link_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        preview: { type: boolean }
    SettleBookResult:
      type: object
      required: [settle, effects]
      properties:
        settle: { $ref: '#/components/schemas/EventSettle' }
        effects: { $ref: '#/components/schemas/Effects' }
    EventTagTotal:
      type: object
      description: 'Expense bills by event tag. tag null = untagged.'
      required: [tag, total, share, count]
      properties:
        tag: { oneOf: [{ $ref: '#/components/schemas/EventTagRef' }, { type: 'null' }] }
        total: { $ref: '#/components/schemas/Money' }
        share: { $ref: '#/components/schemas/Money', description: 'My share of those bills.' }
        count: { type: integer }
    EventSummary:
      type: object
      required: [total_expense, total_income, transaction_count, member_count, planned_amount, spent_net, remaining, my_position, members, by_tag]
      properties:
        total_expense: { $ref: '#/components/schemas/Money' }
        total_income: { $ref: '#/components/schemas/Money' }
        transaction_count: { type: integer, description: 'Bills (parents).' }
        member_count: { type: integer, description: 'Active members (= Event.members_count).' }
        planned_amount: { type: [number, 'null'] }
        spent_net: { type: [number, 'null'], description: 'expense − income; null without a plan.' }
        remaining: { type: [number, 'null'], description: 'planned − spent_net (may be negative); null without a plan.' }
        my_position: { oneOf: [{ $ref: '#/components/schemas/EventPosition' }, { type: 'null' }] }
        members: { type: array, items: { $ref: '#/components/schemas/EventPosition' }, description: 'Active members plus anyone who left with money in it; paid desc.' }
        by_tag: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/EventTagTotal' }, description: 'Top 5 by total.' }
    BoardSplit:
      type: object
      description: 'One split of a bill (a child row).'
      required: [id, transaction_member, amount, marks, my_mark, paid_back]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        transaction_member: { $ref: '#/components/schemas/MemberRef' }
        amount: { $ref: '#/components/schemas/Money' }
        marks: { type: array, items: { $ref: '#/components/schemas/Uuid' }, description: 'Member ids who ticked it.' }
        my_mark: { type: boolean }
        paid_back: { type: boolean, description: '0.4.1-1: "คืนแล้ว" — a payback row (this member → the payer) was made for this bill (the bill sheet shows the tick; un-ticking it on PUT /event-bills removes it).' }
    BoardRow:
      type: object
      description: 'A bill (parent row) with its splits nested, page-ready. A payback (type payback, 0.4.0-3) is "transaction_member paid children[0].transaction_member back", one child for the whole amount.'
      required: [id, project_id, type, amount, date, description, note, transaction_member, payers, record_user_id, tags, marks, my_mark, my_share, locked, linked, my_booked, my_books, source_tx, children, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        project_id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [expense, income, payback] }
        payback_kind: { type: [string, 'null'], enum: [payback, loan, null], description: '0.4.1-2 V11: a debt-type bill (type payback): payback = paying back what was owed, loan = lending during the event (same settle math: the receiver owes the giver). Null on expense / income.' }
        my_booked: { type: boolean, description: '0.4.0-3: my part is in my books: a tx of mine linked to / copied from it or one of its splits, a repayment with bill_id = it, or a debt made from it. Replaces marks as the ✓.' }
        my_books: { $ref: '#/components/schemas/MyBooks' }
        amount: { $ref: '#/components/schemas/Money' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        transaction_member: { $ref: '#/components/schemas/MemberRef', description: 'Who paid (with several payers: the main, biggest one; first on a tie).' }
        payers: { type: array, items: { $ref: '#/components/schemas/BillPayer' }, description: '0.4.1-2 multi-payer ("คนจ่าย"): every payer with what they paid, biggest first; one entry for a single payer. The shares stay transaction_member''s rest + children.' }
        record_user_id: { $ref: '#/components/schemas/Uuid' }
        tags: { type: array, items: { $ref: '#/components/schemas/EventTagRef' } }
        marks: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        my_mark: { type: boolean }
        my_share: { $ref: '#/components/schemas/Money', description: 'My part: payer = amount − Σ others'' splits; split member = my split; else 0.' }
        locked: { type: boolean, description: 'I can''t edit it (event not active, or I''m a viewer / not active).' }
        linked: { type: boolean, description: 'Made from a member''s personal transaction (linked by prompt: money edits ask / notify, see updateProjectTransaction).' }
        source_tx: { oneOf: [{ $ref: '#/components/schemas/LinkedTx' }, { type: 'null' }], description: 'Only for the owner of that transaction; null for everyone else.' }
        children: { type: array, items: { $ref: '#/components/schemas/BoardSplit' } }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    BoardRowList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BoardRow' } }
        pagination: { $ref: '#/components/schemas/Page' }
    ProjectInviteAcceptResult:
      description: 'The event detail plus `inbox_summary` (the inbox numbers after the accept; named so because the event detail has its own `summary`).'
      allOf:
        - { $ref: '#/components/schemas/EventDetail' }
        - type: object
          required: [inbox_summary]
          properties:
            inbox_summary: { $ref: '#/components/schemas/InboxSummary' }
    ProjectInviteRejectResult:
      type: object
      required: [success, inbox_summary]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        inbox_summary: { $ref: '#/components/schemas/InboxSummary' }
    EventDetail:
      type: object
      description: 'The detail page in one call.'
      required: [event, summary, members, tags, board, delete_preview, auto_sync_events, auto_accept_events]
      properties:
        auto_accept_events: { type: boolean, description: '0.4.1-2: my events auto-accept switch (new bills); same DB value as /users/me.' }
        auto_sync_events: { type: boolean, description: '0.4.1-2 S4: my events auto-sync switch (the same DB value as /users/me; change it with PUT /notifications/settings or PUT /users/me).' }
        event: { $ref: '#/components/schemas/Event' }
        summary: { $ref: '#/components/schemas/EventSummary' }
        members: { type: array, items: { $ref: '#/components/schemas/EventMember' } }
        tags: { type: array, items: { $ref: '#/components/schemas/EventTag' } }
        board: { $ref: '#/components/schemas/BoardRowList' }
        delete_preview:
          description: 'Only with ?include=delete_preview, else null: what deleting the event removes.'
          oneOf:
            - type: 'null'
            - type: object
              required: [bills, members, linked_tx_count]
              properties:
                bills: { type: integer }
                members: { type: integer }
                linked_tx_count: { type: integer, description: 'My own book records linked to it (delete_linked_txs).' }
    EventPatch:
      type: object
      description: 'What every event write returns: the final state to patch from (no re-fetch). Every key is always present.'
      required: [event, summary, members, tags, row, removed_row_id, account_balances]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        summary: { $ref: '#/components/schemas/EventSummary' }
        members: { type: array, items: { $ref: '#/components/schemas/EventMember' } }
        tags: { type: array, items: { $ref: '#/components/schemas/EventTag' } }
        row: { oneOf: [{ $ref: '#/components/schemas/BoardRow' }, { type: 'null' }], description: 'The bill the write created / changed (after a split-row delete or a tick: its parent).' }
        removed_row_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'A bill (parent) that left the board.' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' }, description: 'Wallets a linked transaction moved on (else []).' }
