              },
              "budgets": {
                "type": "integer"
              },
              "goals": {
                "type": "object",
                "required": [
                  "count",
                  "progress_pct"
                ],
                "properties": {
                  "count": {
                    "type": "integer"
                  },
                  "progress_pct": {
                    "type": "number"
                  }
                }
              },
              "debts_summary": {
                "type": "object",
