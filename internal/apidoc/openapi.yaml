  /telegram/webhook:
    post:
      tags: [Internal]
      summary: Telegram bot webhook (Telegram calls it, never the app)
      operationId: telegramWebhook
      x-internal: true
      description: |
        0.4.2 1a. Registered only when `TELEGRAM_BOT_TOKEN` is set (otherwise 404). Public: no JWT, no app build check, no sync middleware; the request log never holds its body.
        Telegram sends `X-Telegram-Bot-Api-Secret-Token` = `TELEGRAM_WEBHOOK_SECRET` (set by `setWebhook` on start, `allowed_updates: ["message"]`); a missing / wrong one → 401.
        Anything else → 200 with an empty body (Telegram retries non-200, and a JSON body would be run as a Bot API method), also for a body that is not an update.
        The bot answers in the chat (`sendMessage`, as a reply), private chats only, each `update_id` once:
        allowed chat + text → kept in `telegram_messages`, "ได้รับข้อความแล้ว ✓" · allowed + not text (photo, voice, sticker …) → "ตอนนี้รับแค่ข้อความตัวอักษรนะครับ" · `/start` → a one-line hello · chat not in `TELEGRAM_ALLOWED_CHAT_IDS` → "ยังไม่เปิดให้ใช้ (chat id: N)" · group / channel / edited message / other updates → no reply.
      parameters:
        - { name: X-Telegram-Bot-Api-Secret-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramUpdate' }
      responses:
        '200':
          description: Handled, ignored or unreadable; empty body.
        '401': { $ref: '#/components/responses/Unauthorized' }
      security: []
      x-breaking: 'New (0.4.2 1a).'

