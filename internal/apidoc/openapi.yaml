        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: 'New (0.4.2 1b).'
    get:
      tags: [Connections]
      summary: A stored profile picture (the `photo_url` of an avatar)
      operationId: getAvatarImage
      description: 'JPEG bytes. Bearer auth (any signed-in user: others see my picture like they see my icon). `?v=` = the version in photo_url; the answer is `Cache-Control: private, max-age=31536000, immutable`. 404 when the picture is gone.'
      parameters:
        - { name: v, in: query, schema: { type: integer } }
      responses:
        '200':
          description: The picture.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: 'New (0.4.2 1b).'
