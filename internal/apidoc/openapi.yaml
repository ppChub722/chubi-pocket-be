  # ───────────────────────────── Sign up / log in with Telegram (0.4.2 1b-2) ─────────────────────────────
  /auth/telegram/start:
    post:
      tags: [Auth]
      summary: Start "เข้าสู่ระบบด้วย Telegram" (PKCE)
      operationId: startTelegramLogin
      description: |
        Public. The app makes a random `code_verifier` (43–128 chars of `A-Z a-z 0-9 - . _ ~`), keeps it, and sends `code_challenge` = base64url(SHA-256(verifier)) without padding (S256). The answer's `url` (`https://t.me/<bot>?start=login_<code>`) opens Telegram; the user confirms in the chat:
        - a chat linked to an account → "เข้าสู่ระบบ chubi-pocket เป็น <ชื่อที่แสดง> ไหมครับ?" [✓ ยืนยัน];
        - an unlinked chat → "Telegram นี้ยังไม่มีบัญชี chubi-pocket" [สร้างบัญชีใหม่].
        Then the app calls POST /auth/telegram/exchange (on resume, and again while it answers 202). Codes: single use, 5 minutes. Rate-limited per IP (429 RATE_LIMITED). Errors: 400 VALIDATION_ERROR (bad challenge), 409 CONNECTION_UNAVAILABLE (the bot is off).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramLoginStartRequest' }
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLoginStart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: 'CONNECTION_UNAVAILABLE.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 'RATE_LIMITED.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      security: []
      x-breaking: 'New (0.4.2 1b-2).'
  /auth/telegram/exchange:
    post:
      tags: [Auth]
      summary: Finish "เข้าสู่ระบบด้วย Telegram" (poll until confirmed)
      operationId: exchangeTelegramLogin
      description: |
        Public. `{code, code_verifier}`; the verifier must match the start's challenge.
        - 202 `status: pending`: not confirmed in Telegram yet (app: "รอยืนยันใน Telegram" + retry).
        - 200 `status: login`: confirmed by a linked chat → `auth` = the same answer as POST /auth/login. The code is used up.
        - 200 `status: signup`: the chat has no account and the user tapped [สร้างบัญชีใหม่] → `signup` prefills the sign-up page; the code stays valid (until it expires) for POST /auth/telegram/signup.
        Errors: 401 LOGIN_CODE_INVALID (unknown, used, expired, or a wrong verifier: one answer), 400 VALIDATION_ERROR, 429 RATE_LIMITED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramLoginCodeRequest' }
      responses:
        '200':
          description: login or signup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramExchange' }
        '202':
          description: pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramExchange' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: 'LOGIN_CODE_INVALID.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 'RATE_LIMITED.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      security: []
      x-breaking: 'New (0.4.2 1b-2).'
  /auth/telegram/signup:
    post:
      tags: [Auth]
      summary: Create an account from Telegram (no password)
      operationId: signupWithTelegram
      description: |
        Public. After exchange answered `signup`. Creates the account WITHOUT a password (only accounts made through an outside app may have none; password login is refused for them until PUT /auth/password sets one), links that Telegram chat at once (permissions {chat: true}), and imports the Telegram photo and picks it as the avatar when there is one (best effort: a failed import leaves the icon / initials). Returns the same answer as POST /auth/register. The code is used up.
        Errors: 401 LOGIN_CODE_INVALID, 400 VALIDATION_ERROR (display_name 1–100, username 3–50, currency 3 letters), 409 USERNAME_EXISTS (`details.username_suggestion` = a free one), 409 TELEGRAM_ALREADY_LINKED (that chat was linked to an account meanwhile: start again to log in), 403 REGISTRATION_CLOSED, 429 RATE_LIMITED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramSignupRequest' }
      responses:
        '201':
          description: The new account, signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: 'LOGIN_CODE_INVALID.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 'REGISTRATION_CLOSED.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'USERNAME_EXISTS (details.username_suggestion) / TELEGRAM_ALREADY_LINKED.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 'RATE_LIMITED.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      security: []
      x-breaking: 'New (0.4.2 1b-2).'

