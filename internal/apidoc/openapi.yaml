    put:
      tags: [Events]
      summary: Edit an event (owner)
      operationId: updateProject
      description: |
        Partial (owner only, 403 FORBIDDEN_ROLE). `planned_amount` / `description` / `note` / `start_date` / `end_date` present with null clear them. end ≥ start (400 INVALID_DATE_RANGE). `status` changes the lifecycle (a non-active event is read-only except the status itself). `tag_ids` = MY personal tags on the event (any member may send it; it is private to me; the owner-only rule does not apply when it is the only key).
      requestBody:
