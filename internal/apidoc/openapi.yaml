      description: |
        One DB transaction (`preview: true` = rolled back, same answer). For `member_id` and `bill_ids` (bills where I have a pair with that member, see listClaimableBills):
        - The expense / income bills, all in ONE direction (400 CLAIM_MIXED_DIRECTION otherwise), become ONE debt with that person (a lump; one bill = a per-bill debt): amount = Σ the pairs, a part per bill (`DebtEntry.bills`). The debt's person = my contact for them (or their name); description defaults to the event name.
        - `create_copies` (default true): each bill where someone else paid / received and I have no transaction of it yet gets my copy, a "จ่ายโดย X" transaction of my share with no wallet (category / tags / wallet are mine to pick later), connected to the debt's part. Bills I paid keep my origin.
