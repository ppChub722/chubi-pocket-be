      description: 'The imported picture is kept (the row''s `photo`), but while unlinked it is not used: an avatar whose source is this app falls back to the icon. Idempotent: not linked → the same 200. Telegram: the chat gets no message; from then on it gets "เชื่อมบัญชีก่อนนะครับ: แอป → โปรไฟล์ → Telegram". 0.4.2 1b-2: an account with no password can''t unlink its last linked app → 409 LAST_LOGIN_METHOD (app: "ตั้งรหัสผ่านก่อน ไม่งั้นจะเข้าบัญชีไม่ได้"); changing the account (POST …/link) stays allowed.'
      responses:
        '200':
          description: The row, now unlinked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'LAST_LOGIN_METHOD.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      x-breaking: 'New (0.4.2 1b).'
  /connections/{provider}/link:
    parameters: [{ $ref: '#/components/parameters/ProviderPath' }]
    post:
      tags: [Connections]
      summary: Start linking (เชื่อม / เปลี่ยนบัญชี)
      operationId: startConnectionLink
      description: |
        Returns the URL to open in the outside app; the user types nothing. Telegram: `https://t.me/<bot>?start=<code>`; the bot's `/start <code>` binds the chat to me ("เชื่อมกับบัญชี <ชื่อที่แสดง> แล้ว ✓"). A chat linked to another user moves to me; my old Telegram is replaced (เปลี่ยนบัญชี uses this same call). The app re-reads GET /connections/{provider} on resume.
        Errors: 409 CONNECTION_UNAVAILABLE (LINE / Google, or the bot is off on the server).
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionLinkStart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'CONNECTION_UNAVAILABLE.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      x-breaking: 'New (0.4.2 1b).'
  /connections/{provider}/permissions:
    parameters: [{ $ref: '#/components/parameters/ProviderPath' }]
    patch:
      tags: [Connections]
      summary: Turn permissions on / off (one switch = one call)
      operationId: updateConnectionPermissions
      description: 'Body: `{<key>: bool}` (one or more). Telegram `chat` off → the bot answers texts with "ปิดการจดรายการไว้ เปิดได้ในแอป" and keeps nothing. Errors: 400 VALIDATION_ERROR (unknown key / not a bool), 409 NOT_LINKED, 409 PERMISSION_UNAVAILABLE (a "เร็วๆ นี้" key).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: { type: boolean }
              example: { chat: false }
      responses:
        '200':
          description: The row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'NOT_LINKED / PERMISSION_UNAVAILABLE.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      x-breaking: 'New (0.4.2 1b).'
  /connections/{provider}/photo:
    parameters: [{ $ref: '#/components/parameters/ProviderPath' }]
    post:
      tags: [Connections]
      summary: Import / update my picture from the app (นำเข้า / อัปเดต)
      operationId: importConnectionPhoto
      description: |
        Manual, no background refresh. Telegram: the BE reads the newest profile photo (getUserProfilePhotos → the smallest size ≥ 160 px → getFile) and stores it (JPEG); the Bot API URL never leaves the server. A new import bumps the version (`?v=`). It does NOT pick it as the profile picture (PUT /users/me `avatar_settings.source` does).
        Errors: 409 NOT_LINKED, 404 NO_PHOTO ("Telegram ไม่ส่งรูปให้": no photo, or the user's privacy hides it), 502 PROVIDER_ERROR (Telegram failed; try again).
      responses:
        '200':
          description: The row with `photo`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 'NO_PHOTO (or an unknown provider: NOT_FOUND).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'NOT_LINKED / CONNECTION_UNAVAILABLE.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 'PROVIDER_ERROR.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      x-breaking: 'New (0.4.2 1b).'
  /avatars/{id}:
    parameters:
      - { name: id, in: path, required: true, description: 'GET: the picture id (from photo_url). DELETE: the source name (upload / telegram / line / google), i.e. DELETE /avatars/telegram.', schema: { type: string } }
    delete:
      tags: [Connections]
      summary: Delete one of my stored pictures by source (ลบ)
      operationId: deleteAvatarPhoto
      description: 'DELETE /avatars/{source}. When it was the picked source, `avatar_settings.source` becomes icon. Idempotent (no picture → the same 200). An unknown source → 400 VALIDATION_ERROR.'
      responses:
