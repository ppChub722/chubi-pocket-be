    ProjectUpdateTransactionRequest:
      type: object
      properties:
        transaction_member_id: { $ref: '#/components/schemas/Uuid', description: 'Paybacks only: who paid back (400 PAYER_FIXED on a bill). A payback edit keeps one child for the whole amount: amount alone moves it, splits[0].member_id changes the receiver.' }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        splits: { type: array, items: { $ref: '#/components/schemas/ProjectSplitInput' } }
        also_update_link: { type: boolean, description: 'Same as apply_to_my_tx (kept for older clients).' }
        apply_to_my_tx: { type: boolean, description: '0.4.0-3 B3 "แก้ในสมุดของฉันด้วย": MY transaction linked to this bill (made from it, or my copy, also a copy pointing at one of its split rows) takes the bill after the edit: amount (the bill / my share), date, description, note, matching tags added. Without it, the answer''s my_transaction shows in_sync / differences so the app can ask (or POST /transactions/{id}/apply-event later). Other people with a linked transaction get project_tx_changed.' }
    ProjectMarkRequest:
      type: object
      required: [marked]
      properties:
        marked: { type: boolean }
    # ───────── recurring (0.3.1-10) ─────────
    RecurrenceRule:
      type: object
      description: |
        Google-Calendar-style. `daily` / `weekly` / `monthly` / `yearly` every `interval` units from the start date; weekly on `weekdays` (ISO 1 = Monday … 7 = Sunday; default the start's weekday); monthly by `monthly.mode` day (`day` 1–31, a short month clamps to its last day) or weekday (the `nth` 1–5 or -1 = last `weekday`); yearly on the start's month / day; `dates` = hand-picked dates.
      required: [freq, interval, weekdays, monthly, dates]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly, yearly, dates] }
        interval: { type: integer, minimum: 1 }
        weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        monthly:
          oneOf:
            - type: object
              required: [mode, day, nth, weekday]
              properties:
                mode: { type: string, enum: [day, weekday] }
                day: { type: [integer, 'null'], minimum: 1, maximum: 31 }
                nth: { type: [integer, 'null'], description: '1–5, or -1 = the last.' }
                weekday: { type: [integer, 'null'], minimum: 1, maximum: 7 }
            - { type: 'null' }
        dates: { type: array, items: { $ref: '#/components/schemas/Date' } }
    RecurrenceEnd:
      type: object
      required: [kind, date, count]
      properties:
        kind: { type: string, enum: [none, date, count] }
        date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        count: { type: [integer, 'null'], minimum: 1 }
    RecurrenceRuleInput:
      type: object
      description: 'RecurrenceRule as a request: only `freq` is required (interval defaults to 1, weekly days to the start''s weekday, monthly to the start''s day).'
      required: [freq]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly, yearly, dates] }
        interval: { type: integer, minimum: 1 }
        weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        monthly:
          oneOf:
            - type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [day, weekday] }
                day: { type: [integer, 'null'], minimum: 1, maximum: 31 }
                nth: { type: [integer, 'null'] }
                weekday: { type: [integer, 'null'], minimum: 1, maximum: 7 }
            - { type: 'null' }
        dates: { type: array, items: { $ref: '#/components/schemas/Date' } }
    RecurrenceEndInput:
      type: object
      description: 'RecurrenceEnd as a request: `kind` + its value (`date` for date, `count` for count).'
      required: [kind]
      properties:
        kind: { type: string, enum: [none, date, count] }
        date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        count: { type: [integer, 'null'], minimum: 1 }
    RecurringRef:
      type: object
      required: [id, name, icon_code]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        kind: { type: string, enum: [subscription, installment, income, reminder, saving, debt], description: 'Sent by the recurring module (its items); absent on refs other modules embed.' }
        pause_reason: { type: [string, 'null'], enum: [manual, overdue_limit, goal_inactive, no_balance, null], description: '0.4.1-1 R7, as Recurring.pause_reason (null = not paused): ต้องจัดการ shows "ค้าง 3 งวด" on a due row of an overdue_limit setting. Sent by the recurring module (its items); absent on refs other modules embed.' }
    Recurring:
      type: object
      description: 'A recurring setting (the generator), page-ready.'
      required: [id, name, description, note, icon_code, type, amount, account, to_account, category, goal_id, goal, tags, rule, start_date, end, status, kind, trial_until, yearly_cost, monthly_amount, saved_count, pending_count, next_amount, current_occurrence, next_date, days_until, progress, ending_soon, counts, likely, edited_any, actions, created_at, updated_at, due_count, avg_amount, chain, auto_create, recorded_tx_count, pause_reason, person, debt_kind, direction, person_balance, zero_rounds]
      properties:
        likely: { type: boolean, description: 'Only meaningful with the picker hints (for_type + category_id / amount): the setting matches the transaction by category or amount (±5%); such settings are listed first. false otherwise.' }
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        type: { type: string, enum: [expense, income, transfer, saving, debt], description: 'The money direction; the user-facing choice is kind. saving (kind saving) is never money in or out. debt (kind debt, 0.4.1-2) = person-book entries; the money side, when a wallet is set, follows `direction`.' }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'null = a reminder with no amount yet. Kind debt: the rule''s amount (each จ่ายหนี้ occurrence asks min(amount, what is owed), see next_amount / the items).' }
        kind: { type: string, enum: [subscription, installment, income, reminder, saving, debt], description: 'saving = ออมเงิน: each occurrence, when confirmed, saves `amount` from `account` (required, tracks its balance) into `goal` (null = the unallocated pot) as a saving entry, never a transaction. debt = หนี้ (0.4.1-2 K): each occurrence, when confirmed, books a PERSON-BOOK ENTRY with `person` (debt_kind debt = จดหนี้ / repayment = จ่ายหนี้, `direction` paid | received as in the debts API); `account` set = the entry also gets its transaction (system debt category), null = ledger only. No category / tags / goal. A connected contact gets the entry like any debt entry (Q-K6).' }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }], description: 'Kind debt: the person (a contact or a typed name; contacts merged / deleted follow, a deleted contact leaves the name). null for other kinds.' }
        debt_kind: { type: [string, 'null'], enum: [debt, repayment, null], description: 'Kind debt: debt = จดหนี้ (ให้ยืม / ยืม), repayment = จ่ายหนี้ (จ่ายคืน / รับคืน). null for other kinds.' }
        direction: { type: [string, 'null'], enum: [paid, received, null], description: 'Kind debt: the entry direction as in the debts API (paid = money from me to them, received = to me; the app''s arrow). null for other kinds.' }
        person_balance: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Kind debt: the person''s net now, signed like the debts API (> 0 = they owe me, < 0 = I owe them, 0 = cleared). null for other kinds.' }
        zero_rounds: { type: integer, minimum: 0, maximum: 3, description: 'Kind debt, debt_kind repayment: occurrences in a row that came due with nothing owed (nothing booked, status skipped). At 3 the setting pauses with pause_reason no_balance. 0 otherwise.' }
        trial_until: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'Subscription: the free trial runs until this date.' }
        yearly_cost: { $ref: '#/components/schemas/Money', description: 'Amount x the times it happens in an average month x 12 (custom dates: x the number of dates); an installment counts at most amount x count. 0 with no amount.' }
        monthly_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Amount x the times it happens in an average month (the hero''s ต่อเดือน); null with no amount.' }
        saved_count: { type: integer, description: 'Occurrences recorded as a transaction (status done).' }
        pending_count: { type: integer, description: 'Legacy drafts still waiting in pending.' }
        next_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'The amount of the next upcoming occurrence (null = not known / none).' }
        current_occurrence: { oneOf: [{ $ref: '#/components/schemas/RecurringOccurrence' }, { type: 'null' }], description: 'The oldest due occurrence, else the next one within one cycle of today: what a transaction links to; null = none.' }
        due_count: { type: integer, description: 'Occurrences due and not recorded (overdue + today).' }
        avg_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'The mean of the recorded amounts ("เฉลี่ย", a bill that changes); null when none is recorded.' }
        chain:
          type: array
          description: 'A setting WITH an end: every occurrence in order (at most 60), for the dots on its row; [] for a no-end setting or a longer one.'
          items:
            type: object
            required: [slot, status]
            properties:
              slot: { $ref: '#/components/schemas/Date' }
              status: { type: string, enum: [upcoming, due, done, paid, skipped, pending] }
        auto_create: { type: boolean, description: '"บันทึกอัตโนมัติเมื่อถึงวัน": each occurrence that comes due is recorded by itself (dated its date, the occurrence name as description). 0.4.1-1 R12: it never waits and never fails: amount 0 is recorded as 0; a wallet / category that is gone or archived is left empty on the transaction and the setting keeps running; every missed occurrence is made at the next due check (each dated its own date); the overdue limit never applies. The app warns when it is set with amount 0 or on a varying amount.' }
        recorded_tx_count: { type: integer, description: 'Transactions recorded from this setting (the delete question''s N is delete_preview.linked_transactions).' }
        pause_reason:
          type: [string, 'null']
          enum: [manual, overdue_limit, goal_inactive, no_balance, null]
          description: |
            0.4.1-1 R7: why a paused setting is paused; null unless status = paused (an archived one keeps the reason it had).
            - no_balance (0.4.1-2 K5): a จ่ายหนี้ setting (kind debt, debt_kind repayment) whose person owed nothing for 3 occurrences in a row. It turns active again by itself when a new debt with that person makes something owed (the next occurrence = the current period; missed ones are dropped); the user can also resume it.
            - manual: the user paused it.
            - overdue_limit ("ค้าง 3 งวด", the app shows it in ต้องจัดการ and on the detail): a setting holds at most 3 due occurrences, whatever its frequency. When a 4th would come due while 3 are waiting (any 3), the setting turns paused instead of making it: the 3 stay due (stored) and listed; nothing after them is made. Clearing them does NOT resume it; the user resumes it (see resumeRecurring). Auto-create settings are never limited. At the release every setting already over the limit is paused at its first due check.
            - goal_inactive: a saving setting whose goal was closed / archived.
            A wallet that is archived no longer pauses anything (R12).
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        to_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'Transfers only.' }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        goal_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'saving only: the target goal; null = the unallocated pot ("ยังไม่จัดสรร").' }
        goal: { oneOf: [{ $ref: '#/components/schemas/SavingGoalRef', description: 'saving only: the target goal (null = the unallocated pot).' }, { type: 'null' }] }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        rule: { $ref: '#/components/schemas/RecurrenceRule' }
        start_date: { $ref: '#/components/schemas/Date' }
        end: { $ref: '#/components/schemas/RecurrenceEnd' }
        status: { type: string, enum: [active, paused, archived] }
        next_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'The next upcoming occurrence (null when none).' }
        days_until: { type: [integer, 'null'] }
        progress:
          type: object
          required: [done, total]
          properties:
            done: { type: integer, description: 'Occurrences settled so far (n): recorded + paid + the ones before tracked_from.' }
            total: { type: [integer, 'null'], description: 'N; null = no end.' }
        ending_soon: { type: boolean, description: 'A setting WITH an end, active, 2 or fewer occurrences left: show "ต่ออีก".' }
        counts:
          type: object
          description: 'Occurrences by status. upcoming is counted only for a setting with an end (a no-end one has no end to count to); not_created / archived are the old names of due / skipped (same numbers).'
          required: [upcoming, due, pending, done, paid, skipped, not_created, archived]
          properties:
            upcoming: { type: integer }
            due: { type: integer }
            pending: { type: integer, description: 'Legacy drafts still waiting in pending.' }
            done: { type: integer }
            paid: { type: integer }
            skipped: { type: integer }
            not_created: { type: integer }
            archived: { type: integer }
        edited_any: { type: boolean, description: 'An item was edited on its own: show the item list, not the one-line summary.' }
        actions:
          type: object
          required: [pause, resume, archive, restore, extend]
          properties:
            pause: { type: boolean }
            resume: { type: boolean }
            archive: { type: boolean }
            restore: { type: boolean }
            extend: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    RecurringOccurrence:
      type: object
      description: 'A setting''s current occurrence (the oldest due one, else the next one within one cycle of today): what a transaction links to.'
      required: [item_id, rule_id, slot, date, days_until, amount, status]
      properties:
        item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'null while it is only computed (address it by rule_id + slot).' }
        rule_id: { $ref: '#/components/schemas/Uuid' }
        slot: { $ref: '#/components/schemas/Date', description: 'Its original date.' }
        date: { $ref: '#/components/schemas/Date' }
        days_until: { type: integer, description: 'Negative = overdue.' }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'null = not known yet (a reminder).' }
        status: { type: string, enum: [upcoming, due] }
    RecurringLinkRequest:
      type: object
      description: 'Exactly one of transaction_id / debt_entry_id (0.4.1-2: a debt occurrence links a person-book entry of the same person; its transaction comes with it).'
      properties:
        transaction_id: { $ref: '#/components/schemas/Uuid' }
        debt_entry_id: { $ref: '#/components/schemas/Uuid', description: 'Kind debt only: an entry with the setting''s person, same debt_kind and direction (400 VALIDATION_ERROR otherwise), not on another occurrence (409 ITEM_ALREADY_LINKED unless replace).' }
        replace: { type: boolean, description: 'Swap: the occurrence''s current transaction (or the other occurrence this transaction is on) lets go first, in the same DB transaction. Without it a taken side answers 409 ITEM_ALREADY_LINKED.' }
    RecurringLinkResult:
      type: object
      required: [item, transaction, amount_differs, rule_amount, transaction_amount, account_balances, setting, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        setting: { oneOf: [{ $ref: '#/components/schemas/Recurring' }, { type: 'null' }], description: 'The owning setting after the write (no re-fetch); null when the items belong to no / several settings.' }
        item: { $ref: '#/components/schemas/RecurringItem' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/Transaction' }, { type: 'null' }] }
        amount_differs: { type: boolean, description: 'The setting has an amount and the transaction''s differs.' }
        rule_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        transaction_amount: { $ref: '#/components/schemas/Money' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringKindTotals:
      type: object
      required: [count, monthly, yearly]
      properties:
        count: { type: integer }
        monthly: { $ref: '#/components/schemas/Money' }
        yearly: { $ref: '#/components/schemas/Money' }
    RecurringList:
      type: object
      required: [data, counts, summary, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Recurring' } }
        counts:
          type: object
          required: [current, archived, all]
          properties:
            current: { type: integer }
            archived: { type: integer }
            all: { type: integer }
        summary:
          type: object
          description: 'The list''s summary card; the same whatever the status / q / page of the list. month_pay / month_receive = the PER-MONTH EQUIVALENT of the ACTIVE settings (paused, archived and ended ones excluded, so are settings on an archived wallet; transfers and savings are not money in / out): daily = amount × 30.4375 / interval; weekly = amount × weekdays × 4.3481 / interval (no weekdays = 1); monthly = amount / interval; yearly = amount / (12 × interval); custom dates = amount × the dates that fall in the CURRENT month. 2 decimals. next = the nearest upcoming occurrence (today or later) of an active setting of ANY type, null when none; ties by name.'
          required: [month_pay, month_receive, next, due_30d_total, awaiting_amount_count, due_count, due_total, by_kind]
          properties:
            due_count: { type: integer, description: 'Occurrences due and not recorded (overdue + today), every active setting.' }
            due_total: { $ref: '#/components/schemas/Money', description: 'Their known amounts summed.' }
            month_pay: { $ref: '#/components/schemas/Money' }
            month_receive: { $ref: '#/components/schemas/Money' }
            next:
              oneOf:
                - type: object
                  required: [id, name, date, amount, type]
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    date: { $ref: '#/components/schemas/Date' }
                    amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                    type: { type: string, enum: [expense, income, transfer, saving] }
                - { type: 'null' }
            due_30d_total: { $ref: '#/components/schemas/Money', description: 'What is still to pay in the next 30 days: expense occurrences not done / archived, due today or earlier (still waiting) up to 30 days ahead, KNOWN amounts only.' }
            awaiting_amount_count: { type: integer, description: 'Occurrences in that window (and any overdue pending one) that have no amount yet (reminders waiting for the number).' }
            by_kind:
              type: object
              description: 'Per kind, over the ACTIVE settings: how many, their per-month equivalent and yearly cost (same normalisation as month_pay).'
              required: [subscription, installment, income, reminder, saving, debt]
              properties:
                subscription: { $ref: '#/components/schemas/RecurringKindTotals' }
                installment: { $ref: '#/components/schemas/RecurringKindTotals' }
                income: { $ref: '#/components/schemas/RecurringKindTotals' }
                reminder: { $ref: '#/components/schemas/RecurringKindTotals' }
                saving: { $ref: '#/components/schemas/RecurringKindTotals', description: 'Saving settings: what they put aside (never in month_pay / month_receive / due totals).' }
                debt: { $ref: '#/components/schemas/RecurringKindTotals', description: '0.4.1-2 K8: debt settings. They count in month_pay (direction paid) / month_receive (received) and in due_30d_total (paid, at the planned amount) like money settings ("ใกล้ถึง"); budgets see them only through a booked transaction with a category.' }
        pagination: { $ref: '#/components/schemas/Page' }
    RecurringItemLink:
      type: object
      description: 'On a transaction produced from (or linked to) a recurring item.'
      required: [item_id, recurring, seq, total]
      properties:
        item_id: { $ref: '#/components/schemas/Uuid' }
        recurring: { oneOf: [{ $ref: '#/components/schemas/RecurringRef' }, { type: 'null' }], description: 'null = a one-off / manual item.' }
        seq: { type: [integer, 'null'] }
        total: { type: [integer, 'null'] }
    LinkedTx:
      type: object
      description: 'A real transaction a module record is linked to (an event bill made from it, a recurring item produced into it). Same mechanism everywhere: the link lives on the module record; a deleted transaction just breaks the link.'
      required: [id, description, account]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        description: { type: [string, 'null'] }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
    RecurringItem:
      type: object
      description: 'One occurrence of a setting, COMPUTED from its rule or STORED (a row exists only when it was edited, recorded, paid or skipped; id null = computed). Its address is rule_id + slot either way. status: upcoming (dated after today) | due (today or before, not recorded) | done (a transaction) | paid (settled without one) | skipped | pending (a legacy draft still waiting). A slot before the setting''s tracked_from (its creation day) is paid implicitly.'
      required: [id, rule_id, slot, stored, auto_created, needs_amount, recurring, seq, total, date, days_until, status, edited, manual, type, amount, account, to_account, category, goal_id, goal, tags, description, note, splits, project, pending_id, transaction, saving_entry_id, person, debt_entry, debt_kind, direction, created_at, updated_at]
      properties:
        id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The stored row; null while only computed.' }
        rule_id: { $ref: '#/components/schemas/Uuid' }
        slot: { $ref: '#/components/schemas/Date', description: 'The ORIGINAL date (moving the date never changes it).' }
        stored: { type: boolean }
        auto_created: { type: boolean, description: 'Recorded by auto-create (the "อัตโนมัติ" tag).' }
        needs_amount: { type: boolean, description: 'No amount yet and due, or this month''s (ใส่ยอด).' }
        recurring: { oneOf: [{ $ref: '#/components/schemas/RecurringRef' }, { type: 'null' }], description: 'The setting (with its kind).' }
        seq: { type: [integer, 'null'] }
        total: { type: [integer, 'null'] }
        date: { $ref: '#/components/schemas/Date' }
        days_until: { type: integer, description: 'Negative = in the past.' }
        status: { type: string, enum: [upcoming, due, done, paid, skipped, pending] }
        edited: { type: boolean }
        manual: { type: boolean }
        type: { type: string, enum: [expense, income, transfer, saving, debt] }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'The transaction''s (or saving / debt entry''s) amount when recorded; null = not known yet (a reminder: confirm answers 400 AMOUNT_REQUIRED until it has one). Kind debt, debt_kind repayment, not recorded: min(the planned amount, what the person owes now in that direction), worked out on read.' }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }], description: 'Kind debt: the setting''s person (page-ready for ต้องจัดการ rows); null otherwise.' }
        debt_kind: { type: [string, 'null'], enum: [debt, repayment, null], description: 'Kind debt: the setting''s debt_kind (filled or not); null otherwise.' }
        direction: { type: [string, 'null'], enum: [paid, received, null], description: 'Kind debt: the setting''s direction, so an unfilled row shows money out (paid, −) or in (received, +); null otherwise.' }
        debt_entry:
          description: 'Kind debt: the person-book entry that fills this occurrence (status done; transaction = the entry''s transaction when it has one). Deleting the entry skips the occurrence with its last values (K6). null otherwise.'
          oneOf:
            - type: 'null'
            - type: object
              required: [id, kind, direction, amount, date, transaction_id]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                kind: { type: string, enum: [debt, repayment] }
                direction: { type: string, enum: [paid, received] }
                amount: { $ref: '#/components/schemas/Money' }
                date: { $ref: '#/components/schemas/Date' }
                transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        to_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        goal_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'type saving: the goal; null = the unallocated pot.' }
        goal: { oneOf: [{ $ref: '#/components/schemas/SavingGoalRef' }, { type: 'null' }] }
        saving_entry_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'A recorded saving occurrence: the saving entry it made (status done; transaction stays null).' }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        description: { type: [string, 'null'], description: 'The occurrence name ("Netflix ประจำเดือน ต.ค. 2026", the tx description), unless the user typed one.' }
        note: { type: [string, 'null'] }
        splits:
          type: array
          description: 'Legacy rows only; [] otherwise.'
          items:
            type: object
            required: [person, owed_amount]
            properties:
              person: { $ref: '#/components/schemas/PersonRef' }
              owed_amount: { type: number }
        project: { oneOf: [{ $ref: '#/components/schemas/EventRef' }, { type: 'null' }] }
        pending_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Legacy.' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/RecurringItemTx' }, { type: 'null' }] }
        created_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: 'null while only computed.' }
        updated_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
    RecurringItemTx:
      type: object
      description: 'The transaction an occurrence is recorded as.'
      required: [id, description, account, amount, date]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        description: { type: [string, 'null'] }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'Its own date (may differ from the occurrence''s).' }
    RecurringItemList:
      type: object
      required: [data, pagination, window]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RecurringItem' } }
        pagination: { $ref: '#/components/schemas/Page' }
        window:
          description: 'listRecurringRuleItems tab=upcoming of a no-end setting: the window shown and where the next one starts (null = the last). null everywhere else.'
          oneOf:
            - type: 'null'
            - type: object
              required: [from, to, next_from]
              properties:
                from: { $ref: '#/components/schemas/Date' }
                to: { $ref: '#/components/schemas/Date' }
                next_from: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
    RecurringDetail:
      type: object
      required: [recurring, items, upcoming, stats, account_balances, delete_preview]
      properties:
        recurring: { $ref: '#/components/schemas/Recurring' }
        items: { $ref: '#/components/schemas/RecurringItemList', description: 'The history (recorded / paid / skipped / due), newest first.' }
        upcoming: { $ref: '#/components/schemas/RecurringItemList', description: 'The first page of what is coming (soonest first); more: listRecurringRuleItems?tab=upcoming.' }
        stats:
          type: object
          description: 'The detail hero''s numbers.'
          required: [paid_count, paid_total, remaining_total, last_period, avg_amount, last_amount, max_amount, series]
          properties:
            paid_count: { type: integer, description: 'Occurrences settled: recorded + paid without a transaction (0.4.1-1).' }
            paid_total: { $ref: '#/components/schemas/Money', description: 'Their amounts: the transactions'' + the paid-without-transaction amounts (R5; this is the only total those count in).' }
            remaining_total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'A setting with an end: what is left to pay; null otherwise.' }
            last_period: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'The slot of the latest recorded occurrence.' }
            avg_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            last_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            max_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            series:
              type: array
              description: 'The recorded occurrences, newest 24 (the chart of a bill that changes).'
              items:
                type: object
                required: [slot, date, amount]
                properties:
                  slot: { $ref: '#/components/schemas/Date' }
                  date: { $ref: '#/components/schemas/Date' }
                  amount: { $ref: '#/components/schemas/Money' }
        delete_preview:
          description: 'Only with ?include=delete_preview, else null: what a delete touches.'
          oneOf:
            - type: 'null'
            - type: object
              required: [items, linked_transactions, pending_drafts]
              properties:
                items: { type: integer }
                linked_transactions: { type: integer, description: 'Saved records that go with delete_linked.' }
                pending_drafts: { type: integer }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringFields:
      type: object
      description: 'Value fields; partial (absent = unchanged, null clears a nullable one).'
      properties:
        type: { type: string, enum: [expense, income, transfer, saving, debt], description: 'Optional when kind is sent (the kind implies it). saving goes with kind saving only, debt with kind debt only; a setting / occurrence never switches between saving / debt and a money type (400 VALIDATION_ERROR).' }
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Kind debt (0.4.1-2 K): the person as a contact of mine (active; 400 CONTACT_NOT_FOUND / CONTACT_ARCHIVED). Rejected on other kinds.' }
        person_name: { type: [string, 'null'], minLength: 1, maxLength: 100, description: 'Kind debt: the person as a typed name (Q-K1: allowed) when contact_id is null. One of the two is required on create.' }
        debt_kind: { type: string, enum: [debt, repayment], description: 'Kind debt: debt = จดหนี้, repayment = จ่ายหนี้. Required on create.' }
        direction: { type: string, enum: [paid, received], description: 'Kind debt: the entry direction (the arrow). Required on create.' }
        amount: { type: number, minimum: 0, description: 'Required (> 0) except for a reminder, where 0 / absent = no amount yet.' }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'saving: required (400 SAVING_NEEDS_WALLET), a wallet that tracks its balance (400 WALLET_NOT_TRACKED).' }
        to_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Transfers only (dropped on a saving).' }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Dropped on a saving (so are tag_ids).' }
        goal_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'saving only: the goal (active, else 409 GOAL_NOT_ACTIVE; unknown = 404); null / absent = the unallocated pot.' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids' }
    RecurringCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          required: [name, rule, start_date]
          properties:
            kind: { type: string, enum: [subscription, installment, income, reminder, saving, debt], description: 'debt = หนี้ (0.4.1-2): a person (contact_id or person_name) + debt_kind + direction, amount > 0, account_id optional (set = each entry gets its transaction), category_id / tag_ids / goal_id rejected (400 VALIDATION_ERROR); a debt setting never switches to a money kind. subscription = an expense that repeats; installment = an expense with a COUNT of payments (end.kind count required); income = an income that repeats; reminder = เตือนจ่าย (expense or transfer, the amount is optional: omit it or send 0); saving = ออมเงิน (type saving, amount > 0, account_id required, goal_id or null = unallocated; confirming an occurrence makes a saving entry, never a transaction; auto_create defaults to false like every kind). Omitted = derived from type (+ end). The kind implies the type when type is omitted.' }
            trial_until: { type: string, description: 'Subscription only: the free trial runs until this date (yyyy-mm-dd).' }
            name: { type: string, minLength: 1, maxLength: 100 }
            icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
            rule: { $ref: '#/components/schemas/RecurrenceRuleInput' }
            start_date: { $ref: '#/components/schemas/Date' }
            end: { $ref: '#/components/schemas/RecurrenceEndInput' }
            auto_create: { type: boolean, description: 'Record each occurrence by itself when it comes due; any amount (0 too) and any wallet (none too), see Recurring.auto_create (0.4.1-1 R12).' }
    RecurringUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            kind: { type: string, enum: [subscription, installment, income, reminder, saving, debt], description: 'A debt setting stays a debt one; its person / debt_kind / direction can change (empty occurrences take them). Change the kind (re-validated: installment needs an end count, income is an income, subscription / installment are expenses). A saving setting stays a saving one and a money one never becomes one (400 VALIDATION_ERROR).' }
            trial_until: { type: string, description: 'Subscription: a date sets the free-trial end, "" clears it, absent leaves it.' }
            icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
            rule: { $ref: '#/components/schemas/RecurrenceRuleInput' }
            start_date: { $ref: '#/components/schemas/Date' }
            end: { $ref: '#/components/schemas/RecurrenceEndInput' }
            auto_create: { type: boolean, description: 'Switch auto-create on / off (on: only occurrences that come due from today on; never back-creates). Any amount, any wallet (R12).' }
    RecurringExtendRequest:
      type: object
      properties:
        end: { oneOf: [{ $ref: '#/components/schemas/RecurrenceEndInput' }, { type: 'null' }] }
    RecurringDeleteResult:
      type: object
      required: [id, deleted_transaction_count, account_balances, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        id: { $ref: '#/components/schemas/Uuid' }
        deleted_transaction_count: { type: integer }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringItemCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          required: [recurring_id, date, type, amount]
          properties:
            recurring_id: { $ref: '#/components/schemas/Uuid', description: 'The setting the extra occurrence belongs to (required since 0.4.0-2: there are no one-off items).' }
            date: { $ref: '#/components/schemas/Date' }
    RecurringItemUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          properties:
            date: { $ref: '#/components/schemas/Date' }
            scope: { type: string, enum: [this, following, past, upcoming, all], default: this }
    RecurringOccurrenceEditRequest:
      description: 'Presence-based (updateRecurringOccurrence): a key that is sent overrides that value on this occurrence, null clears the override, an absent key is untouched.'
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          properties:
            date: { $ref: '#/components/schemas/Date', description: 'Moves the occurrence (its slot stays).' }
    RecurringConfirmRequest:
      description: 'Optional overrides for the transaction confirmRecurringOccurrence records (absent = the occurrence''s values). Kind debt (0.4.1-2 K4): confirm books the person-book entry (+ its transaction when account_id is set) in the same DB transaction; a connected contact gets it as any debt entry; the answer''s effects carry the entry, its person balance and wallets.'
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          properties:
            date: { $ref: '#/components/schemas/Date', description: 'The transaction''s date (default: the occurrence date).' }
    RecurringSkipRequest:
      type: object
      properties:
        delete_tx: { type: boolean, deprecated: true, description: 'Gone in 0.4.1-1 (ignored): a filled occurrence answers 409 ALREADY_RECORDED; unlink or delete its transaction first.' }
    RecurringMarkPaidRequest:
      type: object
      description: '0.4.1-1 R5: paid without a transaction keeps an amount. Kind debt (0.4.1-2 Q-K2): marking paid books the person-book entry WITHOUT a transaction (status done, debt_entry set), so it counts in the person''s balance.'
      properties:
        amount: { type: number, exclusiveMinimum: 0, description: 'What was paid; absent = the occurrence''s planned amount (400 AMOUNT_REQUIRED when it has none).' }
    RecurringOccurrencesResult:
      type: object
      required: [data, suggested_slot]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RecurringItem' } }
        suggested_slot: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: '"งวดใกล้เคียง": the oldest overdue occurrence, else the open one nearest tx_date; null when none is open.' }
    RecurringBulkResult:
      type: object
      required: [items, left_out, account_balances, setting, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        setting: { oneOf: [{ $ref: '#/components/schemas/Recurring' }, { type: 'null' }], description: 'The setting after the write (no re-fetch).' }
        items: { type: array, items: { $ref: '#/components/schemas/RecurringItem' }, description: 'The occurrences the action settled.' }
        left_out:
          type: array
          description: 'Due occurrences the action could not take, and why: needs_amount (no amount yet) | refused (the record was refused, e.g. an archived wallet or a deleted category; each occurrence runs on its own, the others are recorded).'
          items:
            type: object
            required: [slot, reason]
            properties:
              slot: { $ref: '#/components/schemas/Date' }
              reason: { type: string, enum: [needs_amount, refused] }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringOccurrenceBulkRequest:
      type: object
      required: [action, items]
      properties:
        action: { type: string, enum: [confirm, skip, mark_paid] }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [rule_id, slot]
            properties:
              rule_id: { $ref: '#/components/schemas/Uuid' }
              slot: { $ref: '#/components/schemas/Date' }
              amount: { type: number, exclusiveMinimum: 0, description: 'confirm and mark_paid (0.4.1-1 R5): the amount typed for an occurrence that has none (or overrides its amount). 400 with skip.' }
    RecurringOccurrenceBulkResult:
      type: object
      required: [items, left_out, account_balances, settings, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        items: { type: array, items: { $ref: '#/components/schemas/RecurringItem' }, description: 'The occurrences the action settled, in request order.' }
        left_out:
          type: array
          description: 'Picked occurrences the action could not take, and why: needs_amount (confirm, no amount) | refused (the record was refused, e.g. an archived wallet, a deleted category, a skipped occurrence to confirm) | not_found (no such setting or occurrence) | already_recorded.'
          items:
            type: object
            required: [rule_id, slot, reason]
            properties:
              rule_id: { $ref: '#/components/schemas/Uuid' }
              slot: { $ref: '#/components/schemas/Date' }
              reason: { type: string, enum: [needs_amount, refused, not_found, already_recorded] }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
        settings: { type: array, items: { $ref: '#/components/schemas/Recurring' }, description: 'Every setting with a settled occurrence, after the write (no re-fetch).' }
    RecurringUnlinkResult:
      type: object
      required: [item, setting, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        item: { $ref: '#/components/schemas/RecurringItem' }
        setting: { oneOf: [{ $ref: '#/components/schemas/Recurring' }, { type: 'null' }] }
    RecurringItemWriteResult:
      type: object
      required: [item, transaction, account_balances, setting, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        setting: { oneOf: [{ $ref: '#/components/schemas/Recurring' }, { type: 'null' }], description: 'The owning setting after the write (no re-fetch); null when the items belong to no / several settings.' }
        item: { $ref: '#/components/schemas/RecurringItem' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/Transaction' }, { type: 'null' }], description: 'The transaction the write made (confirm), else null.' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringItemsWriteResult:
      type: object
      required: [items, account_balances, setting, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        setting: { oneOf: [{ $ref: '#/components/schemas/Recurring' }, { type: 'null' }], description: 'The owning setting after the write (no re-fetch); null when the items belong to no / several settings.' }
        items: { type: array, items: { $ref: '#/components/schemas/RecurringItem' } }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringItemDeleteResult:
      type: object
      required: [id, transaction_id, account_balances, setting, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: slots = the occurrences the write changed (final state), transactions = the ones it made / linked / let go, removed_transaction_ids = the ones it deleted, account_balances as the top-level list.' }
        setting: { oneOf: [{ $ref: '#/components/schemas/Recurring' }, { type: 'null' }], description: 'The owning setting after the write (no re-fetch); null when the items belong to no / several settings.' }
        id: { $ref: '#/components/schemas/Uuid' }
        transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The linked transaction deleted with it.' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    EventDeleteResult:
      type: object
      required: [id, split_bill_count, effects]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        split_bill_count: { type: integer, description: 'Bills (and paybacks) that became standalone split bills.' }
        effects: { $ref: '#/components/schemas/Effects' }
