  # ───────────────────────────── Debts (person ledger, 0.3.1-10) ─────────────────────────────
  # One record type: a person entry {person, direction paid|received, amount > 0, date, description,
  # note, paid label, optional wallet tx, optional split source}. net per person = Σ paid − Σ received
  # (> 0 = they owe me, < 0 = I owe them). The "paid" label never changes a number. No cancel, no
  # settled_amount / outstanding: stop counting = delete.
  /personal-debts/people:
    get:
      tags: [Debts]
      summary: People list (one list, owed-to-me and I-owe together)
      operationId: listDebtPeople
      description: |
        One row per person (key `c:<contact_id>` or `n:<lower(name)>`), sorted by |net| desc, then the latest entry date desc.
        Default: only people with something OPEN (net ≠ 0 OR an entry not labelled paid); `all=true` shows everyone.
        `q` matches the resolved person name (case-insensitive substring). `side=owed_to_me` keeps net > 0, `side=i_owe` net < 0.
        `totals` cover every person (they ignore q / side / all / paging), so the header boxes stay put while the list filters.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: q, in: query, schema: { type: string } }
        - { name: all, in: query, schema: { type: boolean }, description: 'true = include people with nothing open.' }
        - { name: side, in: query, schema: { type: string, enum: [owed_to_me, i_owe] } }
      responses:
        '200':
          description: 'One page of people + the header totals.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtPeopleList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: "Replaces the old {data, total_owed_to_me, total_i_owe, net_position} shape: rows are DebtPerson (key, net, open_count …), totals move to `totals`, server paging + q / all / side."
      x-used-by:
        - { page: debts-list, calls: 1 }
        - { page: quick-create-sheet, calls: 1 }
  /personal-debts/people/{key}:
    parameters:
      - { $ref: '#/components/parameters/PersonKeyPath' }
    get:
      tags: [Debts]
      summary: Person page (balance + counts + first page of entries)
      operationId: getDebtPerson
      description: |
        Page-ready: the person's balance, counts and the first page of entries (newest first, same items as listDebtEntries with no filter; `page` / `per_page` apply to `items`).
        A `c:` key of one of the caller's contacts answers even with no entries (zeros, `items: []`); an `n:` key with no entries → 404 NOT_FOUND. A malformed key → 400 INVALID_PERSON_KEY.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: cycle, in: query, description: 'current = entries after the last time the balance with the person hit 0; earlier = the entries before it (older cycles). Omitted = all.', schema: { type: string, enum: [current, earlier] } }
      responses:
        '200':
          description: The person page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtPersonPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
