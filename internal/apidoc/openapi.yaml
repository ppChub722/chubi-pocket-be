        "operationId": "scanSlip",
        "description": "multipart/form-data: `image` (PNG / JPEG), `file_key` (the key sent to checkSlips), `trans_ref` and `bank_code` (read from the slip QR on the phone). Nothing is saved: the drafts come back for the user to keep. Lab knobs (`debug`, `psm`, `preprocess`) are dev-only.",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "image": {
                    "type": "string",
                    "format": "binary"
                  },
                  "file_key": {
                    "type": "string"
                  },
                  "trans_ref": {
                    "type": "string"
                  },
                  "bank_code": {
                    "type": "string"
                  }
                },
                "required": [
                  "image"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "What was read + the drafts it becomes.",
