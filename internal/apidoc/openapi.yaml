components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProviderPath:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [telegram, line, google] }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SlotPath:
      name: slot
      in: path
      required: true
      description: 'An occurrence''s ORIGINAL date (YYYY-MM-DD): its address with the setting id, stored or only computed. Moving the date never changes it.'
      schema: { $ref: '#/components/schemas/Date' }
    PersonKeyPath:
      name: key
      in: path
      required: true
      description: '`c:<contact_id>` or `n:<name>` (URL-encoded).'
      schema: { $ref: '#/components/schemas/PersonKey' }
  responses:
    ValidationError:
      description: '400 VALIDATION_ERROR with `details` = FieldError[] (the invalid fields; maybe empty), or a module code such as SPLITS_EXCEED_AMOUNT.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '401 UNAUTHORIZED.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '403 FORBIDDEN (or a module code such as SPLITS_AUTHOR_ONLY).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '404 NOT_FOUND (also returned for another user''s record).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  headers:
    SyncVersions:
      description: |
        Sent on every non-GET operation that answers 2xx (except the upload parsers and `postSync` itself, which answers with `versions`): the caller's fingerprints after the write, `name=fingerprint` pairs joined by `;`, covering every dataset and page-data key of `SyncVersions`. The app compares them with what it holds and re-syncs what changed.
      schema: { type: string }

  schemas:
    # ───────── Avatars + connections (0.4.2 1b) ─────────
    Avatar:
      type: object
      description: |
        0.4.2 1b: how to draw a person, resolved by the BE (one builder, every person payload). The app never picks the source.
        - `kind` photo: draw `photo_url` (GET it with the Bearer token; the `?v=` changes when the picture does, so cache by URL). On a load error fall back to `icon_code`, then `initials`.
        - `kind` icon: draw `icon_code` (its own colours / border).
        - `kind` initials: `initials` on `colors[0]`.
        Resolution: the picked source (`avatar_settings.source`) when it is available (a photo exists; for an app source the app is still linked) → the icon (`icon_code` set) → initials. A typed name (no contact) and a contact with no icon get initials.
      required: [kind, photo_url, icon_code, initials, colors, border]
      properties:
        kind: { type: string, enum: [photo, icon, initials] }
        photo_url: { type: [string, 'null'], description: 'Set only when kind = photo: `/api/v1/avatars/{id}?v={version}` (a path from the server root).' }
        icon_code:
          description: 'The person''s icon when they have one (also when kind = photo: the load-error fallback), else null.'
          oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }]
        initials: { type: string, description: 'Up to two first letters (first grapheme of the first two words), upper-cased; "" for an empty name. Always set: the last fallback.' }
        colors:
          type: array
          minItems: 1
          items: { type: string }
          description: 'The person''s profile colours, in order (colour 1 = the main one; the UI shows 1–3). Same values as inside icon_code (a theme token or `#rrggbb`), resolved by the viewer''s app. Icon: its background colours, then icon colours, then border colours, duplicates removed. Photo: `avatar_settings.colors`, then the border colours (none set → the icon''s colours when there is an icon). Nothing set: the name-hash colour (`#rrggbb` from the 12-colour palette). Only SET colours: never `""` / null entries; an unset slot is simply missing (a photo with a main colour only → [main]; with border colours → [main, border1, …]). Never empty.'
        border:
          description: 'kind = photo only: the ring around the picture (from avatar_settings.border); null otherwise (an icon carries its border in icon_code).'
          oneOf: [{ $ref: '#/components/schemas/AvatarBorder' }, { type: 'null' }]
      example:
        kind: photo
        photo_url: /api/v1/avatars/0191c2a0-0000-7000-8000-0000000000cc?v=2
        icon_code: { icon: face, bgColors: ['#5AA9F0'] }
        initials: P
        colors: ['#E8A33D', '#F06292']
        border: { style: thick, colors: ['#F06292'] }
    AvatarBorder:
      type: object
      description: 'A photo ring. No border = the border itself is null (there is no "none" style).'
      required: [style, colors]
      properties:
        style: { type: string, enum: [thin, thick, dashed], description: 'An icon-maker border id. PUT /users/me with any other value → 400 VALIDATION_ERROR.' }
        colors: { type: array, items: { type: string }, description: 'Only set colours, in order (empty / null entries are dropped on save).' }
    AvatarSettings:
      type: object
      description: 'users.avatar_settings (0.4.2 1b): the profile picture the user picked. Only the owner sees it (GET /users/me); everyone else gets the resolved `avatar`.'
      required: [source, colors, border]
      properties:
        source: { type: string, enum: [icon, upload, telegram, line, google], description: 'icon (default) = the icon maker''s icon_code. Picking a photo source needs that photo (409 AVATAR_SOURCE_UNAVAILABLE).' }
        colors: { type: array, maxItems: 8, items: { type: string }, description: 'Profile colours for a photo source, in order (the colour-only icon-maker mode edits 1–3). Only set colours: PUT drops empty / null entries before saving (an unset slot is simply missing; at most 8 after that). Ignored while source = icon (an icon''s colours come from icon_code).' }
        border:
          description: 'The ring for a photo source; null = none.'
          oneOf: [{ $ref: '#/components/schemas/AvatarBorder' }, { type: 'null' }]
    AvatarPhoto:
      type: object
      description: 'One stored picture of mine (0.4.2 1b).'
      required: [source, url, imported_at]
      properties:
        source: { type: string, enum: [upload, telegram, line, google] }
        url: { type: string, description: '`/api/v1/avatars/{id}?v={version}`.' }
        imported_at: { $ref: '#/components/schemas/DateTime' }
    Connection:
      type: object
      description: |
        0.4.2 1b: one outside app (profile → การเชื่อมต่อ, and the connection page). Logos, brand colours and availability come from here.
        `available` false = "เร็วๆ นี้" (LINE, Google; Telegram while the bot is off on the server).
      required: [provider, name, brand_color, logo_url, available, linked, account, linked_at, photo, permissions]
      properties:
        provider: { type: string, enum: [telegram, line, google] }
        name: { type: string, description: 'Telegram / LINE / Google.' }
        brand_color: { type: string, description: '`#rrggbb`: Telegram #26A5E4, LINE #06C755, Google #4285F4.' }
        logo_url: { type: string, description: '`/api/v1/brand-logos/{provider}.png?v={n}` (public, 96 px PNG; cache by URL).' }
        available: { type: boolean }
        linked: { type: boolean }
        account: { type: [string, 'null'], description: 'Linked: who it is in that app (Telegram "@username", else the first name). Null when not linked.' }
        linked_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        photo:
          description: 'The picture imported from this app (kept after unlink), else null.'
          oneOf: [{ $ref: '#/components/schemas/AvatarPhoto' }, { type: 'null' }]
        permissions:
          type: array
          items: { $ref: '#/components/schemas/ConnectionPermission' }
          description: 'In display order. Telegram: chat (live), ask, slip, notify (available false). LINE: the same keys. Google: login, sheets, calendar.'
      example:
        provider: telegram
        name: Telegram
        brand_color: '#26A5E4'
        logo_url: /api/v1/brand-logos/telegram.png?v=1
        available: true
        linked: true
        account: '@nong'
        linked_at: '2026-10-28T09:00:00Z'
        photo: { source: telegram, url: /api/v1/avatars/0191c2a0-0000-7000-8000-0000000000cc?v=2, imported_at: '2026-10-28T09:01:00Z' }
        permissions:
          - { key: chat, available: true, on: true }
          - { key: ask, available: false, on: false }
          - { key: slip, available: false, on: false }
          - { key: notify, available: false, on: false }
    ConnectionPermission:
      type: object
      required: [key, available, on]
      properties:
        key: { type: string, enum: [chat, ask, slip, notify, login, sheets, calendar], description: 'The app words it (จดรายการผ่านแชต / ถามยอดเงิน / ส่งสลิป / แจ้งเตือน / เข้าสู่ระบบด้วย Google / ส่งรายการไป Sheets / ลงวันครบกำหนดใน Calendar).' }
        available: { type: boolean, description: 'false = "เร็วๆ นี้" (no switch).' }
        on: { type: boolean, description: 'Always false while unavailable or not linked.' }
    ConnectionList:
      type: object
      required: [data, count]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        count: { type: integer }
    ConnectionLinkStart:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, description: 'Open it in the outside app, e.g. `https://t.me/chubiPocket_bot?start=<code>` (code: 128-bit random, URL-safe, single use).' }
        expires_at: { $ref: '#/components/schemas/DateTime', description: '10 minutes from now. A newer link call cancels older unused codes.' }
    # ───────── Sign up / log in with Telegram (0.4.2 1b-2) ─────────
    TelegramLoginStartRequest:
      type: object
      required: [code_challenge]
      properties:
        code_challenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'base64url(SHA-256(code_verifier)), no padding (PKCE S256).' }
    TelegramLoginStart:
      type: object
      required: [code, url, expires_at]
      properties:
        code: { type: string, description: 'Send it back to exchange / signup (with the verifier). 22 chars, single use.' }
        url: { type: string, description: '`https://t.me/<bot>?start=login_<code>`: open it in Telegram.' }
        expires_at: { $ref: '#/components/schemas/DateTime', description: '5 minutes from now.' }
    TelegramLoginCodeRequest:
      type: object
      required: [code, code_verifier]
      properties:
        code: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    TelegramExchange:
      type: object
      required: [status, auth, signup]
      properties:
        status: { type: string, enum: [pending, login, signup] }
        auth:
          description: 'status login: the signed-in answer (as POST /auth/login); else null.'
          oneOf: [{ $ref: '#/components/schemas/AuthResponse' }, { type: 'null' }]
        signup:
          description: 'status signup: the sign-up page prefill; else null.'
          oneOf: [{ $ref: '#/components/schemas/TelegramSignupInfo' }, { type: 'null' }]
    TelegramSignupInfo:
      type: object
      required: [display_name, username_suggestion, has_photo]
      properties:
        display_name: { type: string, description: 'The Telegram name (first + last).' }
        username_suggestion: { type: string, description: 'The Telegram @username (lower case) when free, else a free variant (name + digits).' }
        has_photo: { type: boolean, description: 'Telegram gives a profile photo: it becomes the avatar on sign-up.' }
    TelegramSignupRequest:
      type: object
      required: [code, code_verifier, display_name, username]
      properties:
        code: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        username: { type: string, minLength: 3, maxLength: 50 }
        currency: { type: string, minLength: 3, maxLength: 3, description: 'Default THB.' }
    # ───────── Telegram (0.4.2, sent BY Telegram; only the fields the bot reads) ─────────
    TelegramUpdate:
      type: object
      description: 'https://core.telegram.org/bots/api#update. Other keys are ignored.'
      required: [update_id]
      properties:
        update_id: { type: integer, format: int64 }
        message: { $ref: '#/components/schemas/TelegramMessage' }
        edited_message: { $ref: '#/components/schemas/TelegramMessage' }
    TelegramMessage:
      type: object
      required: [message_id, chat, date]
      properties:
        message_id: { type: integer, format: int64 }
        chat:
          type: object
          required: [id, type]
          properties:
            id: { type: integer, format: int64 }
            type: { type: string, enum: [private, group, supergroup, channel] }
        from:
          type: object
          properties:
            id: { type: integer, format: int64 }
            is_bot: { type: boolean }
            username: { type: string }
            first_name: { type: string }
        date: { type: integer, format: int64, description: 'Unix seconds.' }
        text: { type: string }
        photo: { type: array, items: { type: object } }
        document: { type: object }
        voice: { type: object }
        sticker: { type: object }
    # ───────── primitives ─────────
    Uuid:
      type: string
      format: uuid
      example: 0191c2a0-0000-7000-8000-000000000001
    Date:
      type: string
      format: date
      description: 'Calendar date in the user''s timezone, `YYYY-MM-DD`.'
      example: '2026-10-12'
    DateTime:
      type: string
      format: date-time
      example: '2026-10-12T09:30:00Z'
    Money:
      type: number
      format: double
      description: 'A decimal amount in the currency of the row it sits on (2 decimals). Always a JSON number, never a string.'
      example: 150.5
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      example: THB
    IconCode:
      type: object
      description: 'How an icon is drawn (the app''s icon spec).'
      properties:
        icon: { type: [string, 'null'] }
        iconColors: { type: array, items: { type: string } }
        background: { type: [string, 'null'] }
        bgColors: { type: array, items: { type: string } }
        border: { type: [string, 'null'] }
        borderColors: { type: array, items: { type: string } }
        shape: { type: [string, 'null'], enum: [circle, squircle, rounded, square, leaf, drop, null] }
    Page:
      type: object
      description: 'Pagination block of a list.'
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 143 }
        total_pages: { type: integer, example: 8 }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable UPPER_SNAKE identifier; clients key on it (map it to their own text), never on `message`. The enum is the server registry (`internal/platform/apierr`; a test keeps them equal): codes are never renamed, new cases only add codes. Each code's HTTP status(es) and meaning: the registry, mirrored in docs `ref/api-document.md` (Errors).
              example: VALIDATION_ERROR
              enum: [
                VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, INTERNAL_SERVER_ERROR,
                APP_OUTDATED, INVALID_CREDENTIALS, WRONG_PASSWORD, EMAIL_EXISTS, USERNAME_EXISTS,
                ACCOUNT_INACTIVE, AVATAR_SOURCE_UNAVAILABLE, ALREADY_ACTIVE, ACCOUNT_NOT_FOUND,
                ACCOUNT_ARCHIVED, ACCOUNT_HAS_MEMBERS, OWNER_MUST_TRANSFER, USER_ALREADY_MEMBER,
                USER_NOT_FOUND, NOT_MEMBER, NOT_OWNER, SCOPE_NOT_ALLOWED, INVALID_IDENTIFIER,
                BALANCE_NOT_EDITABLE, BALANCE_NOT_TRACKED, NO_OP, WALLET_NOT_TRACKED, ROW_LOCKED,
                CONTACT_NOT_LINKED, CATEGORY_NAME_DUPLICATE, INVALID_PARENT, CYCLE_DETECTED,
                MAX_DEPTH_EXCEEDED, SYSTEM_CATEGORY_IMMUTABLE, SYSTEM_CATEGORY_NOT_ALLOWED,
                CATEGORY_TYPE_MISMATCH, CATEGORY_AUTHOR_ONLY, INVALID_CATEGORY, TAG_NOT_FOUND,
                TAG_EXISTS, TAG_NAME_TAKEN, TRANSACTION_NOT_FOUND, TX_NOT_FOUND, TRANSFER_SAME_ACCOUNT,
                SYSTEM_TRANSACTION_IMMUTABLE, SPLITS_NOT_SUPPORTED_YET, SPLITS_ON_TRANSFER,
                SPLITS_AUTHOR_ONLY, SPLITS_EXCEED_AMOUNT, SPLITS_EXCEED_SHARE, SPLIT_MISMATCH,
                PAID_BY_EXPENSE_ONLY, PAID_BY_EXCEEDS_AMOUNT, LINK_MODE_CONFLICT, LINK_MODE_INPUT,
                SHARED_BILL_FIELD, PRIVATE_NOTE_NOT_SHARED, SOURCE_PT_NOT_FOUND, SOURCE_PT_NOT_FOR_USER,
                INVALID_PERSON_KEY, ENTRY_NOT_FOUND, ENTRY_MANAGED_BY_SOURCE, ENTRY_HAS_TRANSACTION,
                DEBT_MANAGED_BY_TX, DEBT_NOT_LINKED, DEBT_TX_ALREADY_LINKED, DEBT_TX_AUTHOR_ONLY,
                DEBT_TX_NEEDS_WALLET, TX_NOT_LINKABLE, TX_NOT_DISCONNECTABLE, TAGS_NEED_WALLET,
                LEDGER_ONLY_NO_WALLET, BILL_NOT_FOUND, USE_CLAIM, CONTACT_NOT_FOUND, CONTACT_ARCHIVED,
                ALREADY_ARCHIVED, NOT_ARCHIVED, ALREADY_LINKED, NOT_LINKED, CANNOT_LINK_SELF,
                REQUEST_REJECTED, NOT_ACCEPTED, STATE_CONFLICT, NOT_FOR_YOU,
                NOTIFICATION_STATE_CONFLICT, NOT_PROJECT_INVITE, TYPE_NOT_MUTABLE, PROJECT_NOT_ACTIVE,
                PROJECT_LOCKED, EVENT_COMPLETED, EVENT_NOT_COMPLETED, EVENT_HAS_EMPTY_PERSON,
                USE_COMPLETE_ENDPOINT, ALREADY_MEMBER, MEMBER_NOT_IN_PROJECT, MEMBER_NOT_REMOVED,
                NOT_PENDING, CANNOT_CHANGE_OWNER, CANNOT_REMOVE_OWNER, OWNER_CANNOT_LEAVE,
                FORBIDDEN_ROLE, PT_IS_CHILD, SELF_SPLIT, NOT_IN_BILL, BILL_ALREADY_BOOKED, BILL_CHANGED,
                BILL_DISCONNECTED, BILL_GONE, MOVE_TARGET, PAYERS_SUM, PAYER_FIXED, BAD_PAYBACK,
                PAYBACK_NOT_COPYABLE, NO_SHARE_TO_COPY, SETTLE_BOOKED, SETTLE_LINES,
                CLAIM_MIXED_DIRECTION, TX_ALREADY_IN_PROJECT, TX_NOT_BILLABLE, TX_NOT_IN_PROJECT,
                TX_SPLIT_PAID, INVALID_DATE_RANGE, INVALID_RULE, INVALID_TRANSITION, END_TOO_FAR,
                AMOUNT_REQUIRED, ALREADY_RECORDED, NOTHING_OWED, ITEM_ALREADY_LINKED,
                SAVING_NEEDS_WALLET, INSUFFICIENT_SAVING, GOAL_NOT_ACTIVE, GOAL_REACHED,
                GOAL_HAS_SAVINGS, UNSUPPORTED_IMAGE, OCR_UNAVAILABLE, OCR_TIMEOUT, LOGIN_CODE_INVALID,
                TELEGRAM_ALREADY_LINKED, REGISTRATION_CLOSED, CONNECTION_UNAVAILABLE, RATE_LIMITED,
                PERMISSION_UNAVAILABLE, NO_PHOTO, LAST_LOGIN_METHOD, PROVIDER_ERROR
              ]
            message: { type: string, description: 'Safe human-readable English (never raw Go / DB text: that is logged server-side). Never parse it; the app shows its own text for the code.' }
            details:
              description: |
                Depends on the code. VALIDATION_ERROR: always an array of `FieldError` (maybe empty). Others, where noted: SHARED_BILL_FIELD `{fields}`, BILL_CHANGED `{bill}`, EVENT_HAS_EMPTY_PERSON / NOT_IN_BILL / BILL_ALREADY_BOOKED (claim) `{bill_ids}`, ITEM_ALREADY_LINKED `{ids}` or `{transaction, other}`, INSUFFICIENT_SAVING `{available}`, TAG_EXISTS / NOT_FOUND in a tags batch `{op, index}`, CATEGORY_NAME_DUPLICATE `{field}`, UNSUPPORTED_IMAGE `{detected}`. Absent otherwise.
    FieldError:
      type: object
      description: |
        One invalid input of a VALIDATION_ERROR. `field` = the JSON path in the request body (`name`, `splits[0].amount`, `items[2].slot`), or the query / path parameter name (`status`, `id`); "" = the whole body. `code`: required; too_long / too_short (params.max / min characters); too_many / too_few (params.max / min items); out_of_range (params: min, max, gt, gte, lt or lte); invalid (a wrong value or format; params may hold `allowed`, `format` or `len`); invalid_type (params.expected: string / number / integer / boolean / array / object); invalid_json (field ""); too_large (an upload; params.max_bytes).
      required: [field, code, params]
      properties:
        field: { type: string, example: 'splits[0].amount' }
        code: { type: string, enum: [required, too_long, too_short, too_many, too_few, out_of_range, invalid, invalid_type, invalid_json, too_large] }
        params: { type: object, additionalProperties: true, example: { max: 100 } }
    Ids:
      type: array
      items: { $ref: '#/components/schemas/Uuid' }

    # ───────── sync ─────────
    SyncDatasetName:
      type: string
      enum: [accounts, categories, tags, contacts, debt_people, projects, recurring, form_defaults, providers, profile]
      description: '`profile` (0.4.1-2 P4) = GET /users/me: a preference changed on another device reaches the open app.'
    SyncRequest:
      type: object
      properties:
        want:
          type: array
          description: 'Datasets to consider; omitted or empty = every dataset. An unknown or repeated name is 400 VALIDATION_ERROR (the names are in `details`).'
          items: { $ref: '#/components/schemas/SyncDatasetName' }
        have:
          type: object
          description: 'The fingerprints the app holds, by dataset name.'
          additionalProperties: { type: string }
    SyncVersions:
      type: object
      description: 'The current fingerprint of every dataset and page-data key.'
      required: [accounts, categories, tags, contacts, debt_people, projects, recurring, form_defaults, providers, profile, transactions, budgets, saving_goals, pending]
      properties:
        accounts: { type: string }
        categories: { type: string }
        tags: { type: string }
        contacts: { type: string }
        debt_people: { type: string }
        projects: { type: string }
        recurring: { type: string }
        form_defaults: { type: string }
        providers: { type: string }
        profile: { type: string }
        transactions: { type: string }
        budgets: { type: string }
        saving_goals: { type: string }
        pending: { type: string }
    FormDefaults:
      type: object
      description: 'The two defaults of FormOptions on their own: the wallet the form starts on (0.4.1-2 X10: the main wallet `default_account` when it is set and still in the list, else the last used one, else the first) and the preferred fee category (active expense category of the caller, else null).'
      required: [default_account_id, fee_category_id]
      properties:
        default_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        fee_category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    SyncDatasets:
      type: object
      description: |
        Each key is present only when that dataset changed. `body` is the body of the existing endpoint, with every row and every status, unpaged: accounts = GET /accounts?status=all; categories = GET /categories?include_system=true; tags = GET /tags; contacts = GET /contacts?status=all; debt_people = GET /personal-debts/people?all=true with no paging; projects = GET /projects?status=all with no paging; recurring = GET /recurring?status=all with no paging; form_defaults = FormDefaults; providers = GET /payment-providers; profile = GET /users/me (0.4.1-2 P4).
      properties:
        accounts: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/AccountList' } } }
        categories: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/CategoryList' } } }
        tags: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/TagList' } } }
        contacts: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/ContactList' } } }
        debt_people: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/DebtPeopleList' } } }
        projects: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/EventList' } } }
        recurring: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/RecurringList' } } }
        form_defaults: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/FormDefaults' } } }
        providers: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/PaymentProviderList' } } }
        profile: { type: object, required: [v, body], properties: { v: { type: string }, body: { $ref: '#/components/schemas/Profile' } } }
    SyncResponse:
      type: object
      required: [synced_at, versions, data, unchanged, errors]
      properties:
        synced_at: { $ref: '#/components/schemas/DateTime' }
        versions: { $ref: '#/components/schemas/SyncVersions' }
        data: { $ref: '#/components/schemas/SyncDatasets' }
        unchanged:
          type: array
          items: { $ref: '#/components/schemas/SyncDatasetName' }
        errors:
          type: object
          description: 'A dataset that failed or timed out; the rest still answer.'
          additionalProperties:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [INTERNAL_ERROR] }
              message: { type: string }

    # ───────── shared refs (what a row shows about another record) ─────────
    AccountRef:
      type: object
      description: 'A wallet as another row displays it. No balance (it changes; read it from the accounts page).'
      required: [id, name, icon_code, logo_url, type, group, currency, archived]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        logo_url: { type: [string, 'null'] }
        type: { type: string, enum: [cash, bank, e_wallet, credit_card, pay_later] }
        group:
          type: string
          enum: [asset, liability]
          description: 'Computed in the BE (credit_card / pay_later = liability, the rest asset); drives the colour group.'
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        archived: { type: boolean }
      example:
        id: 0191c2a0-0000-7000-8000-000000000001
        name: KBank
        icon_code: { icon: bank, iconColors: ['#FFFFFF'], background: solid, bgColors: ['#138F2D'], border: none, borderColors: [], shape: squircle }
        logo_url: null
        type: bank
        group: asset
        currency: THB
        archived: false
    CategoryRef:
      type: object
      description: 'A category as another row displays it. Sub-categories carry their OWN icon (not the parent''s).'
      required: [id, name, type, icon_code, is_system, system_kind, parent_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        type: { type: string, enum: [expense, income] }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        is_system: { type: boolean, description: 'A reserved category (opening balance, adjustment, transfer, debt paid / received …). '}
        system_kind:
          type: [string, 'null']
          enum: [OPENING_IN, OPENING_OUT, ADJUST_IN, ADJUST_OUT, TRANSFER_IN, TRANSFER_OUT, DEBT_PAID, DEBT_RECEIVED, LOAN_GIVEN, LOAN_TAKEN, null]
          description: 'Null for a normal category. The FE localises system names from this. The four person-book kinds (0.4.1-1 D5): LOAN_GIVEN ให้กู้ยืม (a debt I paid: lend, expense), LOAN_TAKEN กู้ยืม (a debt they paid: borrow, income), DEBT_PAID ชำระหนี้ (a repayment I pay, expense), DEBT_RECEIVED รับชำระหนี้ (a repayment I get, income).'
        parent_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    EventRef:
      type: object
      description: 'An event (project) as another row displays it.'
      required: [id, name, icon_code, status, kind]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        status: { type: string, enum: [active, completed, cancelled, archived] }
        kind: { type: string, enum: [event, split], description: '0.4.1-2 S1: split = the hidden one-bill "event" of a split bill (never shown as an event: no event chip, no event page; the bill opens in the split bill form). `name` is then the bill''s description (or "").' }
    TagRef:
      type: object
      required: [id, name, icon_code]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
    UserRef:
      type: object
      description: 'An app user (a shared-wallet author, a linked partner, a notification actor).'
      required: [user_id, display_name, avatar]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string }
        avatar: { $ref: '#/components/schemas/Avatar' }
      x-breaking: '0.4.2 1b: icon_code → avatar.'
    PersonRef:
      type: object
      description: |
        A person shown on a split, a debt or a draft. `name` follows the single name rule (nickname when set and shown → linked user's profile name → contact display_name → snapshot when there is no contact). The FE draws 👤 when `contact_id` is null.
      required: [name, contact_id, avatar, linked, linked_user_id]
      properties:
        name: { type: string, description: 'Resolved display name. '}
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        avatar: { $ref: '#/components/schemas/Avatar', description: '0.4.2 1b (replaces icon_code): the linked user''s avatar, else the contact''s icon, else initials (a free name).' }
        linked: { type: boolean, description: 'The contact is linked to an app user (draw the 🔗 mark). '}
        linked_user_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
      x-breaking: '0.4.2 1b: icon_code → avatar.'
      example:
        name: Beam
        contact_id: 0191c2a0-0000-7000-8000-0000000000aa
        avatar: { kind: initials, photo_url: null, icon_code: null, initials: B, colors: ['#64B5F6'], border: null }
        linked: true
        linked_user_id: 0191c2a0-0000-7000-8000-0000000000bb
    MemberRef:
      type: object
      description: 'A member of an event.'
      required: [id, user_id, name, avatar, is_me, removed]
      x-breaking: '0.4.2 1b: icon_code → avatar.'
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        name: { type: string }
        avatar: { $ref: '#/components/schemas/Avatar', description: 'The linked user''s avatar, else the member''s own icon, else initials.' }
        is_me: { type: boolean }
        removed: { type: boolean, description: '0.4.1-2 V15: the owner removed this person; on a bill this spot shows as an empty person "( ) ____" to assign (POST /projects/{id}/members/{member_id}/assign).' }
    TransferPeer:
      type: object
      description: 'The other row of a transfer (the twin), so the page never searches for it.'
      required: [id, direction, account]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        direction:
          type: string
          enum: [out, in]
          description: 'Direction of THIS row (out = the money leaves this wallet).'
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'The other row''s wallet; null = the twin has no wallet (its wallet was deleted), so the page shows "ไม่ผูกกระเป๋า" and offers to pick one.' }

    # ───────── transactions ─────────
    Split:
      type: object
      description: 'One person a bill is split with (my book) = a split-sourced debt entry (source kind transaction).'
      required: [debt_id, key, person, person_name, direction, amount, paid]
      properties:
        debt_id: { $ref: '#/components/schemas/Uuid', description: 'The debt entry id (GET /personal-debts/{id}).' }
        key: { $ref: '#/components/schemas/PersonKey', description: 'Link to the person page.' }
        person: { $ref: '#/components/schemas/PersonRef' }
        person_name: { type: string, description: 'Same as person.name (kept so a row can read one key). '}
        direction: { type: string, enum: [paid, received], description: 'The entry direction: an expense split = paid (they owe me), an income split = received (I owe them).' }
        amount: { $ref: '#/components/schemas/Money' }
        paid: { type: boolean, description: 'The entry''s "จ่ายแล้ว" label.' }
    Transaction:
      type: object
      description: |
        A transaction row, page-ready. Same shape in lists, detail and write responses; `splits` is filled on detail and write responses and `null` on list rows.
      required:
        - id
        - user_id
        - type
        - amount
        - currency
        - date
        - description
        - note
        - private_note
        - account
        - category
        - tags
        - project
        - transfer_group_id
        - transfer_peer
        - counterparty
        - event_bill
        - recurring_item
        - source_project_transaction_id
        - my_share
        - split_count
        - splits
        - link_mode
        - paid_by
        - wallet_amount
        - can_split
        - can_edit_splits
        - can_join_event
        - created_by
        - is_locked
        - can_edit_category
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [expense, income, transfer] }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500, description: 'On a copy of a shared bill: the bill''s shared note (synced).' }
        private_note: { type: [string, 'null'], maxLength: 500, description: '0.4.1-2 S11: my private note, only on a copy of a shared bill (never synced, never shown to the others); null elsewhere and on another member''s row.' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'Null = no wallet (floating). '}
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }], description: 'On another member''s row in a shared wallet this is the AUTHOR''s category (read-only; see can_edit_category). '}
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        project: { oneOf: [{ $ref: '#/components/schemas/EventRef' }, { type: 'null' }], description: '0.4.1-2: null on a split bill''s copy (no event chip; event_bill.event.kind = split).' }
        transfer_group_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        transfer_peer: { oneOf: [{ $ref: '#/components/schemas/TransferPeer' }, { type: 'null' }], description: 'Non-null on transfer rows only. '}
        recurring_item: { oneOf: [{ $ref: '#/components/schemas/RecurringItemLink' }, { type: 'null' }], description: 'Set when a recurring item is linked to this row (produced into it / created from it).' }
        event_bill: { oneOf: [{ $ref: '#/components/schemas/EventBillLink' }, { type: 'null' }], description: 'Set when the row is in an event (tx detail "อยู่ในอีเวนต์ … ›" → the bill).' }
        counterparty: { oneOf: [{ $ref: '#/components/schemas/DebtLink' }, { type: 'null' }], description: 'Set when this row is the transaction of a person-book entry (`kind` debt or repayment; 0.4.1-1 D3: repayments are person-book rows too, `repayment_person` is gone). Connected and synced: amount, date, description and note are one value on both sides (editing either writes both). Deleting the transaction keeps the entry, ledger-only (0.4.1-1 D1). Null otherwise (and on another member''s row).' }
        source_project_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        my_share: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Amount minus what others owe on it; expense / income only, null for transfers. What reports and budgets count.' }
        split_count: { type: integer, minimum: 0 }
        splits: { type: [array, 'null'], items: { $ref: '#/components/schemas/Split' }, description: 'Detail and write responses only; null on list rows. '}
        link_mode: { type: string, enum: [personal, split, paid, event], description: 'How the bill is shared (0.4.0-3; the quick-create tab it was saved with): event = an event bill or a copy of one (project / event_bill / source_project_transaction_id); split = it has splits; paid = someone paid (part of) it for me (paid_by); personal = all mine. One mode at a time.' }
        paid_by: { oneOf: [{ $ref: '#/components/schemas/PaidBy' }, { type: 'null' }], description: 'link_mode paid: who paid (part of) this expense for me, or received (part of) this income for me, and the debt it made. Null otherwise (and on another member''s row).' }
        wallet_amount: { $ref: '#/components/schemas/Money', description: 'What the row moved on its wallet: amount − paid_by.amount (= amount without paid_by; 0 when they paid it all, then there is no wallet). amount stays the bill (my consumption: reports, budgets, my_share).' }
        can_split: { type: boolean }
        can_edit_splits: { type: boolean }
        can_join_event: { type: boolean, description: 'False on a paid_by row (one way at a time).' }
        created_by: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'Set on rows of a shared wallet (more than one active member). '}
        is_locked: { type: boolean }
        can_edit_category: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
      example:
        id: 0191c2a0-0000-7000-8000-0000000000f1
        user_id: 0191c2a0-0000-7000-8000-0000000000a1
        type: expense
        amount: 300
        currency: THB
        date: '2026-10-12'
        description: 'Dinner'
        note: null
        account: { id: 0191c2a0-0000-7000-8000-000000000001, name: KBank, icon_code: null, logo_url: null, type: bank, group: asset, currency: THB, archived: false }
        category: { id: 0191c2a0-0000-7000-8000-000000000002, name: Food, type: expense, icon_code: null, is_system: false, system_kind: null, parent_id: null }
        tags: [{ id: 0191c2a0-0000-7000-8000-000000000003, name: friends, icon_code: null }]
        project: null
        transfer_group_id: null
        transfer_peer: null
        counterparty: null
        event_bill: null
        recurring_item: null
        source_project_transaction_id: null
        my_share: 200
        split_count: 1
        splits: [{ debt_id: 0191c2a0-0000-7000-8000-0000000000d1, person: { name: Beam, contact_id: null, avatar: { kind: initials, photo_url: null, icon_code: null, initials: B, colors: ['#64B5F6'], border: null }, linked: false, linked_user_id: null }, person_name: Beam, key: n:beam, direction: paid, amount: 100, paid: false }]
        link_mode: split
        paid_by: null
        wallet_amount: 300
        can_split: true
        can_edit_splits: true
        can_join_event: true
        created_by: null
        is_locked: false
        can_edit_category: true
        created_at: '2026-10-12T09:30:00Z'
        updated_at: '2026-10-12T09:30:00Z'
    PaidBy:
      type: object
      description: |
        Someone paid (part of) my expense (0.4.0-3), or received (part of) my income for me (0.4.1-0, "รับแทน": the debt is "they owe me", a paid entry; my_paid = what reached my wallet). Bill 123, Lee paid 13: amount = 123 (my consumption), paid_by.amount = 13, my_paid = 110 (what left my wallet; 0 = no wallet), and the debt "I owe Lee 13" (a received entry, source paid_by, GET /personal-debts/{debt_id}) is one record with the expense: PUT / DELETE the transaction to change it.
        source is always `me` since 0.4.1-2 S16 (the partner mirror is gone: another user's split on me is a shared bill copy).
      required: [debt_id, key, person, amount, my_paid, source, paid]
      properties:
        debt_id: { $ref: '#/components/schemas/Uuid' }
        key: { $ref: '#/components/schemas/PersonKey', description: 'The person page.' }
        person: { $ref: '#/components/schemas/PersonRef' }
        amount: { $ref: '#/components/schemas/Money', description: 'What they paid.' }
        my_paid: { $ref: '#/components/schemas/Money', description: 'What I paid from the wallet (= wallet_amount).' }
        source: { type: string, enum: [me], description: 'Always me (0.4.1-2 S16: partner is gone).' }
        paid: { type: boolean, description: 'The debt''s "จ่ายแล้ว" label.' }
    PaidByInput:
      type: object
      description: 'Who paid (part of) the bill for me: contact_id (my contact) or a typed person_name, and how much (≤ the bill). Expense or income (on an income: who received it for me, 0.4.1-0); a transfer → 400 PAID_BY_EXPENSE_ONLY. Exclusive with splits and an event (400 LINK_MODE_CONFLICT). amount = the bill → the wallet is dropped (they paid it all). A linked contact gets the usual split_created notice (recipient_direction paid; received on an income).'
      required: [amount]
      properties:
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        person_name: { type: string, maxLength: 100, description: 'Typed name (level 1); with contact_id the contact''s name is used.' }
        amount: { type: number, exclusiveMinimum: 0 }
    WalletBalance:
      type: object
      description: "A wallet's balance right after a write."
      required: [account_id, balance]
      properties:
        account_id: { $ref: '#/components/schemas/Uuid' }
        balance: { $ref: '#/components/schemas/Money' }
    TransactionWriteResult:
      type: object
      description: 'What a transaction write returns: the row(s) in their final state and the post-write balance of every wallet touched. A row that is a person-book entry''s transaction also returns that person''s new balance. `effects` (0.4.1-1 B2) lists everything the write changed, linked sides included.'
      required: [rows, account_balances, person_balance, effects]
      properties:
        rows:
          type: array
          minItems: 0
          maxItems: 2
          items: { $ref: '#/components/schemas/Transaction' }
          description: 'One row (expense / income) or both rows of a transfer (the OUT row first).'
        account_balances:
          type: array
          items: { $ref: '#/components/schemas/WalletBalance' }
        person_balance: { oneOf: [{ $ref: '#/components/schemas/DebtPerson' }, { type: 'null' }], description: 'Non-null when the row is a person-book entry''s transaction (counterparty set) or carries / dropped a paid_by (that person''s new balance).' }
        person_balances: { type: array, items: { $ref: '#/components/schemas/DebtPerson' }, description: '0.4.0-3 B3, PUT only, absent when none: every person the row touched before / after the edit (its splits, its paid-by person), with the new balance. Same list as effects.person_balances.' }
        effects: { $ref: '#/components/schemas/Effects' }
    TransactionPreview:
      type: object
      description: 'PUT /transactions/{id}?preview=true: what the edit would do; nothing saved.'
      required: [preview, rows, people, wallets]
      properties:
        preview: { type: boolean, const: true }
        rows: { type: array, items: { $ref: '#/components/schemas/Transaction' }, description: 'The row as it would be.' }
        people: { type: array, items: { $ref: '#/components/schemas/PersonDelta' } }
        wallets: { type: array, items: { $ref: '#/components/schemas/WalletDelta' } }
    Totals:
      type: object
      description: 'Money over the WHOLE filtered set (every page). Transfers count in neither side; like reports, income / expense leave out categories kept out of reports (include_in_report false: Debt Paid / Debt Received, opening balance, adjustments, …). count still counts those rows.'
      required: [income, expense, net, count]
      properties:
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        count: { type: integer, description: 'income + expense rows (pagination.total also counts transfers). '}
    TransactionDailyPoint:
      type: object
      required: [date, income, expense]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
    TransactionList:
      type: object
      required: [data, pagination, totals, avg_daily_spend, daily]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        pagination: { $ref: '#/components/schemas/Page' }
        avg_daily_spend: { $ref: '#/components/schemas/Money', description: 'Expense (my share) of the list''s date range / the days of that range that have happened (to today). Range = from / to (to omitted with from: that month''s end), else the CURRENT month (user timezone).' }
        totals: { $ref: '#/components/schemas/Totals' }
        daily: { type: array, items: { $ref: '#/components/schemas/TransactionDailyPoint' }, description: 'One point per day of the same range as avg_daily_spend (zero-filled, filters applied, my share; the whole range even past today); empty when the range is over 366 days.' }
    SplitInput:
      type: object
      required: [person_name, owed_amount]
      properties:
        person_name: { type: string, minLength: 1, maxLength: 100, description: 'Typed name; with contact_id the name follows the contact and this is only the stored fallback.' }
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        owed_amount: { type: number, exclusiveMinimum: 0 }
    CreateTransactionRequest:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [expense, income, transfer] }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Null = no wallet (not allowed for transfers). '}
        transfer_to_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        amount: { type: number, exclusiveMinimum: 0 }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        splits: { type: array, items: { $ref: '#/components/schemas/SplitInput' }, description: 'Σ owed_amount ≤ amount; expense / income only.' }
        paid_by: { oneOf: [{ $ref: '#/components/schemas/PaidByInput' }, { type: 'null' }], description: 'Someone paid (part of) it for me (0.4.0-3): amount = the bill; the wallet moves amount − paid_by.amount and the debt "I owe them" (on an income: "they owe me") is made in the same call (the answer''s person_balance).' }
        my_share: { type: [number, 'null'], exclusiveMinimum: 0 }
        source_project_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Event resolve flow only. '}
    UpdateTransactionRequest:
      type: object
      description: 'Partial. A key present with `null` clears category_id / description / note / account_id / transfer_to_account_id. `type` is immutable. On a transfer, account_id is the OUT leg''s wallet and transfer_to_account_id the IN leg''s; each can be re-filed on its own (a wallet-less leg can be given a wallet), but a leg that has a wallet cannot be cleared (400 VALIDATION_ERROR) and the two legs cannot share a wallet (TRANSFER_SAME_ACCOUNT).'
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        date: { $ref: '#/components/schemas/Date' }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        transfer_to_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        private_note: { type: [string, 'null'], maxLength: 500, description: '0.4.1-2 S11: only on a copy of a shared bill (400 PRIVATE_NOTE_NOT_SHARED otherwise); null / "" clears.' }
        also_update_link: { type: boolean, description: 'Also change the event bill made from this row; the app asks at save. A recurring occurrence needs nothing (it reads the row, 0.4.1-1 R1). 0.4.1-2: ignored for a shared bill (409 SHARED_BILL_FIELD with a bill field).' }
        link_mode: { type: string, enum: [personal, split, paid, event], description: '0.4.0-3 B3: switch how the bill is shared (see updateTransaction).' }
        splits: { type: array, items: { $ref: '#/components/schemas/SplitEdit' }, description: 'Replaces the splits (as PUT /transactions/{id}/splits); with link_mode split, or alone on a split / personal row.' }
        event:
          type: object
          description: 'link_mode event: the event and the bill''s people (as EventBillInput payer / members; default I paid, nobody else).'
          required: [project_id]
          properties:
            project_id: { $ref: '#/components/schemas/Uuid' }
            payer: { oneOf: [{ $ref: '#/components/schemas/BillPerson' }, { type: 'null' }] }
            members: { type: array, items: { $ref: '#/components/schemas/BillMember' } }
        apply_to_event: { type: boolean, description: '"แก้ในอีเวนต์ด้วย": the row''s amount / date / description / note (+ an origin''s tags) go to its event bill.' }
        paid_by: { oneOf: [{ $ref: '#/components/schemas/PaidByInput' }, { type: 'null' }], description: 'Absent = unchanged; null = nobody paid for me any more (the debt goes, the wallet takes the whole amount); an object sets / replaces it (another person = the old debt goes, a new one comes). The debt follows the row''s amount part, date and description. A lower amount below paid_by.amount → 400 PAID_BY_EXCEEDS_AMOUNT. Not on a row with splits / in an event (400 LINK_MODE_CONFLICT).' }
    SplitEdit:
      type: object
      required: [owed_amount]
      description: 'An existing split (`debt_id`) is kept / re-amounted; without `debt_id` it adds a person.'
      properties:
        debt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        person_name: { type: string, maxLength: 100, description: 'Free-name rows only; ignored when the split has a contact. '}
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Present with a value = switch / link the contact; present with null = back to a free name; absent = unchanged.' }
        owed_amount: { type: number, exclusiveMinimum: 0 }
    EditSplitsRequest:
      type: object
      required: [splits]
      properties:
        splits: { type: array, items: { $ref: '#/components/schemas/SplitEdit' } }
    SetTagsRequest:
      type: object
      required: [tag_ids]
      properties:
        tag_ids: { $ref: '#/components/schemas/Ids' }
    DeleteTransactionResult:
      type: object
      required: [id, account_balances, debt_entry_id, person_balance, recurring_item_id, bill_id, effects]
      properties:
        effects: { $ref: '#/components/schemas/Effects', description: '0.4.1-1 B2: everything the delete changed (the row itself as transactions[] deleted, the entry that lost it, the slot, the bill, balances).' }
        id: { $ref: '#/components/schemas/Uuid' }
        recurring_item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The recurring occurrence it filled, now skipped with its last values (0.4.1-1 R2); null when it filled none.' }
        bill_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The event bill deleted with it (also_delete_link).' }
        debt_entry_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: '0.4.1-1 D1: the person-book entry (debt or repayment) whose transaction this was. The entry STAYS, ledger-only (it no longer goes with the transaction); the person''s balance does not change. A paid-by debt still goes with its expense (part of the bill), and a split bill''s split debts go with it (D8; linked partners get split_changed removed).' }
        person_balance: { oneOf: [{ $ref: '#/components/schemas/DebtPerson' }, { type: 'null' }], description: 'That person''s balance after the delete (null when the row touched no person).' }
        account_balances:
          type: array
          description: 'The balance of every wallet the delete touched (a transfer touches two).'
          items: { $ref: '#/components/schemas/WalletBalance' }

    # ───────── pending ─────────
    Draft:
      type: object
      description: 'The POST /transactions body plus tag ids and an event; every key optional while it waits.'
      properties:
        type: { type: string, enum: [expense, income, transfer, saving], description: 'saving = a saving draft (kind saving).' }
        goal_id: { $ref: '#/components/schemas/Uuid', description: 'kind saving: the goal (absent = spare).' }
        amount: { type: number, minimum: 0 }
        account_id: { $ref: '#/components/schemas/Uuid' }
        category_id: { $ref: '#/components/schemas/Uuid' }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 500 }
        transfer_to_account_id: { $ref: '#/components/schemas/Uuid' }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        splits: { type: array, items: { type: object, properties: { person_name: { type: string }, contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, owed_amount: { type: number } } }, description: 'May be incomplete or unbalanced; validated at submit. '}
        paid_by: { type: object, properties: { contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, person_name: { type: string }, amount: { type: number } }, description: 'As POST /transactions paid_by (0.4.0-3); validated at submit (INVALID_PAID_BY, PAID_BY_EXCEEDS_AMOUNT, LINK_MODE_CONFLICT with splits / project_id).' }
        project_id: { $ref: '#/components/schemas/Uuid' }
        payer: { $ref: '#/components/schemas/BillPerson', description: 'With project_id (0.4.0-3): as EventBillInput.payer.' }
        members: { type: array, items: { $ref: '#/components/schemas/BillMember' }, description: 'With project_id (0.4.0-3): as EventBillInput.members. Payer / members without project_id, or with splits / paid_by → LINK_MODE_CONFLICT at submit; someone else paid and I have no share → NO_SHARE.' }
    DraftResolved:
      type: object
      description: 'Read-only; the draft''s ids resolved so the page renders without other calls. A dangling id (deleted account / category / event …) is `null` here and listed in `missing`.'
      required: [account, transfer_to_account, category, tags, project, goal, splits, paid_by, link_mode, missing]
      properties:
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        transfer_to_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        project: { oneOf: [{ $ref: '#/components/schemas/EventRef' }, { type: 'null' }] }
        goal: { oneOf: [{ $ref: '#/components/schemas/SavingGoalRef' }, { type: 'null' }] }
        splits:
          type: array
          description: 'One per draft split, same order.'
          items:
            type: object
            required: [person, owed_amount]
            properties:
              person: { $ref: '#/components/schemas/PersonRef' }
              owed_amount: { type: number }
        paid_by:
          oneOf:
            - type: object
              required: [person, amount, my_paid]
              properties:
                person: { $ref: '#/components/schemas/PersonRef' }
                amount: { type: number }
                my_paid: { type: [number, 'null'], description: 'draft amount − paid_by.amount; null while the draft has no amount.' }
            - type: 'null'
        link_mode: { type: string, enum: [personal, split, paid, event], description: 'The quick-create tab the draft was saved with (project_id → event, splits → split, paid_by → paid).' }
        bill_people:
          description: 'An event draft''s payer / members with names (null without them). name is empty for a plain me (show ฉัน).'
          oneOf:
            - type: object
              required: [payer, members]
              properties:
                payer: { $ref: '#/components/schemas/ResolvedBillPerson' }
                members: { type: array, items: { $ref: '#/components/schemas/ResolvedBillPerson' } }
            - type: 'null'
        missing:
          type: array
          items: { type: string, enum: [account_id, transfer_to_account_id, category_id, tag_ids, project_id, contact_id, goal_id] }
    ResolvedBillPerson:
      type: object
      required: [me, member_id, contact_id, name]
      properties:
        me: { type: boolean }
        member_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        contact_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        name: { type: string }
        share: { type: number, description: 'Members only.' }
    SubmitError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 'The draft''s last submit failure (the apierr registry, pending use). MISSING_ACCOUNT, DEBT_ALREADY_SETTLED and OVERPAYMENT are no longer produced but may remain on stored drafts. SUBMIT_FAILED = any other failure (the cause is logged; the message is generic).'
          enum: [
            NOT_FOUND, ACCOUNT_NOT_FOUND, ACCOUNT_ARCHIVED, WALLET_NOT_TRACKED,
            CATEGORY_TYPE_MISMATCH, CATEGORY_NOT_FOUND, TAG_NOT_FOUND, TRANSACTION_NOT_FOUND,
            TRANSFER_SAME_ACCOUNT, TRANSFER_NEEDS_WALLETS, SPLITS_ON_TRANSFER,
            SPLITS_EXCEED_AMOUNT, INVALID_SPLIT, PAID_BY_EXPENSE_ONLY, PAID_BY_EXCEEDS_AMOUNT,
            INVALID_PAID_BY, LINK_MODE_CONFLICT, DEBT_NOT_FOUND, CONTACT_NOT_FOUND,
            PROJECT_NOT_FOUND, PROJECT_NOT_ACTIVE, PROJECT_LOCKED, PROJECT_NOT_MEMBER,
            PROJECT_READ_ONLY, NO_SHARE, TX_NOT_BILLABLE, INVALID_BILL_PEOPLE, GOAL_NOT_ACTIVE,
            MISSING_TYPE, MISSING_AMOUNT, MISSING_DATE, SUBMIT_FAILED, MISSING_ACCOUNT,
            DEBT_ALREADY_SETTLED, OVERPAYMENT
          ]
        message: { type: string }
    PendingTransaction:
      type: object
      required: [id, source, kind, draft, resolved, target_debt_id, target_transaction_id, source_ref, last_error, needs_input, can_confirm, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, description: 'manual now; project_copy, project_update, ocr, chat later.' }
        kind: { type: string, enum: [create, settle_debt, update_tx, saving], description: 'saving = on submit, a saving entry (`draft.amount` from `draft.account_id` into `draft.goal_id`, none = spare); never a transaction. settle_debt = on submit, a REPAYMENT transaction to / from target_debt_id''s person (a paid debt → receive = income; a received debt → pay = expense), on draft.account_id (none = no wallet); the debt itself is not touched (0.4.0-3).' }
        draft: { $ref: '#/components/schemas/Draft' }
        resolved: { $ref: '#/components/schemas/DraftResolved' }
        target_debt_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        target_transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        source_ref: { type: [object, 'null'], description: 'What to show for a non-manual source ("Aom paid ฿300", a scanned slip …). `source` recurring | upcoming (a draft the recurring due check produced): `{item_id, recurring: {id, name, icon_code} | null, seq, total}` → the chip "🔁 Netflix · 3/12" / "ล่วงหน้า". Submitting it links the new transaction to the item; discarding it leaves the item "ยังไม่สร้าง".'}
        last_error: { oneOf: [{ $ref: '#/components/schemas/SubmitError' }, { type: 'null' }] }
        needs_input: { type: array, items: { type: string, enum: [amount, type, date, wallet, wallet_to, category] }, description: 'What the draft still misses; empty = ready. amount / type / date / wallet_to (and a transfer''s wallet) are hard; wallet and category of an expense / income are soft (an uncategorized, wallet-less bill is valid). An amount-less เตือนจ่าย draft is valid: it just needs the amount.' }
        can_confirm: { type: boolean, description: 'false while a hard key is missing: confirm answers it in failed[] (MISSING_AMOUNT …) and the draft stays.' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
      example:
        id: 0191c2a0-0000-7000-8000-0000000000e1
        source: manual
        kind: create
        draft: { type: expense, amount: 120, account_id: 0191c2a0-0000-7000-8000-000000000001, date: '2026-10-12', project_id: 0191c2a0-0000-7000-8000-0000000000c1 }
        resolved: { account: null, transfer_to_account: null, category: null, tags: [], project: { id: 0191c2a0-0000-7000-8000-0000000000c1, name: Chiang Mai trip, icon_code: null, status: active }, splits: [], missing: [] }
        target_debt_id: null
        target_transaction_id: null
        source_ref: null
        last_error: null
        created_at: '2026-10-12T09:30:00Z'
        updated_at: '2026-10-12T09:30:00Z'
    PendingList:
      type: object
      required: [data, count, summary]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PendingTransaction' } }
        count: { type: integer }
        summary: { $ref: '#/components/schemas/PendingSummary' }
    PendingSummary:
      type: object
      description: 'Over ALL the user''s drafts: count; expense_total / income_total = Σ the amounts of the kind-create drafts that have one; needs_input_count = drafts missing something (incl. soft keys), ready_count = the rest (the ones submit-ready confirms); by_source = the source chips (recurring = recurring / upcoming / auto-saving, manual = typed / chat, other_people = from another person, slip = scanned).'
      required: [count, expense_total, income_total, needs_input_count, ready_count, by_source]
      properties:
        count: { type: integer }
        expense_total: { $ref: '#/components/schemas/Money' }
        income_total: { $ref: '#/components/schemas/Money' }
        needs_input_count: { type: integer }
        ready_count: { type: integer }
        by_source:
          type: object
          required: [recurring, manual, other_people, slip, other]
          properties:
            recurring: { type: integer }
            manual: { type: integer }
            other_people: { type: integer }
            slip: { type: integer }
            other: { type: integer }
    CreatePendingRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [draft]
            properties:
              draft: { $ref: '#/components/schemas/Draft' }
    UpdatePendingRequest:
      type: object
      required: [draft]
      properties:
        draft: { $ref: '#/components/schemas/Draft' }
    IdsRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } }
    DiscardResult:
      type: object
      required: [discarded, skipped, remaining_count, summary]
      properties:
        discarded: { $ref: '#/components/schemas/Ids' }
        skipped: { $ref: '#/components/schemas/Ids' }
        remaining_count: { type: integer, description: 'Drafts left after the discard. '}
        summary: { $ref: '#/components/schemas/PendingSummary' }
    SubmitResult:
      type: object
      required: [submitted, failed, account_balances, badges, summary]
      properties:
        account_balances:
          type: array
          description: 'Post-submit balance of every wallet touched by any submitted draft (transfers touch two; one entry per wallet).'
          items: { $ref: '#/components/schemas/WalletBalance' }
        submitted:
          type: array
          items:
            type: object
            required: [id, rows, saving_entry_id]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              rows: { type: array, minItems: 0, maxItems: 2, items: { $ref: '#/components/schemas/Transaction' }, description: 'The created row(s), final state (a transfer returns both rows, OUT first). [] for a saving draft.' }
              saving_entry_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'A saving draft (kind saving): the saving entry it became.' }
        failed:
          type: array
          items:
            type: object
            required: [id, error, pending]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              error: { $ref: '#/components/schemas/SubmitError' }
              pending: { oneOf: [{ $ref: '#/components/schemas/PendingTransaction' }, { type: 'null' }], description: 'The draft with last_error set; null when the draft no longer exists. '}
        badges: { $ref: '#/components/schemas/Badges' }
        summary: { $ref: '#/components/schemas/PendingSummary' }

