      x-used-by:
        - { page: goals-list, calls: 1 }
    post:
      tags: [Saving goals]
      summary: Create a goal
      operationId: createSavingGoal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavingGoalCreateRequest' }
      responses:
        '201':
