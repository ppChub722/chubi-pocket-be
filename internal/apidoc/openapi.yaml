        "description": "multipart/form-data: `image` (PNG / JPEG), `file_key` (the key sent to checkSlips), `trans_ref` and `bank_code` (read from the slip QR on the phone). Nothing is saved: the drafts come back for the user to keep. Lab knobs (`debug`, `psm`, `preprocess`) are dev-only.",
