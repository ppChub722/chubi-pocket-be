      x-used-by:
        - { page: debt-person, calls: 1 }
        - { page: quick-create-sheet, calls: 1 }
    post:
      tags: [Debts]
      summary: Record an entry with a person (the ONE debt write)
      operationId: createDebtEntry
      description: |
        Paid = I paid them (net + amount); received = they paid me (net − amount). With `account_id` the BE also writes the LINKED wallet transaction (paid = expense, received = income, system category Debt Paid / Debt Received, description / note copied) and `tag_ids` go on that transaction; without it the entry is ledger-only and `tag_ids` must be empty (400 TAGS_NEED_WALLET).
        The person: a `c:` key = that contact (400 CONTACT_NOT_FOUND if not the caller's); an `n:` key = a typed name (`person_name` sets the shown spelling, default = the key's text as sent). `mark_paid_ids` labels those entries of the SAME person paid in the same call (400 ENTRY_NOT_FOUND if one is not).
        `date` default = today. Returns 201 with the entry, the person's new balance, the linked transaction (full row) and the touched wallet balances.
        Errors: 400 VALIDATION_ERROR / INVALID_PERSON_KEY / CONTACT_NOT_FOUND / TAGS_NEED_WALLET / TAG_NOT_FOUND / ACCOUNT_NOT_FOUND / ENTRY_NOT_FOUND.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebtEntryCreateRequest' }
      responses:
        '201':
          description: The entry and everything the pages patch from it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntryWriteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: New (replaces POST /personal-debts and POST /personal-debts/{id}/settle).
