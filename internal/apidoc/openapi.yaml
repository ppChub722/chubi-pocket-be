        0.4.1-1 E8, the bill sheet on an existing bill (a parent row; 409 PT_IS_CHILD). `bill` present = the bill is edited (as updateProjectTransaction: `members` = the whole new share list; the split rows are updated IN PLACE, so my copy pointing at my split row keeps its link, B4). `bill` absent = only my book changes (the sheet's "ลงบัญชี" on a bill someone else recorded).
