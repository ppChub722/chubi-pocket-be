      tags: [Saving goals]
      summary: Goals list (+ totals and the spare bucket)
      operationId: listSavingGoals
      description: '`status`: active (default) | completed | archived. `month` (YYYY-MM, default this month) is the month the `month_plan` / `month_saved` / `month_short` of every goal and the summary''s month totals are for; `month_plan` of a goal with active recurring saving settings (type saving, GET /recurring) is Σ amount × their occurrences in that month; without any it is its `needed_monthly` whatever the month.'
