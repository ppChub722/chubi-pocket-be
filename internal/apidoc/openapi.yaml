        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "type removed; tag_ids (my tags) added; returns EventPatch."
      x-used-by:
        - { page: event-detail, calls: 1 }
    delete:
      tags: [Events]
      summary: Delete an event (owner)
      operationId: deleteProject
      description: 'Hard delete (owner only). Other members'' personal transactions stay in their books, unlinked. My own linked transactions (Event.linked_tx_count) stay unlinked too, unless `delete_linked_txs=true` (the dialog "ยืนยันและลบ x รายการ"): then they are deleted (balances come back).'
      parameters:
        - { name: delete_linked_txs, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDeleteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
