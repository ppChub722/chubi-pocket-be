        note: { type: [string, 'null'], maxLength: 500 }
        start_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        end_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        planned_amount: { type: [number, 'null'], exclusiveMinimum: 0 }
        tag_ids: { $ref: '#/components/schemas/Ids', description: 'MY personal tags on the event.' }
    ProjectUpdateRequest:
