        - { name: direction, in: query, schema: { type: string, enum: [paid, received] } }
        - { name: paid, in: query, schema: { type: boolean } }
        - { name: cycle, in: query, description: 'current = entries after the last time the balance with the person hit 0; earlier = the entries before it (older cycles). Omitted = all.', schema: { type: string, enum: [current, earlier] } }
        - { name: money, in: query, schema: { type: boolean } }
