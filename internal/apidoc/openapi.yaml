              schema: { $ref: '#/components/schemas/QuickCreateEventResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '409 TX_ALREADY_IN_PROJECT.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '422 TX_NOT_BILLABLE / TX_SPLIT_PAID.'
          content:
