    UnlinkedName:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer, description: 'Debt rows carrying this typed name. '}
    ContactDetail:
      allOf:
        - { $ref: '#/components/schemas/Contact' }
        - type: object
          required: [unlinked_names]
          properties:
            unlinked_names:
              type: [array, 'null']
              items: { $ref: '#/components/schemas/UnlinkedName' }
              description: 'Present (array) only with ?include=unlinked_names; null otherwise.'
    CreateContactRequest:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        nickname: { type: [string, 'null'], maxLength: 100 }
        show_nickname: { type: boolean, description: 'Default true.' }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 50 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        absorb_names: { type: array, items: { type: string }, description: 'Free-text names to wire to this contact in the same call. '}
    UpdateContactRequest:
      type: object
      description: 'Partial. A key present with `null` clears nickname / description / note.'
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        nickname: { type: [string, 'null'], maxLength: 100 }
        show_nickname: { type: boolean, description: 'Default true.' }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 50 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
