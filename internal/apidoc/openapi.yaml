    BudgetScope:
      type: object
      description: 'What a budget counts (expense side). `all` = every expense; else a row counts when it matches EVERY list that is set: one of the categories (with its sub-categories when `include_children`) AND one of the tag NAMES (my tags on the row, an event bill''s event tags or my tags on its event) AND one of the wallets. Within a list any entry will do.'
      required: [all, categories, tags, wallets]
      properties:
        all: { type: boolean }
        categories:
          type: array
          items:
            type: object
            required: [category, include_children]
            properties:
              category: { $ref: '#/components/schemas/CategoryRef' }
              include_children: { type: boolean }
        tags: { type: array, items: { type: string }, description: 'Tag names.' }
        wallets: { type: array, items: { $ref: '#/components/schemas/AccountRef' } }
    BudgetScopeInput:
      type: object
      properties:
        all: { type: boolean }
        categories:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              include_children: { type: boolean, description: 'Default true.' }
        tags: { type: array, items: { type: string, minLength: 1, maxLength: 50 } }
        wallet_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    BudgetRule:
      type: object
      description: 'A recurring budget''s periods: every `interval` days / weeks / months / years from `start_date` (a month period starts on the start''s day, clamped in short months).'
      required: [freq, interval]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1 }
    BudgetRuleInput:
      type: object
      required: [freq]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1 }
    BudgetForecast:
      type: object
      description: 'The period dashboard ("ภาพรวม"); figures that don''t apply are null. avg_daily = used / elapsed days (today included); forecast_end = avg_daily × days in the period + expected; forecast_over_date = the first day used + expected + avg_daily × (days after today) passes the amount; daily_allowance = (amount − used − expected) / days left (today included), floored, never below 0. An open-ended budget has no end: avg_monthly, forecast_over_date and this_month instead. Past periods: only history fields.'
      required: [elapsed_days, total_days, daily_allowance, avg_daily, avg_monthly, forecast_end, forecast_over_by, forecast_over_date, remaining_after_expected, this_month, history_avg, history_count, available, projected_end, days_left, pace_pct]
      properties:
        elapsed_days: { type: [integer, 'null'] }
        total_days: { type: [integer, 'null'] }
        daily_allowance: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        avg_daily: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        avg_monthly: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        forecast_end: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        forecast_over_by: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        forecast_over_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        remaining_after_expected: { $ref: '#/components/schemas/Money' }
        this_month: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        history_avg: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Average used of up to 6 periods before this one (recurring only).' }
        history_count: { type: integer }
        available: { $ref: '#/components/schemas/Money', description: 'limit − used (this period).' }
        projected_end: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Where the period ends at the current pace (= forecast_end); null when open-ended or not current.' }
        days_left: { type: [integer, 'null'], description: 'Days left in the current period, today included; null otherwise.' }
        pace_pct: { type: [integer, 'null'], description: 'How much of the period has elapsed (elapsed / total days, 0–100) for the pace tick; null otherwise.' }
    BudgetPeriod:
      type: object
      description: 'One period (an instance). `pct` = used / amount (rounded, not clamped); `status` over > warn > pace > ok (pace only for the current period); `tone` danger / warning / neutral. Expected is the current period only.'
      required: [id, seq, start, end, amount, base_amount, overridden, note, is_current, used, expected, remaining, over_by, pct, status, tone, days_left, pace_pct, on_pace_to_exceed]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, description: '1 = the first period.' }
        start: { $ref: '#/components/schemas/Date' }
        end: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'null = open-ended.' }
        amount: { $ref: '#/components/schemas/Money' }
        base_amount: { $ref: '#/components/schemas/Money', description: 'The budget''s amount for this period (0.4.0-4: stored per period, so it stays when the budget''s amount changes later); differs from amount when overridden.' }
        overridden: { type: boolean, description: 'The amount was set for this period only ("✏️ เฉพาะรอบนี้").' }
        note: { type: [string, 'null'], maxLength: 500 }
        is_current: { type: boolean }
        used: { $ref: '#/components/schemas/Money' }
        expected: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money', description: 'amount − used (may be negative).' }
        over_by: { $ref: '#/components/schemas/Money', description: 'used − amount when over, else 0.' }
        pct: { type: integer }
        status: { type: string, enum: [ok, pace, warn, over] }
        tone: { type: string, enum: [neutral, warning, danger] }
        days_left: { type: [integer, 'null'], description: 'Today included; null for past / open-ended periods.' }
        pace_pct: { type: [integer, 'null'], description: 'Elapsed / total days of the current dated period (the pace tick); null for open-ended or non-current periods.' }
        on_pace_to_exceed: { type: boolean, description: 'The forecast says the CURRENT period of an active budget ends over its amount (the "on pace to exceed" row badge). Independent of status: a warn period can be on pace too. False for other periods.' }
    BudgetActions:
      type: object
      required: [edit, close, archive, restore]
      properties:
        edit: { type: boolean }
        close: { type: boolean }
        archive: { type: boolean }
        restore: { type: boolean }
    Budget:
      type: object
      description: 'A budget, page-ready, with the period it is shown at (the list: the current period; ended: the last; not started yet: the first).'
      required: [id, name, description, note, icon_code, amount, warn_pct, scope, recurring, rule, start_date, end, state, closed_on, period, actions, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        amount: { $ref: '#/components/schemas/Money', description: 'The base amount per period.' }
        warn_pct: { type: [integer, 'null'], description: 'null = ไม่เตือน.' }
        scope: { $ref: '#/components/schemas/BudgetScope' }
        recurring: { type: boolean, description: '"งบระยะยาว".' }
        rule: { oneOf: [{ $ref: '#/components/schemas/BudgetRule' }, { type: 'null' }] }
        start_date: { $ref: '#/components/schemas/Date' }
        end: { $ref: '#/components/schemas/RecurrenceEnd', description: 'Recurring: none | date | count (periods). One range: date (fixed) | none (open until ปิดงบ).' }
        state: { type: string, enum: [upcoming, active, ended, archived], description: 'upcoming = starts after today; ended = closed or past its end.' }
        closed_on: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'ปิดงบ date.' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        actions: { $ref: '#/components/schemas/BudgetActions' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    BudgetListSummary:
      type: object
      description: |
        Hero + chip counts + the summary card. Everything is over the ACTIVE budgets (state active or upcoming = `active_count`), each at its CURRENT period.
        over / warn / pace count those periods by their status (one each).
        `total_limit` = the plain sum of the current periods' amounts (an overridden period counts its override). `total_used` counts each transaction / event share ONCE even when budgets overlap (named budgets with overlapping scopes): it sums the distinct counted rows of all those periods, so it can be less than the sum of the budgets' `used`. `total_remaining` = total_limit − total_used (negative when over). `used_pct` = total_used / total_limit, rounded, not clamped (0 when the limit is 0).
        `counts`: all = active_count; over = periods over their amount; near = periods at / above their own warn_pct (status warn); ok = the rest (status ok or pace: on pace to exceed is a badge, see Period.on_pace_to_exceed). ok + near + over = all.
      required: [active_count, over_count, warn_count, pace_count, ended_count, archived_count, total_limit, total_used, total_remaining, used_pct, counts]
      properties:
        active_count: { type: integer }
        over_count: { type: integer }
        warn_count: { type: integer }
        pace_count: { type: integer }
        ended_count: { type: integer }
        archived_count: { type: integer }
        total_limit: { $ref: '#/components/schemas/Money' }
        total_used: { $ref: '#/components/schemas/Money' }
        total_remaining: { type: number, description: 'total_limit − total_used; negative when over.' }
        used_pct: { type: integer }
        counts:
          type: object
          required: [all, ok, near, over]
          properties:
            all: { type: integer }
            ok: { type: integer }
            near: { type: integer }
            over: { type: integer }
    BudgetList:
      type: object
      required: [summary, data]
      properties:
        summary: { $ref: '#/components/schemas/BudgetListSummary' }
        data: { type: array, items: { $ref: '#/components/schemas/Budget' } }
    BudgetSourceRow:
      type: object
      required: [source, counts_as, count, amount]
      properties:
        source: { type: string, enum: [normal, recurring, event, upcoming, pending, future_tx], description: 'normal = my transaction · recurring = my transaction linked to a recurring item (n/N) · event = my share of an event bill · upcoming = a recurring item not made yet · pending = a pending draft · future_tx = a transaction dated after today (counts_as expected, kind transaction; counts as used from its day).' }
        counts_as: { type: string, enum: [used, expected] }
        count: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
    BudgetCategoryRow:
      type: object
      required: [category, amount, pct]
      properties:
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }], description: 'null = no category (e.g. an event bill not made from my transaction).' }
        amount: { $ref: '#/components/schemas/Money' }
        pct: { type: integer, description: 'Share of used.' }
    BudgetItem:
      type: object
      description: 'One thing counted in a period.'
      required: [kind, id, source, counts_as, date, amount, description, category, account, tags, tag_refs, event, recurring, rule_id, slot, reason]
      properties:
        kind: { type: string, enum: [transaction, event_bill, recurring_item, pending], description: 'What `id` points at.' }
        id: { $ref: '#/components/schemas/Uuid', description: 'For a recurring_item read from a computed occurrence with no stored row: an id derived from `rule_id` + `slot` (stable for that occurrence).' }
        source: { type: string, enum: [normal, recurring, event, upcoming, pending, future_tx] }
        counts_as: { type: string, enum: [used, expected] }
        date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        amount: { $ref: '#/components/schemas/Money', description: 'My share.' }
        description: { type: [string, 'null'] }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        tags: { type: array, items: { type: string }, description: 'Tag names.' }
        tag_refs:
          type: array
          description: 'The same tags, same order, with the icon of the user''s own tag of that name (case-insensitive); `icon_code` is null for a name that is not one of the user''s tags (an event or recurring tag).'
          items:
            type: object
            required: [name, icon_code]
            properties:
              name: { type: string }
              icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        event: { oneOf: [{ $ref: '#/components/schemas/EventRef' }, { type: 'null' }] }
        reason: { type: string, enum: [all, category, sub_category, tag, wallet, ''], description: 'Why the row counts in this budget (first match): all = the budget counts all expenses; category = its category is a scope category; sub_category = a sub-category of one; tag = it carries a scope tag; wallet = it is on a scope wallet. Empty only if nothing matches (never for a counted row).' }
        recurring: { oneOf: [{ $ref: '#/components/schemas/BudgetItemRecurring' }, { type: 'null' }] }
        rule_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The recurring setting an expected recurring_item row belongs to; null on every other row.' }
        slot: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'That occurrence''s original date (its `date` is where it sits now, an edit may have moved it); null on every other row.' }
    BudgetItemRecurring:
      type: object
      description: 'A budget item''s link to its recurring setting. Like RecurringItemLink, but `item_id` is null while the occurrence is only computed (no stored row yet).'
      required: [item_id, recurring, seq, total]
      properties:
        item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        recurring: { oneOf: [{ $ref: '#/components/schemas/RecurringRef' }, { type: 'null' }] }
        seq: { type: [integer, 'null'] }
        total: { type: [integer, 'null'] }
