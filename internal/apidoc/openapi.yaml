  # ───────────────────────────── Events (projects, 0.3.1-10) ─────────────────────────────
  # Code name stays `projects` (routes / ids); the UI says อีเวนต์. Single currency (the user's).
  # Every event write returns EventPatch (the final state the pages patch from; no re-fetch).
  /projects:
    get:
      tags: [Events]
      summary: Events list
      operationId: listProjects
      description: |
        The caller's events (any membership except `left`), page-ready rows. `status` default `active`; `all` = every status. `q` = name (case-insensitive substring). `tag_id` (repeatable) = events carrying ANY of those of MY personal tags. `sort`: updated_desc (default) | start_date_desc (no date last) | name_asc.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: status, in: query, description: 'Stored: active (default) | completed | cancelled | archived | all. Derived (never archived): current = every event but archived, unsettled = I still owe or am owed, receivable = someone owes me, payable = I owe someone, ended = completed or cancelled (the same numbers as the list summary counts).', schema: { type: string, enum: [active, completed, cancelled, archived, all, current, unsettled, receivable, payable, ended] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: tag_id, in: query, schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: true }
        - { name: sort, in: query, schema: { type: string, enum: [updated_desc, start_date_desc, name_asc] } }
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: "Rows are Event (type / currency dropped; my tags, totals, my_net, flags added); q / tag_id / sort; status=all."
      x-used-by:
        - { page: event-list, calls: 1 }
        - { page: quick-create-sheet, calls: 1 }
    post:
      tags: [Events]
      summary: Create an event (one call)
      operationId: createProject
      description: |
        Everything in ONE call: name, icon, description / note, optional start / end dates (end ≥ start, else 400 INVALID_DATE_RANGE), optional planned_amount, my personal `tag_ids` (400 TAG_NOT_FOUND if one isn't mine). The caller becomes the owner. Returns the page-ready detail so the app navigates without another call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201':
          description: The new event, page-ready.
