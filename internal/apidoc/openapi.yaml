        phone: { type: [string, 'null'], maxLength: 50 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
    CreateContactResult:
      type: object
      required: [contact, absorbed_count]
      properties:
        contact: { $ref: '#/components/schemas/Contact' }
        absorbed_count: { type: integer }

    # ───────── dashboard ─────────
    Dashboard:
      type: object
      description: 'Month-scoped blocks follow `?month=`; the rest is a "right now" snapshot. Blocks not listed in detail here are unchanged from today.'
      required: [month, from, to, today, currency, net_worth, summary, previous, top_categories, other_expense, trend, upcoming, budgets, debts, saving_goals, recent, pending, attention, badges]
      properties:
        month: { type: string, example: 2026-10 }
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }
        today: { $ref: '#/components/schemas/Date' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        net_worth: { type: object, description: 'Unchanged: {total, assets, liabilities, accounts_count}.' }
        summary: { type: object, description: 'Unchanged: {income, expense, net, transaction_count}.' }
        previous: { type: object, description: 'Unchanged (the month before). '}
        top_categories:
          type: array
          items:
            type: object
            required: [category, expense, count]
            properties:
              category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }], description: 'Null = uncategorized. '}
              expense: { $ref: '#/components/schemas/Money' }
              count: { type: integer }
        other_expense: { $ref: '#/components/schemas/Money' }
        trend: { type: array, items: { type: object }, description: 'Unchanged: [{month, income, expense}].' }
        upcoming: { type: object, description: 'Unchanged shape {days, items, total_expense, total_income}; items are upcoming recurring items dated within 14 days (kind recurring, id = the item) and card due dates (kind card_due).' }
        budgets: { type: object, description: 'Unchanged tile. '}
        debts: { $ref: '#/components/schemas/DebtTotals' }
        saving_goals: { $ref: '#/components/schemas/SavingTotals' }
        recent: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        pending: { $ref: '#/components/schemas/DashboardPending' }
        attention: { $ref: '#/components/schemas/DashboardAttention' }
        badges: { $ref: '#/components/schemas/Badges' }

    # ───────── touch-point shapes (only the changed keys are spelled out) ─────────
    SavingGoalRef:
      type: object
      required: [id, name, icon_code]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
    SavingTotals:
      type: object
      description: 'The Home / More savings numbers: active goals; saved = in_goals + spare; available = Σ (balance − saved) over the wallets that track their balance.'
      required: [count, saved, in_goals, spare, available]
      properties:
        count: { type: integer }
        saved: { $ref: '#/components/schemas/Money' }
        in_goals: { $ref: '#/components/schemas/Money' }
        spare: { $ref: '#/components/schemas/Money' }
        available: { $ref: '#/components/schemas/Money' }
    SavingGoal:
      type: object
      description: |
        A goal, page-ready. state: active | completed (closed with ปิดเป้าหมาย) | archived. Figures (user timezone, today included):
        - progress_pct = saved / target × 100 (rounded, not capped); remaining_amount = max(0, target − saved).
        - needed_monthly = remaining / months left (days to the deadline / 30.44, at least 1), rounded up to the baht; null without a deadline, past it, or when reached.
        - pace_monthly = the net saved into the goal over the last 3 months, this month included (fewer when the goal is younger), per month; null when nothing was saved.
        - eta_date = today + ⌈remaining / pace_monthly⌉ months; null when reached or no pace.
        - pace: reached (saved ≥ target) · on_track (eta ≤ deadline) · late (eta after the deadline, or no pace with a deadline; late_months = whole months past it, null without an eta) · none (no deadline, or not active).
      required: [id, name, description, note, icon_code, target_amount, deadline, state, saved_amount, progress_pct, remaining_amount, days_remaining, needed_monthly, pace_monthly, eta_date, pace, late_months, milestones, currency, closed_at, actions, month_plan, month_saved, month_short, status, behind_months, auto_save, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        target_amount: { $ref: '#/components/schemas/Money' }
        deadline: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        state: { type: string, enum: [active, completed, archived] }
        saved_amount: { $ref: '#/components/schemas/Money' }
        progress_pct: { type: integer }
        remaining_amount: { $ref: '#/components/schemas/Money' }
        days_remaining: { type: [integer, 'null'] }
        needed_monthly: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        pace_monthly: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        eta_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        pace: { type: string, enum: [reached, on_track, late, none] }
        late_months: { type: [integer, 'null'] }
        milestones:
          type: array
          items:
            type: object
            required: [pct, amount, reached]
            properties:
              pct: { type: integer }
              amount: { $ref: '#/components/schemas/Money' }
              reached: { type: boolean }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        closed_at: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        actions:
          type: object
          required: [save, withdraw, move, close, archive, restore, delete]
          properties:
            save: { type: boolean }
            withdraw: { type: boolean }
            move: { type: boolean }
            close: { type: boolean }
            archive: { type: boolean }
            restore: { type: boolean }
            delete: { type: boolean }
        month_plan: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'What the goal should get THIS month: its auto-saving amount, else needed_monthly; null for a closed goal or when there is neither.' }
        month_saved: { $ref: '#/components/schemas/Money', description: 'Net saved into the goal so far this month (user timezone).' }
        month_short: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'max(0, month_plan − month_saved); null with no plan.' }
        status: { type: string, enum: [reached, on_track, behind, none], description: 'reached = saved ≥ target; on_track = the pace gets there by the deadline; behind = it does not (behind_months); none = no deadline / closed.' }
        behind_months: { type: [integer, 'null'], description: 'With status behind: how many months late.' }
        auto_save: { oneOf: [{ $ref: '#/components/schemas/SavingAutoSave' }, { type: 'null' }], description: 'The goal''s auto-saving (null = none).' }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    AccountDeletePreview:
      type: object
      description: 'What deleting a wallet does; shown before the confirm.'
      required: [transactions, transfers, system_rows_deleted, recurring, saving_entries]
      properties:
        transactions: { type: integer, description: 'Rows that stay in the books with no wallet (every author; transfer legs counted apart).' }
        transfers: { type: integer, description: 'Transfer legs on this wallet; the other leg and its wallet are untouched.' }
        system_rows_deleted: { type: integer, description: 'Opening-balance / adjustment rows: deleted with the wallet.' }
        recurring: { type: integer, description: 'Recurring settings that lose the wallet (they keep running, wallet-less).' }
        saving_entries:
          type: object
          description: 'Goal money moved through this wallet: kept, unlinked from any wallet.'
          required: [count, amount]
          properties:
            count: { type: integer }
            amount: { $ref: '#/components/schemas/Money' }
    AccountDeleteResult:
      type: object
      required: [id, deleted]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deleted: { $ref: '#/components/schemas/AccountDeletePreview' }
    SavingWalletShare:
      type: object
      required: [wallet, amount, share_pct]
      properties:
        wallet: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'null = money with no wallet (counts for the goal, never for a wallet).' }
        amount: { $ref: '#/components/schemas/Money' }
        share_pct: { type: integer }
    SavingSpare:
      type: object
      description: 'The spare bucket ("ยังไม่จัดสรร"): saved money with no goal yet.'
      required: [amount, by_wallet]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        by_wallet: { type: array, items: { $ref: '#/components/schemas/SavingWalletShare' } }
    SavingBucketRef:
      type: object
      required: [type, id, name, icon_code]
      properties:
        type: { type: string, enum: [wallet, spare, goal] }
        id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The wallet / goal id; null for spare and for a deleted goal.' }
        name: { type: [string, 'null'], description: 'null for spare (the app''s label) and for a deleted goal.' }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
    SavingEntry:
      type: object
      description: 'One saving entry = ONE wallet (or none) · from → to · amount. A multi-wallet action = several entries with one group_id.'
      required: [id, group_id, kind, date, note, wallet, amount, from, to, source, goal_ids, recurring, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        group_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [save, withdraw, move] }
        date: { $ref: '#/components/schemas/Date' }
        note: { type: [string, 'null'], maxLength: 500 }
        wallet: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'null = no wallet (unallocated: kept after its wallet was deleted, or saved with no default wallet).' }
        amount: { $ref: '#/components/schemas/Money' }
        from: { $ref: '#/components/schemas/SavingBucketRef' }
        to: { $ref: '#/components/schemas/SavingBucketRef' }
        source: { type: string, enum: [manual, recurring, pending], description: 'recurring = made from a recurring ออม draft ("ออมประจำ"); pending = from another pending draft.' }
        goal_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        recurring: { oneOf: [{ $ref: '#/components/schemas/RecurringItemLink' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/DateTime' }
    SavingEntryList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SavingEntry' } }
        pagination: { $ref: '#/components/schemas/Page' }
    SavingHistoryPoint:
      type: object
      required: [month, cumulative]
      properties:
        month: { type: string, description: 'YYYY-MM.' }
        cumulative: { $ref: '#/components/schemas/Money', description: 'The balance at the end of that month (this month: today).' }
    SavingAutoSave:
      type: object
      description: 'Auto-saving of a goal (or of unallocated money): on `day` of each month a pending saving draft (🐷) of `amount` is made (from `wallet`, or no wallet); the user confirms it.'
      required: [amount, day, wallet, next_date]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        day: { type: integer, minimum: 1, maximum: 31, description: 'Day of the month; 31 = the last day of a short month.' }
        wallet: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'Source wallet; null = none.' }
        next_date: { $ref: '#/components/schemas/Date', description: 'When the next draft is made (this month''s day if its draft is still to come, else next month''s).' }
    SavingAutoSaveRequest:
      type: object
      required: [amount, day]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        day: { type: integer, minimum: 1, maximum: 31 }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'Source wallet (active, tracks its balance) or none.' }
    SavingGoalList:
      type: object
      required: [summary, spare, data]
      properties:
        summary:
          type: object
          description: 'saved = in_goals + spare (active goals and spare; the same numbers as Home / More).'
          required: [saved, in_goals, spare, currency, saved_total, month_short_total, unallocated]
          properties:
            saved: { $ref: '#/components/schemas/Money' }
            in_goals: { $ref: '#/components/schemas/Money' }
            spare: { $ref: '#/components/schemas/Money' }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            saved_total: { $ref: '#/components/schemas/Money', description: 'Every saving: goals + unallocated, wallet-less money included (= saved).' }
            month_short_total: { $ref: '#/components/schemas/Money', description: 'Σ the active goals'' month_short.' }
            unallocated: { $ref: '#/components/schemas/Money', description: 'The spare bucket (saved money with no goal).' }
        spare: { $ref: '#/components/schemas/SavingSpare' }
        data: { type: array, items: { $ref: '#/components/schemas/SavingGoal' } }
    SavingGoalDetail:
      type: object
      description: 'The goal page in one call.'
      required: [goal, by_wallet, history, entries]
      properties:
        goal: { $ref: '#/components/schemas/SavingGoal' }
        by_wallet: { type: array, items: { $ref: '#/components/schemas/SavingWalletShare' } }
        history: { type: array, items: { $ref: '#/components/schemas/SavingHistoryPoint' }, description: 'Month by month from the first entry (or creation) to this month.' }
        entries: { $ref: '#/components/schemas/SavingEntryList' }
    SavingSpareDetail:
      type: object
      required: [spare, history, auto_save, entries]
      properties:
        spare: { $ref: '#/components/schemas/SavingSpare' }
        history: { type: array, items: { $ref: '#/components/schemas/SavingHistoryPoint' } }
        auto_save: { oneOf: [{ $ref: '#/components/schemas/SavingAutoSave' }, { type: 'null' }], description: 'The auto-saving of unallocated money (null = none).' }
        entries: { $ref: '#/components/schemas/SavingEntryList' }
    WalletSavings:
      type: object
      description: 'A wallet''s savings (the caller''s): saved = spare + Σ goals in it; available = balance − saved (null when the wallet doesn''t track its balance); saved_exceeds_balance = saved > balance (a red warning, nothing is blocked; over_by = how much).'
      required: [balance, saved, spare, available, saved_exceeds_balance, over_by, buckets]
      properties:
        balance: { $ref: '#/components/schemas/Money' }
        saved: { $ref: '#/components/schemas/Money' }
        spare: { $ref: '#/components/schemas/Money' }
        available: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        saved_exceeds_balance: { type: boolean }
        over_by: { $ref: '#/components/schemas/Money' }
        buckets:
          type: array
          description: 'Goals then spare, non-zero only.'
          items:
            type: object
            required: [type, id, name, icon_code, amount]
            properties:
              type: { type: string, enum: [goal, spare] }
              id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
              name: { type: [string, 'null'] }
              icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
              amount: { $ref: '#/components/schemas/Money' }
    SavingWriteResult:
      type: object
      description: 'Every saving write answers the final state: the entries it wrote, every goal it touched, the spare bucket and each touched wallet''s savings — plus the page the action was made from, so one button = one call: `goal_page` = the request''s goal (save: the target; withdraw / move: the source; close: the goal; an entry edit / delete: its goal), else `spare_page` when that bucket is spare.'
      required: [entries, goals, spare, wallets, goal_page, spare_page]
      properties:
        goal_page: { oneOf: [{ $ref: '#/components/schemas/SavingGoalDetail' }, { type: 'null' }] }
        spare_page: { oneOf: [{ $ref: '#/components/schemas/SavingSpareDetail' }, { type: 'null' }] }
        entries: { type: array, items: { $ref: '#/components/schemas/SavingEntry' } }
        goals: { type: array, items: { $ref: '#/components/schemas/SavingGoal' } }
        spare: { $ref: '#/components/schemas/SavingSpare' }
        wallets:
          type: array
          items:
            type: object
            required: [wallet, savings]
            properties:
              wallet: { $ref: '#/components/schemas/AccountRef' }
              savings: { $ref: '#/components/schemas/WalletSavings' }
    SavingEntryRequest:
      type: object
      required: [kind, amount]
      properties:
        kind: { type: string, enum: [save, withdraw, move] }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { $ref: '#/components/schemas/Date', description: 'Default today.' }
        note: { type: [string, 'null'], maxLength: 500 }
        goal_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'save: the target; withdraw / move: the source. null = spare.' }
        wallet_id: { $ref: '#/components/schemas/Uuid', description: 'save only, OPTIONAL. Omitted = the money goes in NO wallet (outside any wallet: it counts for the goal, never for a wallet). The default wallet is NOT used.' }
        to_goal_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'move only: the target (null = spare).' }
        splits:
          type: array
          description: 'withdraw / move: the amount per wallet (must add up to amount). Omitted = largest-first.'
          items:
            type: object
            required: [wallet_id, amount]
            properties:
              wallet_id: { $ref: '#/components/schemas/Uuid' }
              amount: { type: number, exclusiveMinimum: 0 }
    SavingEntryUpdateRequest:
