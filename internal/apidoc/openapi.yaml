        `my_books` = what my book should hold of it now: a part that is linked and no longer wanted is UNLINKED (its rows stay in my book, remembered); a part wanted and not linked takes its remembered rows back, else is made as on bookEventBill. I paid a bill someone else recorded → my new transaction becomes the bill's origin (the whole bill, E6), not a copy. `members[].paid_back` is the tick as it should be now (BoardSplit.paid_back shows it): newly ticked → a payback row made for this bill (+ my repayment, as on create); un-ticked → the payback row made for it is removed with my repayment of it (and its wallet transaction), in the same DB transaction (effects: removed_bill_ids, removed_debt_ids, removed_transaction_ids); a ticked member whose share changed gets the row made again at the new share.
