          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "image": {
                    "type": "string",
                    "format": "binary"
                  },
                  "file_key": {
                    "type": "string"
                  },
                  "trans_ref": {
                    "type": "string"
                  },
                  "bank_code": {
                    "type": "string"
                  }
                },
                "required": [
