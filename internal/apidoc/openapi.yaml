      type: object
      description: |
        Google-Calendar-style. `daily` / `weekly` / `monthly` / `yearly` every `interval` units from the start date; weekly on `weekdays` (ISO 1 = Monday … 7 = Sunday; default the start's weekday); monthly by `monthly.mode` day (`day` 1–31, a short month clamps to its last day) or weekday (the `nth` 1–5 or -1 = last `weekday`); yearly on the start's month / day; `dates` = hand-picked dates.
      required: [freq, interval, weekdays, monthly, dates]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly, yearly, dates] }
        interval: { type: integer, minimum: 1 }
        weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        monthly:
          oneOf:
            - type: object
              required: [mode, day, nth, weekday]
              properties:
                mode: { type: string, enum: [day, weekday] }
                day: { type: [integer, 'null'], minimum: 1, maximum: 31 }
                nth: { type: [integer, 'null'], description: '1–5, or -1 = the last.' }
                weekday: { type: [integer, 'null'], minimum: 1, maximum: 7 }
            - { type: 'null' }
        dates: { type: array, items: { $ref: '#/components/schemas/Date' } }
    RecurrenceEnd:
      type: object
      required: [kind, date, count]
      properties:
        kind: { type: string, enum: [none, date, count] }
        date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        count: { type: [integer, 'null'], minimum: 1 }
    RecurrenceRuleInput:
      type: object
      description: 'RecurrenceRule as a request: only `freq` is required (interval defaults to 1, weekly days to the start''s weekday, monthly to the start''s day).'
      required: [freq]
      properties:
        freq: { type: string, enum: [daily, weekly, monthly, yearly, dates] }
        interval: { type: integer, minimum: 1 }
        weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        monthly:
          oneOf:
            - type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [day, weekday] }
                day: { type: [integer, 'null'], minimum: 1, maximum: 31 }
                nth: { type: [integer, 'null'] }
                weekday: { type: [integer, 'null'], minimum: 1, maximum: 7 }
            - { type: 'null' }
        dates: { type: array, items: { $ref: '#/components/schemas/Date' } }
    RecurrenceEndInput:
      type: object
      description: 'RecurrenceEnd as a request: `kind` + its value (`date` for date, `count` for count).'
      required: [kind]
      properties:
        kind: { type: string, enum: [none, date, count] }
        date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }] }
        count: { type: [integer, 'null'], minimum: 1 }
    RecurringRef:
      type: object
      required: [id, name, icon_code]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
    Recurring:
      type: object
      description: 'A recurring setting (the generator), page-ready.'
      required: [id, name, description, note, icon_code, type, amount, account, to_account, category, goal, tags, rule, start_date, end, status, next_date, days_until, progress, ending_soon, counts, edited_any, actions, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
        type: { type: string, enum: [expense, income, transfer, saving], description: 'saving = ออม: each item becomes a pending saving draft (🐷) that saves `amount` from the wallet into `goal` (null = spare).' }
        amount: { $ref: '#/components/schemas/Money' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        to_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }], description: 'Transfers only.' }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        goal: { oneOf: [{ $ref: '#/components/schemas/SavingGoalRef', description: 'saving only: the target goal (null = spare).' }, { type: 'null' }] }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        rule: { $ref: '#/components/schemas/RecurrenceRule' }
        start_date: { $ref: '#/components/schemas/Date' }
        end: { $ref: '#/components/schemas/RecurrenceEnd' }
        status: { type: string, enum: [active, paused, archived] }
        next_date: { oneOf: [{ $ref: '#/components/schemas/Date' }, { type: 'null' }], description: 'The next upcoming item (null when none).' }
        days_until: { type: [integer, 'null'] }
        progress:
          type: object
          required: [done, total]
          properties:
            done: { type: integer, description: 'Items produced so far (n).' }
            total: { type: [integer, 'null'], description: 'N; null = no end.' }
        ending_soon: { type: boolean, description: 'Active and 2 or fewer upcoming items left (also at the horizon of a no-end setting): show "ต่ออีก".' }
        counts:
          type: object
          required: [upcoming, not_created, pending, done, archived]
          properties:
            upcoming: { type: integer }
            not_created: { type: integer }
            pending: { type: integer }
            done: { type: integer }
            archived: { type: integer }
        edited_any: { type: boolean, description: 'An item was edited on its own: show the item list, not the one-line summary.' }
        actions:
          type: object
          required: [pause, resume, archive, restore, extend]
          properties:
            pause: { type: boolean }
            resume: { type: boolean }
            archive: { type: boolean }
            restore: { type: boolean }
            extend: { type: boolean }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    RecurringList:
      type: object
      required: [data, counts, summary, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Recurring' } }
        counts:
          type: object
          required: [current, archived, all]
          properties:
            current: { type: integer }
            archived: { type: integer }
            all: { type: integer }
        summary:
          type: object
          description: 'The list''s summary card; the same whatever the status / q / page of the list. month_pay / month_receive = the PER-MONTH EQUIVALENT of the ACTIVE settings (paused, archived and ended ones excluded, so are settings on an archived wallet; transfers and savings are not money in / out): daily = amount × 30.4375 / interval; weekly = amount × weekdays × 4.3481 / interval (no weekdays = 1); monthly = amount / interval; yearly = amount / (12 × interval); custom dates = amount × the dates that fall in the CURRENT month. 2 decimals. next = the nearest upcoming occurrence (today or later) of an active setting of ANY type, null when none; ties by name.'
          required: [month_pay, month_receive, next]
          properties:
            month_pay: { $ref: '#/components/schemas/Money' }
            month_receive: { $ref: '#/components/schemas/Money' }
            next:
              oneOf:
                - type: object
                  required: [id, name, date, amount, type]
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    date: { $ref: '#/components/schemas/Date' }
                    amount: { $ref: '#/components/schemas/Money' }
                    type: { type: string, enum: [expense, income, transfer, saving] }
                - { type: 'null' }
        pagination: { $ref: '#/components/schemas/Page' }
    RecurringItemLink:
      type: object
      description: 'On a transaction produced from (or linked to) a recurring item.'
      required: [item_id, recurring, seq, total]
      properties:
        item_id: { $ref: '#/components/schemas/Uuid' }
        recurring: { oneOf: [{ $ref: '#/components/schemas/RecurringRef' }, { type: 'null' }], description: 'null = a one-off / manual item.' }
        seq: { type: [integer, 'null'] }
        total: { type: [integer, 'null'] }
    LinkedTx:
      type: object
      description: 'A real transaction a module record is linked to (an event bill made from it, a recurring item produced into it). Same mechanism everywhere: the link lives on the module record; a deleted transaction just breaks the link.'
      required: [id, description, account]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        description: { type: [string, 'null'] }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
    RecurringItem:
      type: object
      description: 'One produced / upcoming / manual item. status comes from the link: pending_id set → pending; transaction set → done; neither → upcoming (dated after today, never produced) or not_created; archived = the user flag.'
      required: [id, recurring, seq, total, date, days_until, status, edited, manual, type, amount, account, to_account, category, goal, tags, description, note, splits, project, pending_id, transaction, saving_entry_id, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        recurring: { oneOf: [{ $ref: '#/components/schemas/RecurringRef' }, { type: 'null' }], description: 'null = one-off (a future-dated transaction) or a manual item.' }
        seq: { type: [integer, 'null'] }
        total: { type: [integer, 'null'] }
        date: { $ref: '#/components/schemas/Date' }
        days_until: { type: integer, description: 'Negative = in the past.' }
        status: { type: string, enum: [upcoming, not_created, pending, done, archived] }
        edited: { type: boolean }
        manual: { type: boolean }
        type: { type: string, enum: [expense, income, transfer, saving] }
        amount: { $ref: '#/components/schemas/Money' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        to_account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        goal: { oneOf: [{ $ref: '#/components/schemas/SavingGoalRef' }, { type: 'null' }] }
        saving_entry_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'A saving item that was made: the saving entry (status done).' }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        description: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        splits:
          type: array
          description: 'One-off items only (a future-dated bill with splits).'
          items:
            type: object
            required: [person, owed_amount]
            properties:
              person: { $ref: '#/components/schemas/PersonRef' }
              owed_amount: { type: number }
        project: { oneOf: [{ $ref: '#/components/schemas/EventRef' }, { type: 'null' }] }
        pending_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        transaction: { oneOf: [{ $ref: '#/components/schemas/LinkedTx' }, { type: 'null' }] }
        created_at: { $ref: '#/components/schemas/DateTime' }
        updated_at: { $ref: '#/components/schemas/DateTime' }
    RecurringItemList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RecurringItem' } }
        pagination: { $ref: '#/components/schemas/Page' }
    RecurringDetail:
      type: object
      required: [recurring, items, account_balances]
      properties:
        recurring: { $ref: '#/components/schemas/Recurring' }
        items: { $ref: '#/components/schemas/RecurringItemList', description: 'The produced items (status ≠ upcoming), newest first.' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringFields:
      type: object
      description: 'Value fields; partial (absent = unchanged, null clears a nullable one).'
      properties:
        type: { type: string, enum: [expense, income, transfer, saving] }
        amount: { type: number, exclusiveMinimum: 0 }
        account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        to_account_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
        tag_ids: { $ref: '#/components/schemas/Ids' }
        goal_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'type saving: the goal (null = spare); wallet = account_id.' }
    RecurringCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          required: [name, type, amount, rule, start_date]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
            rule: { $ref: '#/components/schemas/RecurrenceRuleInput' }
            start_date: { $ref: '#/components/schemas/Date' }
            end: { $ref: '#/components/schemas/RecurrenceEndInput' }
    RecurringUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            icon_code: { oneOf: [{ $ref: '#/components/schemas/IconCode' }, { type: 'null' }] }
            rule: { $ref: '#/components/schemas/RecurrenceRuleInput' }
            start_date: { $ref: '#/components/schemas/Date' }
            end: { $ref: '#/components/schemas/RecurrenceEndInput' }
            scope: { type: string, enum: [upcoming, all], default: upcoming }
            also_update_link: { type: boolean, description: 'With scope all: the produced items'' drafts / transactions change too.' }
    RecurringExtendRequest:
      type: object
      properties:
        end: { oneOf: [{ $ref: '#/components/schemas/RecurrenceEndInput' }, { type: 'null' }] }
    RecurringDeleteResult:
      type: object
      required: [id, deleted_transaction_count, account_balances]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deleted_transaction_count: { type: integer }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringItemCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          required: [date, type, amount]
          properties:
            recurring_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            date: { $ref: '#/components/schemas/Date' }
    RecurringItemUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/RecurringFields' }
        - type: object
          properties:
            date: { $ref: '#/components/schemas/Date' }
            scope: { type: string, enum: [this, following, past, upcoming, all], default: this }
            also_update_link: { type: boolean }
    RecurringItemCreateNowRequest:
      type: object
      required: [target]
      properties:
        target: { type: string, enum: [pending, transaction] }
        fields:
          allOf:
            - { $ref: '#/components/schemas/RecurringFields' }
            - type: object
              properties:
                date: { $ref: '#/components/schemas/Date' }
    RecurringItemWriteResult:
      type: object
      required: [item, transaction, account_balances]
      properties:
        item: { $ref: '#/components/schemas/RecurringItem' }
        transaction: { oneOf: [{ $ref: '#/components/schemas/Transaction' }, { type: 'null' }], description: 'The real transaction the write made (create with target transaction).' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringItemsWriteResult:
      type: object
      required: [items, account_balances]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecurringItem' } }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringItemDeleteResult:
      type: object
      required: [id, transaction_id, account_balances]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        transaction_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }], description: 'The linked transaction deleted with it.' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    RecurringItemBatchRequest:
      type: object
      required: [ids, action]
      properties:
        ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } }
        action: { type: string, enum: [edit, create, archive, restore, delete] }
        target: { type: string, enum: [pending, transaction] }
        fields: { $ref: '#/components/schemas/RecurringFields' }
        also_update_link: { type: boolean }
        delete_linked_tx: { type: boolean }
    RecurringItemBatchResult:
      type: object
      required: [items, deleted_ids, account_balances]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecurringItem' } }
        deleted_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
    EventDeleteResult:
      type: object
      required: [id, deleted_transaction_count, account_balances]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        deleted_transaction_count: { type: integer, description: 'My linked personal transactions deleted with it (delete_linked_txs=true).' }
        account_balances: { type: array, items: { $ref: '#/components/schemas/WalletBalance' } }
