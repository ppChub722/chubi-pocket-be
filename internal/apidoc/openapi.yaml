        data: { type: array, items: { $ref: '#/components/schemas/BudgetPeriod' } }
        pagination: { $ref: '#/components/schemas/Page' }
    BudgetDetail:
      type: object
      description: 'The budget page in one call, at one period (`budget.period`).'
      required: [budget, forecast, by_source, by_category, periods, items]
      properties:
        budget: { $ref: '#/components/schemas/Budget' }
        forecast: { $ref: '#/components/schemas/BudgetForecast' }
        by_source: { type: array, items: { $ref: '#/components/schemas/BudgetSourceRow' }, description: 'Non-zero sources only.' }
        by_category: { type: array, items: { $ref: '#/components/schemas/BudgetCategoryRow' }, description: 'Used only, largest first.' }
        periods:
          type: object
          description: 'The 6 newest periods (recurring); has_more → listBudgetPeriods.'
          required: [data, has_more]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/BudgetPeriod' } }
            has_more: { type: boolean }
        items: { $ref: '#/components/schemas/BudgetItemList' }
    BudgetCreateRequest:
      type: object
      required: [name, amount, scope, start_date]
