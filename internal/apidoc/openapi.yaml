  /accounts/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Accounts]
      summary: Archive a wallet
      operationId: archiveAccount
      description: 'Owner only; 409 ACCOUNT_HAS_MEMBERS while other members are active. An archived wallet is hidden from the default list (`?status=archived` / `all` show it), ignored by EVERY calculation (wallet totals, summaries, budgets, dashboard; its rows are hidden from `GET /transactions` unless `include_archived=true` or `account_id` is that wallet) and READ-ONLY: any write on it (new / edit / delete a row, transfer in or out, debt entry, recurring setting, goal money) answers 409 ACCOUNT_ARCHIVED until `POST /accounts/{id}/restore`. Idempotent. Returns the wallet (status archived).'
      responses:
        '200':
          description: 'The wallet, archived.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'ACCOUNT_HAS_MEMBERS: other members are still active.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      x-breaking: 'New endpoint (0.3.3).'
  /accounts/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post: {
        "tags": [
          "Accounts"
        ],
        "summary": "Restore an archived wallet",
