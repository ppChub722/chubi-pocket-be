      summary: Accept a split request ("add to my debts")
      operationId: acceptDebtSplitRequest
      description: |
        One-tap action on a split_created notification addressed to the caller: creates the caller's mirror entry (source kind `partner`, direction mirrored: the splitter's paid → my received) or returns the existing one (idempotent), and marks the notification actioned. No body. Errors: 400 VALIDATION_ERROR, 400 NOT_SPLIT_REQUEST, 403 NOT_FOR_YOU, 404 NOT_FOUND, 409 SPLIT_CHANGE_STALE, 409 NOTIFICATION_STATE_CONFLICT. Answers 201 even when the mirror already existed.
