    ProjectCreateTransactionRequest:
      type: object
      required: [transaction_member_id, type, amount, date]
      description: 'payback (0.4.0-3): transaction_member_id paid back splits[0].member_id; exactly one split for the whole amount (400 BAD_PAYBACK), tag_ids ignored, never auto-copied.'
      properties:
        transaction_member_id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [expense, income, payback] }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { $ref: '#/components/schemas/Date' }
        description: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 500 }
