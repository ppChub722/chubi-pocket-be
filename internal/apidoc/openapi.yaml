    NotificationType: {
        "type": "string",
        "description": "0.4.1-2 shared bills (migration 092, one CHECK for every new type; every one can be muted, and muting never stops an auto-sync apply, Q-B10 / Q-B14; a notice that still asks, applied false, comes even when muted, owner 2026-10-28): shared_bill_created — another member saved a new shared bill I have a part in; payload {project_transaction_id (the bill), project_id, project_kind event|split, project_name (null on split), description, amount (the bill), my_role payer|share|payback_from|payback_to, my_amount (what my copy holds), payer_name (as I see them), applied (true = my auto-sync switch was on: my copy is already in my book, info only; false = it asks: \"เพิ่มในสมุด\" = POST /event-bills/{project_transaction_id}/apply, or dismiss), personal_transaction_id (my copy when applied, else null)}, actor = the saver, deep_link /event-bills/{project_transaction_id}. Replaces project_tx_recorded_for_you (no longer sent; old rows keep rendering). project_tx_changed (an edit of a shared bill, events AND split bills): payload gains project_kind and applied (true = my switch applied it; false = \"อัปเดตตาม\" = POST /event-bills/{project_transaction_id}/apply, the old suggested / plain PUT is retired); a newer notice about the same bill supersedes the older unanswered one. shared_bill_deleted — a shared bill I hold a copy of was deleted; payload {project_transaction_id, project_id (null when its split was removed too), project_kind, project_name, description, amount, my_transaction_ids[], my_debt_ids[], applied (split bills: always true, my records are now plain; event bills (V13): true = my switch removed them, false = asks: apply = POST /event-bills/{id}/apply removes them, dismiss keeps them plain)}, deep_link /transactions/{my_transaction_ids[0]} or null. shared_bill_disconnected — another member disconnected their copy of a split bill; payload {project_transaction_id, project_kind, description, amount, person_name (them as I see them)}, deep_link /event-bills/{project_transaction_id}; info only. event_completed (V2) — the owner completed an event I am a linked member of: locked for good, my connected transactions / debts there stopped syncing (links kept); payload {project_id, project_name, owner_name}, actor = the owner, deep_link /projects/{project_id}; info only. event_member_removed (V15) — the owner removed me from an event: my transactions / debts booked from it stay in my book, disconnected; payload {project_id, project_name, transaction_count, debt_count}, actor = the owner, deep_link /projects (I can't open the event any more); info only. event_deleted (BE-2, migration 095, owner 2026-10-28) — the owner deleted an event I was in; its bills stay as standalone split bills, my copies / debts still connected; payload {project_id (gone), project_name, split_bill_count}, actor = the owner, deep_link /projects; info only, can be muted. debt_disconnected (0.4.1-1 D9 / B3): the other user disconnected their copy of a linked debt (\"X ตัดการเชื่อมหนี้ ฿300 แล้ว\"); payload {debt_id (MY entry, now a plain debt), key (my person key for them), person_name (their name as I see it), amount, direction (my entry's), description}, actor = them, deep_link /personal-debts/{debt_id}; info only (no action), it can be muted. recurring_due: ONE grouped notice while unread counting the occurrences that came due, payload {count}, deep_link /recurring?focus=due (ต้องจัดการ). recurring_ending: payload {recurring_id, name, left, start_date, end {kind: none|date|count, date?, count?}} (what ต่ออีก extends by), deep_link /recurring/{id}. recurring_auto_created: ONE quiet notice per user per day (read or not, the day's row only grows), payload {count, date} = the transactions auto-create recorded for that date, deep_link /recurring; it can be muted. All are written by the recurring due check, which runs inside GET /me/counts, GET /notifications/unread-count, GET /notifications, GET /dashboard and every recurring read (pull-to-refresh = recheck).",
