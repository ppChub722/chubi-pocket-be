openapi: 3.1.0
info:
  title: Chubi Pocket API
  version: 0.3.1-10
  description: |
    Source of truth for the API (0.3.1-9 rework, 0.3.1-10 debts + events). Served as JSON at `GET /api/v1/openapi.json`.
    Status: implemented; every operation is contract-tested (`apitest.Conform`).

    ## Rules this spec follows
    - **Old app builds don't matter.** 0.3.1-9 forces an update (`MIN_APP_BUILD` = its build). Shapes are clean: fields are renamed or replaced, snapshot keys are dropped, there are no "old key kept for old builds". Every breaking change carries `x-breaking`.
    - **Thin FE.** The FE only displays. One button = one call; one page open = one page-ready call; a write returns the final state (the changed resource, with every embedded ref resolved); aggregates, statuses and display flags are computed in the BE.
    - **No lookup lists.** Anything a row shows about another record (account / category / event / tag / person: name, icon, colour, flag) is embedded in the row. The FE never loads a whole list to look a name up by id. Pickers may still load their list.
    - **Person display name** (one SQL fragment, everywhere, including the contacts module): (1) the contact's `nickname` when it is set AND `show_nickname` is on → (2) else, when the contact is linked, the linked user's live profile name → (3) else the contact's `display_name` → (4) the stored snapshot `person_name` only when the row has no contact. Resolved server-side; the snapshot never reaches the FE when a contact exists.
    - **Wallet balances.** Every write returns the post-write balances of ALL wallets it touched (`account_balances: [{account_id, balance}]`; a transfer touches two). The FE patches its wallet cards from the response and never reloads `/accounts` after a write. That includes the money-moving writes of pages not redesigned yet (debt settle, event bills, quick create, scheduled generate-now): they are listed below as touch-points and gain only `account_balances`; the FE adopts it on those pages in their own rounds.
    - **Errors.** Any operation may also answer 400 / 401 / 403 / 404 / 409 with the `Error` schema; `error.code` is one of the registered codes (the `Error` enum = the server registry `internal/platform/apierr`, kept equal by a test; never renamed). Clients map the code to their own text and never show `message` (safe English, no internals: 500 causes are only logged). VALIDATION_ERROR always carries `details` = FieldError[] (`field` = the body JSON path or the query / path parameter, `code` = required / too_long / invalid ..., `params`). 426 APP_OUTDATED = update the app. A tag id that is not the caller's is 400 TAG_NOT_FOUND. No rate or daily limit exists yet, so no 429.
    - **Keys.** A response object always carries every documented key; "none" is `null`; arrays are never `null`. Money is a JSON number in the row's currency (2 decimals, never a string). Dates are `YYYY-MM-DD` (the user's calendar date), timestamps RFC 3339. Ids are UUIDs.
    - **Envelope (unchanged).** A single resource is the bare object; a list is `{data, pagination}` (or `{data, count}` where noted); errors are `{success:false, error:{code, message, details}}`.
    - `x-used-by` = `[{page, calls}]`: the FE pages that call the operation and how many times per page open (or per user action). `x-breaking` = a string saying what breaks.

    ## Scope of this draft (v2)
    **Every endpoint the reached pages use, in its target shape**: home / dashboard, transaction list + detail + forms (incl. the one-call `getTransactionFormOptions`), quick create, pending, wallets (+ members), categories, tags, contacts (+ link requests), notifications + settings, more, auth / me / app version.
    **0.3.1-10:** debts are a person ledger (tag Debts: people / person / entries; an entry with a wallet owns its transaction) and events are page-ready (tag Events: one-call detail, nested board, event tags, my tags on an event, a patch from every write).
    **Recurring** (tag Recurring) replaces the scheduled module: settings (the rule) + their occurrences, COMPUTED from the rule on every read (0.4.0-2) and stored only once edited / recorded / paid / skipped, addressed by setting id + slot (the original date); an occurrence links to one transaction.
    Pages not yet reached (budgets, goals) only receive the shared-shape change that applies to them; those operations are tagged `Touch-point`.
    The hub's "used by" comes from the FE page-flow registry (page → trigger → operationId), so `x-used-by` is optional; `operationId`s are stable.

    ## Coverage
    The `x-registered-routes` / `x-spec-routes` fields (added when served) count the routes the server registers and the method + path pairs described here. Routes not yet in this spec keep their current shape (see the coverage note in `ai/inbox/be.md`).
  x-contact-person-name-rule: (nickname if set and show_nickname) -> linked user's profile name -> contact display_name -> snapshot person_name
servers:
  - url: /api/v1
    description: 'Same origin as the app''s API base URL.'
tags:
  - name: Transactions
  - name: Pending
  - name: Me
  - name: Categories
  - name: Contacts
  - name: Notifications
  - name: Dashboard
  - name: Debts
    description: 'The person ledger (0.3.1-10).'
  - name: Events
    description: 'Events (code name projects, 0.3.1-10).'
  - name: Recurring
    description: 'Recurring settings + the items they produce (0.3.1-10, replaces scheduled).'
  - name: Sync
    description: 'Shared datasets kept on the device, fetched in one call (migration 66).'
  - name: Touch-point
    description: 'Pages not redesigned yet; only the shared-shape change is listed.'
  - name: Internal
    description: 'Called by outside services (the Telegram bot webhook), never by the app; `x-internal: true`.'
  - name: Connections
    description: 'Outside apps (Telegram, LINE, Google) and profile pictures (0.4.2 1b).'
security:
  - bearerAuth: []

paths:
  # ───────────────────────────── Transactions ─────────────────────────────
  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions (page-ready rows)
      description: |
        Every row carries its account, category, event, tags and (for transfers) the twin, already resolved. `totals` cover the whole filtered set, not just the page.
      operationId: listTransactions
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: account_id, in: query, description: 'Repeatable; rows on ANY of these wallets (OR-ed with no_wallet). Groups are AND-ed: wallet AND category AND tag AND type.', schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: true }
        - { name: category_id, in: query, description: 'Repeatable; rows in ANY of these categories (OR-ed with uncategorized).', schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: true }
        - { name: include_children, in: query, description: 'With category_id, also its sub-categories.', schema: { type: boolean } }
        - { name: uncategorized, in: query, schema: { type: boolean } }
        - { name: type, in: query, description: 'Repeatable; rows of ANY of these types.', schema: { type: array, items: { type: string, enum: [expense, income, transfer] } }, style: form, explode: true }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/Date' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/Date' } }
        - { name: no_wallet, in: query, description: 'Rows without a wallet (OR-ed with account_id).', schema: { type: boolean } }
        - { name: no_tags, in: query, description: 'Rows without any tag (OR-ed with tag_id).', schema: { type: boolean } }
        - { name: amount_min, in: query, description: 'Rows whose amount is at least this (>= 0).', schema: { type: number, minimum: 0 } }
        - { name: amount_max, in: query, description: 'Rows whose amount is at most this (>= amount_min).', schema: { type: number, minimum: 0 } }
        - { name: include_archived, in: query, description: 'Rows on archived wallets are hidden by default; true shows them (listing that wallet by account_id always does).', schema: { type: boolean } }
        - { name: q, in: query, description: 'Substring over description, note, category (incl. parent) and wallet names (max 100).', schema: { type: string, maxLength: 100 } }
        - { name: tag_id, in: query, description: 'Repeatable; rows having ANY of these tags.', schema: { type: array, items: { $ref: '#/components/schemas/Uuid' } }, style: form, explode: true }
        - { name: sort, in: query, schema: { type: string, enum: [date_desc, date_asc, amount_desc, amount_asc], default: date_desc } }
        - { name: can_join_event, in: query, description: 'true = only rows I may pull into an event (the event "add existing bills" picker): mine, expense / income, not in an event, not a debt entry or system row, no split labelled paid.', schema: { type: boolean } }
        - { name: counterparty_key, in: query, description: 'Only the money of this debt person: the wallet transactions of their debts, the bills split with them, the bills they paid or received for me (paid_by, incl. a partner''s split mirrored into my book), and the transactions of their repayments (0.4.1-1: every person-book row''s transaction, `counterparty.key` = this key).', schema: { $ref: '#/components/schemas/PersonKey' } }
      responses:
        '200':
          description: 'One page of rows plus totals over the whole filtered set.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: "Row shape changes (see Transaction): account/category/project become full refs, is_resolve is renamed is_repayment, category_render / is_recurring are gone, transfer rows gain transfer_peer."
      x-used-by:
        - { page: transactions-list, calls: 1 }
        - { page: wallet-detail, calls: 1 }
        - { page: category-detail, calls: 1 }
    post:
      tags: [Transactions]
      summary: Create a transaction (or a transfer)
      description: |
        Returns a `TransactionWriteResult`: `rows` (one row, or both rows of a transfer) in their final state + `account_balances`. `tag_ids` attach the tags in the same call; with `splits`, the response already contains them (`splits[]` with resolved persons).
        `project_id` is not accepted (events are joined through the bills endpoints).
        **0.4.1-2: `splits` and `paid_by` are DEPRECATED** — every split / "จ่ายแทน" / "รับแทน" is a split bill saved by POST /event-bills (`split: true`; จ่ายแทน = payer that person, members me + them); these fields stay until the app moved (S16 removes them).
        **paid_by (0.4.0-3, quick create tab "จ่ายแทน")**: bill 123, Lee paid 13 → `{type: expense, amount: 123, account_id: <wallet>, paid_by: {person_name: "Lee", amount: 13}}`: ONE expense of 123 (reports / budgets / my_share count 123), the wallet moves 110 (`wallet_amount`), and the debt "I owe Lee 13" is made in the same call (`rows[0].paid_by`, `person_balance` = Lee's new balance). paid_by.amount = amount → no wallet. **On an income (0.4.1-0, tab "รับแทน")** Lee RECEIVED 13 of my 123 for me: `{type: income, …, paid_by: {person_name: "Lee", amount: 13}}` = ONE income of 123, the wallet takes 110 and the debt is "Lee owes me 13" (a paid entry). Errors: 400 PAID_BY_EXPENSE_ONLY (a transfer), PAID_BY_EXCEEDS_AMOUNT, LINK_MODE_CONFLICT (with splits / source_project_transaction_id), CONTACT_NOT_FOUND, VALIDATION_ERROR (no person).
        **A date after today (the user's timezone)** is allowed and makes a normal transaction (0.4.0-2: there is no upcoming one-off item any more). It stays in the transactions list but counts nowhere until its day: wallet `balance` (and `account_balances`), month flows, reports, the dashboard and a budget's `used` all stop at today; a budget counts it as รอจ่าย (source `future_tx`) while its period is current.
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
            examples:
              expenseWithSplitAndTags:
                value:
                  type: expense
                  account_id: 0191c2a0-0000-7000-8000-000000000001
                  category_id: 0191c2a0-0000-7000-8000-000000000002
                  amount: 300
                  date: '2026-10-12'
                  description: 'Dinner'
                  tag_ids: [0191c2a0-0000-7000-8000-000000000003]
                  splits: [{ person_name: Beam, contact_id: null, owed_amount: 100 }]
      responses:
        '201':
          description: "The created row(s) and the touched wallets' balances."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionWriteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-breaking: "Request: tag_ids added, project_id removed. Response: TransactionWriteResult {rows, account_balances} (was a bare Transaction / {transfer_group_id, rows})."
      x-used-by:
        - { page: quick-create-sheet, calls: 1 }
        - { page: pending, calls: 0 }
  /transactions/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Transactions]
      summary: Transaction detail (page-ready)
      description: 'One call renders the whole detail page: refs, tags, event, transfer twin, the splits (with resolved persons) and the capability flags.'
      operationId: getTransaction
      responses:
        '200':
          description: 'The row with `splits` filled in (an empty array when it has none).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: Shape changes, see Transaction.
      x-used-by:
        - { page: transaction-detail, calls: 1 }
    put:
      tags: [Transactions]
      summary: Edit a transaction
      description: |
        Partial body; a key present with `null` clears the field. `tag_ids` (when present) REPLACES the tag set. Returns a `TransactionWriteResult` (the edited row, both rows for a transfer, and the touched wallets' balances; moving a row to another wallet touches two).
        `also_update_link` (the app asks at save): when the row is an event bill's origin (`event_bill.linked`), the same change goes to the bill too; without it only this row changes (no notification either way). A recurring occurrence (`recurring_item`) is never asked about (0.4.1-1 R1): the occurrence it fills reads every value from this row, so an edit shows there at once.
        `paid_by` (0.4.0-3): see UpdateTransactionRequest.paid_by; the response's `person_balance` is the paid-by person's new balance (or the old person's when it was removed). Errors: 400 PAID_BY_EXPENSE_ONLY / PAID_BY_EXCEEDS_AMOUNT / LINK_MODE_CONFLICT. (409 PAID_BY_LOCKED is gone with the partner mirror, 0.4.1-2 S16.)
        **Link-mode switch (0.4.0-3 B3)**: `link_mode` (personal | split | paid | event) with that mode's data (`splits` / `paid_by` / `event {project_id, payer?, members?}`) switches how the bill is shared in ONE call: the old mode's data goes first (an origin's event bill is removed / a copy unlinked; split debts deleted, linked partners get split_changed removed; the paid-by debt deleted), then the new one is written. Into an event: I paid → the row becomes the bill; someone else paid → the row becomes my share with no wallet. Repayments are never touched. `person_balances` lists every person whose balance moved. Author only (403 SPLITS_AUTHOR_ONLY); not on a debt's wallet side or a repayment (400 SYSTEM_TRANSACTION_IMMUTABLE). Errors: 400 LINK_MODE_INPUT (the new mode without its data), LINK_MODE_CONFLICT (another mode's data sent), SPLITS_EXCEED_AMOUNT. Without link_mode, `splits` edits a split row (LINK_MODE_CONFLICT on a paid / event row) and `event` is refused.
        **`?preview=true`**: a dry run. The whole edit runs and is rolled back; the answer is `TransactionPreview` (the row as it would be, every touched person's balance before / after, every touched wallet's balance before / after). Use it for the confirm dialog of a mode switch. Nothing is saved, no notification goes out.
        **apply_to_event** ("แก้ในอีเวนต์ด้วย", B3): the row's amount / date / description / note go to its event bill (an origin also sends its tags as event tags; a copy's amount becomes my share on the bill). The bill's other people get project_tx_changed. `also_update_link` does the same for events.
        **A date after today** is allowed (0.4.0-2): the row stays a transaction dated in the future (counts nowhere until its day, see create); no upcoming item, no `FUTURE_DATE_NOT_ALLOWED`.
        **0.4.1-2 S9, a copy of a shared bill** (`event_bill.edit_in_bill` true: connected, the event not completed): the bill's values are edited in the bill form only. Here only my own fields: `category_id`, `tag_ids`, `private_note`, and `account_id` when the money is mine to place (I paid, or I paid back: not while `paid_by` "จ่ายโดย X"). Anything else (amount, date, description, note, type, paid_by, splits, link_mode, event, apply_to_event) → 409 SHARED_BILL_FIELD (`details.fields`). A disconnected copy / a completed event's copy is a plain transaction again. `apply_to_event` / `also_update_link` to an event are retired (the bill form saves the bill).
        `private_note` (0.4.1-2 S11): only on a copy of a shared bill (else 400 PRIVATE_NOTE_NOT_SHARED); never synced, never notified.
      operationId: updateTransaction
      parameters:
        - { name: preview, in: query, description: 'true = dry run (TransactionPreview), nothing saved.', schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTransactionRequest' }
      responses:
        '200':
          description: "The edited row(s) and the touched wallets' balances (with preview=true: TransactionPreview)."
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/TransactionWriteResult' }
                  - { $ref: '#/components/schemas/TransactionPreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "Request: tag_ids added. Response: TransactionWriteResult {rows, account_balances}."
      x-used-by:
        - { page: transaction-detail, calls: 1 }
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      description: |
        Returns the wallet balances after the delete so the FE patches instead of refetching accounts.
        A row that fills a recurring occurrence (`recurring_item`) always SKIPS it, in the same DB transaction, with nothing to ask (0.4.1-1 R2): the occurrence keeps the row's last values (amount, wallet, category, tags, description, note, date) and turns skipped; un-skipping it brings it back due with those values. Every path that deletes a transaction does this (a debt's, an event bill's, a split's). The answer's `recurring_item_id` is that occurrence and `effects.slots` holds it. `skip_occurrence` is gone (ignored when sent). An event bill row (`event_bill.linked`) asks "ลบรายการที่ผูกไว้ด้วยไหม": `also_delete_link=true` deletes the event bill made from it too (only when I may edit the event: an active non-viewer member of an event that is not cancelled / archived); without it the bill stays, unlinked. A person-book entry's transaction (debt or repayment, `counterparty`) leaves its entry behind, ledger-only (0.4.1-1 D1: deleting my tx = disconnecting it; the person's balance doesn't move); a split bill's split debts go with it (D8). The answer's `effects` lists all of it.
        **0.4.1-2, a copy of a shared bill** (event or split, `event_bill` set): deleting it = disconnecting it (rule f): the bill and the other members are unchanged; my debts of the bill stay as plain debts; the bill no longer reaches me (as POST /event-bills/{pt_id}/disconnect). `also_delete_link` is ignored on a shared bill (delete the bill in the bill form: DELETE /event-bills/{pt_id}).
      operationId: deleteTransaction
      parameters:
        - { name: also_delete_link, in: query, description: 'Event bills: delete the bill made from it too.', schema: { type: boolean } }
      responses:
        '200':
          description: 'Deleted.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteTransactionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: Response is DeleteTransactionResult (was {success, message}).
      x-used-by:
        - { page: transaction-detail, calls: 1 }
  /transactions/{id}/splits:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Transactions]
      summary: Replace a bill's splits (whole list)
      description: |
        **DEPRECATED 0.4.1-2** (S16 removes it): a split bill is edited by every member in the split bill form (PUT /event-bills/{pt_id}).
        Body = the whole new list; a split left out is removed; `[]` removes all. Each item is an existing `debt_id` (kept / re-amounted) or a new person.
        **Person rules.** A split WITH a contact (kept or new) takes the contact's name: a sent `person_name` is ignored. A free-name split (no contact) renames in place via `person_name`. Changing the contact of a split whose contact is linked to an app user = remove + add (new `debt_id`, the old partner gets `split_changed`, the new one `split_created`); an unlinked contact changes in place. No identity lock.
        Returns the full `Transaction` (its `splits[]` are the new state).
      operationId: editSplits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditSplitsRequest' }
      responses:
        '200':
          description: 'The bill, final state.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "A sent person_name on a split that has a contact is ignored (was: an in-place rename for the same linked contact). Response is the Transaction shape."
      x-used-by:
        - { page: split-editor, calls: 1 }
  /transactions/{id}/tags:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Transactions]
      summary: Set a transaction's tags (replace the whole set)
      description: 'One call replaces `DELETE × removed + POST + GET`. `[]` clears the tags. Returns the full `Transaction`.'
      operationId: setTransactionTags
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTagsRequest' }
      responses:
        '200':
          description: 'The row with its new tags.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-breaking: "New endpoint. POST /transactions/{id}/tags and DELETE /transactions/{id}/tags/{tag_id} are REMOVED — use this."
      x-used-by:
        - { page: transaction-detail, calls: 1 }
        - { page: edit-transaction-sheet, calls: 1 }
  /transactions/{id}/apply-event:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    post:
      tags: [Transactions]
      summary: Make my transaction match its event bill now ("อัปเดตตามอีเวนต์")
      description: |
        0.4.0-3 B3 (my book vs the event book): my transaction linked to an event bill (event_bill set; origin = made from it, copy = my share) takes the bill AS IT IS NOW: amount (the bill for an origin, my share for a copy), date, description, note; the bill's event tags I have as personal tags are added. My unanswered project_tx_changed notices about it are marked actioned. Use it from tx detail when event_bill.in_sync is false, or later from a notice. No body.
        Errors: 404 NOT_FOUND / TX_NOT_IN_PROJECT (not in an event), 422 NO_SHARE_TO_COPY (a copy whose share is now 0), 409 ACCOUNT_ARCHIVED.
        **0.4.1-2 S7:** the same as POST /event-bills/{bill_id}/apply for this transaction's bill: my debts of the bill follow too, and the answer carries `effects` (my debts, the people's balances). Errors as that call.
      operationId: applyEventToTransaction
      responses:
        '200':
          description: 'The row, now in sync, the touched wallet, and effects (0.4.1-2: my debts of the bill too).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionWriteResult' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-used-by:
        - { page: transaction-detail, calls: 1 }
        - { page: notifications, calls: 1 }

  # ───────────────────────────── Pending ─────────────────────────────
  /pending-transactions:
    get:
      tags: [Pending]
      summary: List pending drafts (page-ready)
      description: 'Newest first. Each draft carries `resolved` (its account / wallets / category / tags / event / split persons, embedded), so the page needs no other call.'
      operationId: listPending
      responses:
        '200':
          description: 'All drafts of the caller.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingList' }
      x-breaking: Each item gains `resolved` (additive); the list envelope is unchanged.
      x-used-by:
        - { page: pending, calls: 1 }
        - { page: home, calls: 0 }
    post:
      tags: [Pending]
      summary: Save manual drafts (1–100, all or nothing)
      description: 'Drafts may be incomplete or unbalanced; only shape errors are rejected. The event (`draft.project_id`) is not checked until submit.'
      operationId: createPending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePendingRequest' }
      responses:
        '201':
          description: 'The created drafts, resolved.'
          content:
            application/json:
              schema:
                type: object
                required: [data, summary]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PendingTransaction' } }
                  summary: { $ref: '#/components/schemas/PendingSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
      x-used-by:
        - { page: quick-create-sheet, calls: 1 }
        - { page: pending, calls: 1 }
  /pending-transactions/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    put:
      tags: [Pending]
      summary: Replace a draft (clears last_error)
      operationId: updatePending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePendingRequest' }
      responses:
        '200':
          description: 'The draft, resolved.'
