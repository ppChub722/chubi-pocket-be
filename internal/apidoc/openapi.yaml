        - { name: month, in: query, description: 'YYYY-MM (400 VALIDATION_ERROR otherwise).', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: status, in: query, schema: { type: string, enum: [active, completed, archived] } }
        - { name: sort, in: query, description: 'created (default) | deadline (nearest first, none last) | progress (most done first) | remaining (least left first) | name.', schema: { type: string, enum: [created, deadline, progress, remaining, name] } }
