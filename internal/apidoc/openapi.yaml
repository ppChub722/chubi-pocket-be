        payer: { oneOf: [{ $ref: '#/components/schemas/MemberRef' }, { type: 'null' }], description: '0.4.0-3: who paid the bill (is_me = I did). Detail and write answers; null on list rows.' }
        bill_amount: { $ref: '#/components/schemas/Money', description: 'The whole bill (0 on list rows).' }
        members: { type: [array, 'null'], items: { $ref: '#/components/schemas/BillShare' }, description: 'Everyone in the bill with their share, the payer first (the rest of the bill); rebuilds the quick-create อีเวนต์ tab. Null on list rows.' }
        kind: { type: string, enum: [origin, copy], description: '0.4.0-3 B3: origin = the bill was made from this transaction (amount = the bill); copy = my share of a bill (amount = my share).' }
        in_sync: { type: [boolean, 'null'], description: 'Live: true when this transaction matches its bill (amount as the kind says, date, description, note; tags are not compared). 0.4.1-2 S8: filled on list rows too ("ไม่ตรง" on the tile). Null on another member''s row.' }
        differences: { type: [array, 'null'], items: { $ref: '#/components/schemas/BillDifference' }, description: 'Live, what differs (mine vs the event''s). [] when in sync; 0.4.1-2: filled on list rows too; null on another member''s row.' }
