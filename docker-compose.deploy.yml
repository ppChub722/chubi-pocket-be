services:
  db:
    image: postgres:15-alpine
    container_name: chubi_pocket_db
    # Bind only to localhost — never expose Postgres publicly.
    # The `app` service reaches it over the compose network as host `db`.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: migrate/migrate
    container_name: chubi_pocket_migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database"
      - "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: chubi_pocket_app
    # No published port — Caddy reverse-proxies to app:8080 over the compose network.
    expose:
      - "8080"
    environment:
      APP_NAME: chubipocket
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-720}
      SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT:-10}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-10}
      SERVER_IDLE_TIMEOUT: ${SERVER_IDLE_TIMEOUT:-120}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: chubi_pocket_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
