version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finna_bbear_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=chubadmin
      - POSTGRES_PASSWORD=admin1234
      - POSTGRES_DB=finna_bbear_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
